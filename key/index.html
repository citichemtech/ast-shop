<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AST — คีย์ออเดอร์</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#0b1220;color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;
    font:18px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  img{width:148px;height:148px}
  h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em}
  p{margin:0;color:#9fb0c9;font-size:15px;max-width:22em}
  a.go{display:block;margin-top:6px;background:#1449C4;color:#fff;text-decoration:none;
    font-weight:700;font-size:18px;padding:15px 30px;border-radius:12px;min-width:230px}
  a.go:active{background:#0f3a9e}
  .sm{font-size:13px;color:#6f8199}
  .sm a{color:#9fb0c9}
</style>
</head>
<body>
  <img src="./icon-192.png" alt="STOCK LIST CITI">
  <h1>AST — คีย์ออเดอร์</h1>
  <p id="msg">กำลังเปิดระบบ…</p>
  <a class="go" id="go" href="https://script.google.com/macros/s/AKfycbyDpE7FzxKd1sU4yud6Oj82GStbrfHD5yagc6sKo1_o2ciZ2HYBxUrq6yqmJx8qvQGjow/exec">เปิดระบบคีย์ออเดอร์</a>
  <p class="sm">เปลี่ยนลิงก์ระบบได้ที่ <a href="#" id="edit">แก้ลิงก์</a></p>

<script>
/* หน้านี้มีไว้อย่างเดียว — ให้ติดตั้งลงหน้าจอโฮมเป็นแอปจริง แล้วพาเข้าระบบคีย์ออเดอร์
   เหตุที่ต้องมี: หน้าของ Apps Script ติดตั้งเป็นแอปไม่ได้ (Google เสิร์ฟไว้ใน iframe
   ของโดเมนตัวเอง) กด "เพิ่มลงหน้าจอโฮม" จึงได้แค่ทางลัด ซึ่งแอนดรอยด์จะแปะตรา Chrome
   ทับมุมไอคอนเสมอ · หน้านี้อยู่บนโดเมนของร้านเอง จึงติดตั้งเป็นแอปได้ ไอคอนสะอาด */
var DEFAULT_URL = "https://script.google.com/macros/s/AKfycbyDpE7FzxKd1sU4yud6Oj82GStbrfHD5yagc6sKo1_o2ciZ2HYBxUrq6yqmJx8qvQGjow/exec";

/* ใช้คีย์เดียวกับปุ่มในหน้าหลังร้าน กด "แก้ลิงก์" ที่ไหนก็ได้ผลเหมือนกัน */
function stockUrl(){
  var u = "";
  try { u = localStorage.getItem("ast-stock-url") || "" } catch(e){}
  return u || DEFAULT_URL;
}

var go = document.getElementById("go");
go.href = stockUrl();

document.getElementById("edit").onclick = function(e){
  e.preventDefault();
  var u = prompt("วางลิงก์ระบบคีย์ออเดอร์ (ลงท้ายด้วย /exec)\nเว้นว่างแล้วกดตกลง = กลับไปใช้ลิงก์เดิม", stockUrl());
  if (u === null) return;
  u = u.trim();
  try {
    if (u) localStorage.setItem("ast-stock-url", u);
    else localStorage.removeItem("ast-stock-url");
  } catch(err){}
  go.href = stockUrl();
  document.getElementById("msg").textContent = "เปลี่ยนลิงก์แล้ว กดปุ่มข้างล่างเพื่อเข้าระบบ";
  STOP = true;
};

/* พาเข้าระบบให้เองเฉพาะตอนเปิดจากไอคอนที่ติดตั้งไว้แล้วเท่านั้น
   ถ้าเปิดในแท็บเบราว์เซอร์ธรรมดาต้องอยู่นิ่ง ๆ ไม่งั้นเด้งออกไปก่อน
   แล้วจะไม่มีจังหวะให้กด "ติดตั้งแอป" ได้เลย ซึ่งคือเหตุผลเดียวที่มีหน้านี้
   ต่อท้าย ?stay=1 ก็ค้างหน้านี้ได้ เผื่อลิงก์เสียแล้วต้องเข้ามาแก้ */
var STOP = /[?&]stay=1/.test(location.search);
var INSTALLED = window.matchMedia("(display-mode: standalone)").matches
             || window.navigator.standalone === true;

if (INSTALLED && !STOP) {
  /* ใช้ replace ไม่ใช่ href เพื่อไม่ให้ปุ่มย้อนกลับเด้งกลับมาหน้านี้วนไปเรื่อย ๆ */
  setTimeout(function(){ if (!STOP) location.replace(stockUrl()) }, 700);
} else {
  document.getElementById("msg").innerHTML = STOP
    ? "แก้ลิงก์เสร็จแล้วกดปุ่มข้างล่างเข้าระบบได้เลย"
    : "กดปุ่มข้างล่างเข้าระบบได้เลย<br>"
      + "หรือกดเมนู <b>⋮</b> ของ Chrome → <b>ติดตั้งแอป</b> "
      + "เพื่อปักไอคอนนี้ไว้หน้าจอโฮม (ไม่มีตรา Chrome ทับ)";
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
</html>
