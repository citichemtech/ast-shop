function copyText(text, okMsg){
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99999);
  var done=false; try{done=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
  if(!done && navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){toast(okMsg)}) }
  else toast(done?okMsg:"กดค้างที่ข้อความเพื่อคัดลอก");
}

/* ------------------------------------------------------------------ สรุปยอด */

/* ช่วงเวลาที่ดูได้ — ชุดเดียวกับที่ร้านใช้คิดงานจริง (วันนี้ / เมื่อวาน / 7 วัน / เดือนนี้) */
var RANGES = [
  { key:"today", label:"วันนี้" },
  { key:"yday",  label:"เมื่อวาน" },
  { key:"7d",    label:"7 วันล่าสุด" },
  { key:"month", label:"เดือนนี้" },
  { key:"all",   label:"ทั้งหมด" }
];
var SUM_RANGE = "today";
var SUM_CACHE = null;

function isoShift_(days){
  var d = new Date(); d.setDate(d.getDate() + days);
  var p = function(n){ return n < 10 ? "0" + n : "" + n };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function inRange_(iso, key){
  if (!iso) return false;
  if (key === "all")   return true;
  if (key === "today") return iso === isoShift_(0);
  if (key === "yday")  return iso === isoShift_(-1);
  if (key === "7d")    return iso >= isoShift_(-6) && iso <= isoShift_(0);
  if (key === "month") return iso.slice(0,7) === isoShift_(0).slice(0,7);
  return true;
}

/** แถวแท่งนอนหนึ่งแถว — ชื่อ · ตัวเลขหลัก · แท่ง · บรรทัดรายละเอียด */
function bar_(name, value, sub, ratio){
  return '<div class="brow">'
    + '<div class="btop"><span class="bname">' + esc(name) + '</span>'
    + '<b class="bval">' + value + '</b></div>'
    + '<div class="btrack"><i style="width:' + Math.max(2, Math.round(ratio*100)) + '%"></i></div>'
    + (sub ? '<div class="bsub">' + esc(sub) + '</div>' : '')
    + '</div>';
}

/** จัดกลุ่มแล้วเรียงจากมากไปน้อย คืนมาไม่เกิน top แถว */
function group_(list, keyOf, addOf, top){
  var m = {};
  list.forEach(function(o){
    var k = keyOf(o) || "ไม่ระบุ";
    if (!m[k]) m[k] = { key:k, n:0, v:0, extra:0 };
    m[k].n++;
    addOf(m[k], o);
  });
  var arr = Object.keys(m).map(function(k){ return m[k] });
  arr.sort(function(a,b){ return b.v - a.v });
  return top ? arr.slice(0, top) : arr;
}

function section_(title, rows){
  if (!rows) return "";
  return '<div class="card"><div class="subhd" style="margin-top:0">' + esc(title) + '</div>' + rows + '</div>';
}

function loadSummary(){
  /* ปุ่มช่วงเวลาวาดครั้งเดียว กดสลับแล้วคำนวณจากข้อมูลชุดเดิม ไม่ต้องยิงชีทซ้ำ */
  if (!$("#sum-range").innerHTML){
    $("#sum-range").innerHTML = RANGES.map(function(r){
      return '<button data-r="' + r.key + '"' + (r.key===SUM_RANGE?' class="on"':'') + '>' + r.label + '</button>';
    }).join("");
    $("#sum-range").addEventListener("click", function(e){
      var b = e.target.closest("button[data-r]"); if(!b) return;
      SUM_RANGE = b.dataset.r;
      $$("#sum-range button").forEach(function(x){ x.classList.toggle("on", x.dataset.r===SUM_RANGE) });
      /* แถบปุ่มเลื่อนได้ ปุ่มที่เลือกต้องอยู่ในสายตาเสมอ ไม่งั้นกดแล้วไม่รู้ว่าอยู่ช่วงไหน */
      if (b.scrollIntoView) b.scrollIntoView({ block:"nearest", inline:"center" });
      if (SUM_CACHE) drawSummary(SUM_CACHE);
    });
  }
  /* วาดที่ตั้งลายเซ็นทุกครั้งที่เข้าหน้านี้ ไม่ผูกกับว่ามีออเดอร์ในช่วงที่เลือกหรือไม่ */
  drawSigSettings();
  drawAlerts();
  if (SUM_CACHE) { drawSummary(SUM_CACHE); drawDue(SUM_CACHE); return; }
  $("#summary").innerHTML = '<div class="load">กำลังโหลด…</div>';
  call("getOrders", [500], function(list){
    SUM_CACHE = list;
    if (!ORDERS.length) ORDERS = list;
    drawSummary(list);
    drawDue(list);
  }, function(m){
    $("#summary").innerHTML = '<div class="empty" style="color:var(--red)">โหลดไม่สำเร็จ<br>' + esc(m) + '</div>';
  });
}

/* ------------------------------------------------------------ ค้างชำระ

   ชีทมีช่องสถานะอยู่แล้ว แต่ไม่มีที่ไหนรวมให้ดูว่าใครยังไม่จ่าย รวมเท่าไร
   ของที่เก็บเงินปลายทางกับลูกค้าเครดิต ถ้าไม่มีที่รวมก็ตกหล่นได้ทั้งใบ
   เรียงใบเก่าสุดขึ้นก่อน เพราะใบที่ค้างนานที่สุดคือใบที่ต้องโทรก่อน   */

function drawDue(all){
  var box = $("#sum-due");
  if(!box) return;

  var due = (all||[]).filter(function(o){
    var st = String(o.status||"").trim();
    return st !== "ชำระแล้ว" && st !== "ยกเลิก" && Number(o.net||0) > 0;
  });
  if(!due.length){
    box.innerHTML = '<div class="card"><div class="sum big" style="border:0;margin:0;padding:2px 0">'
      + '<span>ค้างชำระ</span><b style="color:var(--green)">ไม่มี ✓</b></div></div>';
    return;
  }

  /* เก่าสุดขึ้นก่อน — ใบที่ค้างนานที่สุดคือใบที่ต้องตามก่อน */
  due.sort(function(a,b){ return String(a.date) < String(b.date) ? -1 : 1 });
  var total = 0;
  due.forEach(function(o){ total += Number(o.net)||0 });

  var today = todayISO();
  function daysAgo(d){
    var a = new Date(String(d)+"T00:00:00"), b = new Date(today+"T00:00:00");
    var n = Math.round((b-a)/86400000);
    return isNaN(n) ? 0 : n;
  }

  box.innerHTML = '<div class="card">'
    + '<div class="sum big" style="border:0;margin:0;padding:2px 0">'
    +   '<span>ค้างชำระ ' + due.length + ' ใบ</span>'
    +   '<b style="color:var(--amber)">' + baht(total) + '</b></div>'
    + '<div id="due-list" style="margin-top:6px">'
    + due.slice(0,8).map(function(o,i){
        var d = daysAgo(o.date);
        return '<div class="row"><div class="i">'
          + '<b>' + esc(o.cust||"ไม่ระบุชื่อ") + '</b>'
          + '<span>' + esc(o.no) + ' · ' + esc(thaiDate(o.date))
          + (d > 0 ? ' · <span style="color:' + (d>=7?'var(--red)':'var(--amber)') + '">ค้าง '
                     + d + ' วัน</span>' : '')
          + '</span><br>'
          + '<span style="color:var(--ink);font-weight:700">' + baht(o.net) + '</span> '
          + '<span class="tag ' + statusTag(o.status) + '">' + esc(o.status||"-") + '</span>'
          + '</div><div class="acts">'
          + '<button class="sq" data-due-sm="' + esc(o.no) + '" title="ทวงถาม / ส่งข้อความ">💬</button>'
          + '<button class="sq" data-due-pd="' + esc(o.no) + '" title="ทำเครื่องหมายว่าชำระแล้ว">✓</button>'
          + '</div></div>';
      }).join("")
    + '</div>'
    + (due.length > 8 ? '<div class="hint">แสดง 8 ใบแรกจากทั้งหมด ' + due.length + ' ใบ</div>' : '')
    /* ชีทมีช่องสถานะช่องเดียว บอกทั้ง "จ่ายหรือยัง" และ "ส่งหรือยัง" พร้อมกันไม่ได้
       ระบบจึงนับเฉพาะ "ชำระแล้ว" ว่าเก็บเงินได้แล้ว อย่างอื่นถือว่ายังค้าง
       ใบที่เก็บเงินแล้วแต่ยังไม่ได้เปลี่ยนสถานะจะโผล่ตรงนี้ กด ✓ ปิดได้เลย */
    + '<div class="hint">นับเฉพาะใบที่สถานะยังไม่ใช่ “ชำระแล้ว” · '
    + 'เก็บเงินแล้วกด ✓ เพื่อปิดยอด</div>'
    + '</div>';

  function find(no){ return (all||[]).filter(function(o){ return o.no === no })[0] }
  $$("#due-list [data-due-sm]").forEach(function(b){
    b.onclick = function(){ var o = find(b.getAttribute("data-due-sm")); if(o) openMsg(o) };
  });
  $$("#due-list [data-due-pd]").forEach(function(b){
    b.onclick = function(){
      var no = b.getAttribute("data-due-pd");
      if(!confirm("ทำเครื่องหมายว่าออเดอร์ " + no + " ชำระแล้ว?")) return;
      b.disabled = true;
      api("setTracking", no, undefined, "ชำระแล้ว").then(function(){
        toast("บันทึกว่า " + no + " ชำระแล้ว");
        SUM_CACHE = null; ORDERS = [];
        loadSummary();
      }, function(e){
        b.disabled = false;
        toast("ไม่สำเร็จ: " + (e && e.message ? e.message : e));
      });
    };
  });
}

/* --------------------------------------------- ของใกล้หมด + ล็อตใกล้หมดอายุ

   ทำระบบล็อตมาทั้งชุดเพื่อคุมวันหมดอายุของเคมี แต่ไม่มีอะไรเตือนเลย
   ของที่หมดอายุคือของที่ขายไม่ได้ และรู้ตอนลูกค้าสั่งแล้วคือสายไป
   คิดจากข้อมูลที่โหลดมาตอนเปิดแอปอยู่แล้ว ไม่ต้องยิงชีทเพิ่ม        */

var EXP_SOON_DAYS = 60;

function drawAlerts(){
  var box = $("#sum-alert");
  if(!box) return;

  var lots = (BOOT && BOOT.lots) || {};
  var def = Number(BOOT && BOOT.reorderDefault) || 0;
  var low = [], exp = [];
  var now = Date.now();

  (CFG.products||[]).forEach(function(p){
    var remain = p.remain;
    var point = (p.reorder === null || p.reorder === undefined || p.reorder === "")
      ? def : Number(p.reorder);
    if(remain !== null && remain !== undefined && point > 0 && Number(remain) <= point){
      low.push({ sku:p.sku, name:p.name, remain:Number(remain), point:point, unit:p.unit });
    }
    var l = lots[p.sku];
    if(l && l.next && l.next.exp){
      var days = Math.round((l.next.exp - now) / 86400000);
      if(days <= EXP_SOON_DAYS){
        exp.push({ sku:p.sku, name:p.name, lotNo:l.next.lotNo,
                   remain:l.next.remain, days:days, unit:p.unit });
      }
    }
  });

  if(!low.length && !exp.length){
    box.innerHTML = '<div class="card"><div class="sum big" style="border:0;margin:0;padding:2px 0">'
      + '<span>สต๊อกและวันหมดอายุ</span><b style="color:var(--green)">ปกติ ✓</b></div></div>';
    return;
  }

  /* เหลือน้อยที่สุดขึ้นก่อน และของที่หมดอายุแล้วขึ้นก่อนของที่ใกล้หมดอายุ */
  low.sort(function(a,b){ return a.remain - b.remain });
  exp.sort(function(a,b){ return a.days - b.days });

  box.innerHTML = '<div class="card">'
    + (exp.length ? '<div class="subhd" style="margin-top:0">ล็อตที่ต้องรีบระบาย ('
        + exp.length + ')</div>'
        + exp.slice(0,6).map(function(e){
            var bad = e.days < 0;
            return '<div class="lotline ' + (bad ? 'bad' : 'warn') + '">'
              + (bad ? '⛔ หมดอายุแล้ว ' + (-e.days) + ' วัน' : '⚠️ อีก ' + e.days + ' วันหมดอายุ')
              + ' — ' + esc(e.name) + ' · ล็อต ' + esc(e.lotNo)
              + ' · เหลือ ' + e.remain + ' ' + esc(e.unit||"ชิ้น") + '</div>';
          }).join("")
        + (exp.length > 6 ? '<div class="hint">และอีก ' + (exp.length-6) + ' ล็อต</div>' : '')
      : '')
    + (low.length ? '<div class="subhd">ถึงจุดสั่งซื้อแล้ว (' + low.length + ')</div>'
        + low.slice(0,8).map(function(p){
            return '<div class="lotline ' + (p.remain <= 0 ? 'bad' : 'warn') + '">'
              + (p.remain <= 0 ? '⛔ หมดแล้ว' : '📦 เหลือ ' + p.remain + ' ' + esc(p.unit||"ชิ้น"))
              + ' — ' + esc(p.name)
              + ' <span style="color:var(--gray)">(จุดสั่งซื้อ ' + p.point + ')</span></div>';
          }).join("")
        + (low.length > 8 ? '<div class="hint">และอีก ' + (low.length-8) + ' รายการ</div>' : '')
      : '')
    + '</div>';
}

function drawSummary(all){
  var live = all.filter(function(o){
    return o.status !== "ยกเลิก" && inRange_(o.date, SUM_RANGE);
  });

  if (!live.length){
    $("#summary").innerHTML = '<div class="empty"><b>ยังไม่มีออเดอร์ในช่วงนี้</b>'
      + 'ลองเลือกช่วงเวลาอื่นดู</div>';
    return;
  }

  var net=0, sub=0, ship=0, profit=0, pieces=0;
  live.forEach(function(o){
    net    += Number(o.net)||0;
    sub    += Number(o.subtotal)||0;
    ship   += Number(o.ship)||0;
    profit += Number(o.profit)||0;
    (o.items||[]).forEach(function(it){ pieces += Number(it.qty)||0 });
  });

  var h = '<div class="kpis">'
    + '<div class="kpi"><span>ออเดอร์</span><b>' + live.length + ' ใบ</b></div>'
    + '<div class="kpi"><span>จำนวนชิ้น</span><b>' + pieces + '</b></div>'
    + '<div class="kpi wide"><span>ยอดชำระสุทธิ</span><b>' + baht(net) + '</b></div>'
    + '<div class="kpi good"><span>กำไรขั้นต้น</span><b>' + baht(profit) + '</b></div>'
    + '<div class="kpi"><span>ค่าจัดส่งรวม</span><b>' + baht(ship) + '</b></div>'
    + '</div>';

  function rows_(arr, fmt){
    var max = arr.length ? arr[0].v : 0;
    return arr.map(function(g){
      return bar_(g.key, baht(g.v), fmt(g), max ? g.v/max : 0);
    }).join("");
  }

  var byCarrier = group_(live, function(o){ return o.carrier },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.ship)||0 });
  h += section_("ตามค่ายขนส่ง", rows_(byCarrier, function(g){
    return g.n + " ใบ · ค่าส่ง " + baht(g.extra);
  }));

  var byChan = group_(live, function(o){ return o.channel },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.profit)||0 });
  h += section_("ตามช่องทางขาย", rows_(byChan, function(g){
    return g.n + " ใบ · กำไร " + baht(g.extra);
  }));

  /* สินค้าขายดี — นับเป็น "ชิ้น" เหมือนที่ร้านดู ไม่ใช่นับเป็นใบ */
  var prod = {};
  live.forEach(function(o){
    (o.items||[]).forEach(function(it){
      var k = it.name || it.sku; if (!k) return;
      if (!prod[k]) prod[k] = { key:k, n:0, v:0, extra:0 };
      prod[k].n += Number(it.qty)||0;
      prod[k].v += Number(it.total)||0;
      prod[k].extra += 1;
    });
  });
  var top = Object.keys(prod).map(function(k){ return prod[k] })
    .sort(function(a,b){ return b.n - a.n }).slice(0, 5);
  var maxN = top.length ? top[0].n : 0;
  h += section_("สินค้าขายดี 5 อันดับ", top.map(function(g){
    return bar_(g.key, g.n + " ชิ้น", baht(g.v) + " · " + g.extra + " ออเดอร์",
      maxN ? g.n/maxN : 0);
  }).join(""));

  var byStaff = group_(live, function(o){ return o.staff },
    function(g,o){ g.v += Number(o.net)||0 });
  if (byStaff.length > 1)
    h += section_("ผู้คีย์ออเดอร์", rows_(byStaff, function(g){ return g.n + " ใบ" }));

  h += '<div class="hint" style="padding:0 2px">ตัวเลขทั้งหมดมาจากชีทโดยตรง '
    + 'ไม่ได้คิดซ้ำในแอป · ไม่รวมออเดอร์ที่ยกเลิก</div>';

  /* บอกให้ชัดว่าตัวเลขพวกนี้มาจากไฟล์ไหน กดเปิดได้เลย
     ในไดรฟ์มีไฟล์ชื่อคล้ายกันหลายอัน เคยหลงแก้อยู่คนละไฟล์กับที่แอปเขียนมาแล้ว */
  var f = (BOOT && BOOT.file) || {};
  if (f.name) {
    h += '<div class="hint" style="padding:8px 2px 0">ข้อมูลทั้งหมดอยู่ในไฟล์ '
      + (f.url ? '<a href="'+esc(f.url)+'" target="_blank" rel="noopener"><b>'+esc(f.name)+'</b></a>'
               : '<b>'+esc(f.name)+'</b>')
      + ' — ไฟล์อื่นที่ชื่อคล้ายกันในไดรฟ์ ไม่ใช่ตัวที่แอปเขียน</div>';
  }

  $("#summary").innerHTML = h;
}

/* ------------------------------------------------------------ ตั้งลายเซ็นร้าน */

var SIG_KINDS = [
  { key: "auth",    title: "ผู้มีอำนาจลงนาม",       note: "ช่องขวาสุดของใบ" },
  { key: "cashier", title: "ผู้รับเงิน/พนักงานขาย", note: "ช่องกลางของใบ" }
];

function drawSigSettings(){
  var box = $("#sig-box");
  if (!box) return;
  var have = (CFG.doc && CFG.doc.sign) || {};
  box.innerHTML = SIG_KINDS.map(function(k){
    var on = !!signParse(have[k.key]);
    return '<div class="fld" data-sig="'+k.key+'">'
      + '<label>'+esc(k.title)+' <span class="hint" style="font-weight:400">· '+esc(k.note)+'</span></label>'
      + '<div class="signprev"><canvas data-prev="'+k.key+'" width="600" height="150"></canvas></div>'
      + '<button class="btn ghost" data-signbtn="'+k.key+'" style="margin-top:8px">'
      + (on ? 'เซ็นใหม่ / ลบลายเซ็นนี้' : 'เซ็นลายเซ็น')+'</button>'
      /* คนที่มีลายเซ็นสแกนไว้อยู่แล้วไม่ต้องเซ็นใหม่บนจอ ซึ่งมักออกมาไม่เหมือนของจริง
         แอปตัดขอบขาว ทำพื้นโปร่ง และย่อให้พอดีช่องในชีทให้เอง */
      + '<button class="btn ghost" data-sigimg="'+k.key+'" style="margin-top:7px">'
      + 'ใช้รูปลายเซ็นที่มีอยู่แล้ว</button>'
      + '<input type="file" accept="image/*" data-sigfile="'+k.key+'" style="display:none">'
      + '</div>';
  }).join("");

  SIG_KINDS.forEach(function(k){
    var cv = box.querySelector('canvas[data-prev="'+k.key+'"]');
    if (cv) {
      var g = cv.getContext("2d");
      g.clearRect(0,0,cv.width,cv.height);
      if (!signDraw(g, have[k.key], 20, 12, cv.width-40, cv.height-24)) {
        g.fillStyle = "#9aa0a6"; g.font = "26px sans-serif"; g.textAlign = "center";
        g.fillText("ยังไม่ได้เซ็น", cv.width/2, cv.height/2+9);
        g.textAlign = "left";
      }
    }
    var b = box.querySelector('button[data-signbtn="'+k.key+'"]');
    if (b) b.onclick = function(){ askSign(k); };

    var pick = box.querySelector('button[data-sigimg="'+k.key+'"]');
    var file = box.querySelector('input[data-sigfile="'+k.key+'"]');
    if (pick && file) {
      pick.onclick = function(){ file.value = ""; file.click(); };
      file.onchange = function(){
        var f = file.files && file.files[0];
        if (!f) return;
        pick.disabled = true; pick.textContent = "กำลังจัดรูป…";
        signFromImage(f).then(function(url){
          pick.textContent = "กำลังบันทึก…";
          return api("saveSignature", k.key, url).then(function(){
            CFG.doc.sign = CFG.doc.sign || {};
            CFG.doc.sign[k.key] = url;
            drawSigSettings();
            toast("ใช้รูปลายเซ็นนี้แล้ว");
          });
        }).catch(function(e){
          pick.disabled = false; pick.textContent = "ใช้รูปลายเซ็นที่มีอยู่แล้ว";
          toast("ใช้รูปนี้ไม่ได้: " + (e && e.message ? e.message : e));
        });
      };
    }
  });
}

function askSign(k){
  signPad("ลายเซ็น" + k.title,
    "เซ็นในกรอบด้วยนิ้วหรือปากกาสไตลัส · กด “ล้าง” แล้วกด “ใช้ลายเซ็นนี้” ทั้งที่ว่าง = ลบลายเซ็นเดิมทิ้ง")
  .then(function(sig){
    var btn = $('button[data-signbtn="'+k.key+'"]');
    if (btn) { btn.disabled = true; btn.textContent = "กำลังบันทึก…"; }
    api("saveSignature", k.key, sig ? JSON.stringify(sig) : "").then(function(){
      CFG.doc.sign = CFG.doc.sign || {};
      CFG.doc.sign[k.key] = sig ? JSON.stringify(sig) : "";
      drawSigSettings();
      toast(sig ? "เก็บลายเซ็นแล้ว ใบที่ออกหลังจากนี้จะมีลายเซ็นเอง" : "ลบลายเซ็นแล้ว");
    }, function(e){
      drawSigSettings();
      toast("บันทึกไม่สำเร็จ: " + (e && e.message ? e.message : e));
    });
  });
}

/* -------------------------------------------------------------------- modal */

function openModal(title, html){
  $("#m-title").textContent=title;
  $("#m-body").innerHTML=html;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); $("#m-body").innerHTML="" }
$("#modal").addEventListener("click", function(e){ if(e.target===this) closeModal() });
$("#m-close").onclick = closeModal;
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal() });

/* --------------------------------------------------------------- ผูกปุ่มทั้งหมด */

function go(page){
  ["new","list","quote","sum"].forEach(function(p){
    $("#pg-"+p).style.display = (p===page)?"":"none";
  });
  $$(".tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.go===page) });
  if(page==="list") loadOrders();
  if(page==="sum")  loadSummary();
  if(page==="quote") quoteInit();
}

document.addEventListener("DOMContentLoaded", function(){
  /* ตั้งขนาดตัวอักษรก่อนอย่างอื่น จะได้ไม่เห็นหน้าจอกระตุกตอนเปลี่ยนขนาด */
  fsInit();
  $$(".tabs button").forEach(function(b){ b.onclick=function(){ go(b.dataset.go) } });
  bindAddrFind("#f-addr-find", "#f-addr-hit", "#f-addr");
  ordSearchInit();
  bindCustFind("#f-cust", "#f-cust-hit", function(c){
    $("#f-cust").value = c.name;
    custToast(custFill([["#f-tel", c.tel, "เบอร์โทร"], ["#f-addr", c.addr || c.taxAddr, "ที่อยู่"]]));
  });
  $("#btn-add").onclick   = function(){ addItem(); recalc() };
  $("#btn-parse").onclick = doParse;
  $("#btn-save").onclick  = save;
  docBarInit();
  ["f-disc","f-ship"].forEach(function(id){ $("#"+id).oninput = recalc });
  ["f-vat","f-status"].forEach(function(id){ $("#"+id).onchange = recalc });
  $("#f-disc").addEventListener("change", recalc);

  /* ค่าจัดส่งแนะนำอัตโนมัติ เฉพาะตอนที่ยังไม่ได้พิมพ์เอง */
  $("#f-ship").dataset.touched = "";
  $("#f-ship").addEventListener("input", function(){ this.dataset.touched="1" });

  $("#list").addEventListener("click", function(e){
    var b=e.target.closest("[data-lb],[data-tk],[data-sm],[data-dc],[data-ed],[data-cx]");
    if(!b) return;
    if(b.dataset.lb!==undefined) openLabel(ORDERS[+b.dataset.lb]);
    else if(b.dataset.tk!==undefined) openTracking(ORDERS[+b.dataset.tk]);
    else if(b.dataset.sm!==undefined) openMsg(ORDERS[+b.dataset.sm]);
    else if(b.dataset.dc!==undefined) openDoc(ORDERS[+b.dataset.dc]);
    else if(b.dataset.ed!==undefined) openEditItems(ORDERS[+b.dataset.ed]);
    else if(b.dataset.cx!==undefined) openCancel(ORDERS[+b.dataset.cx]);
  });

  boot();
});
</script>
