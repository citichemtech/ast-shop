function payBind(p){
  var c = $("#py-copy");
  if(c) c.onclick = function(){ copyText(p.msg, "คัดลอกข้อความแล้ว เอาไปวางในแชทได้เลย") };

  $$("#py-slips [data-sok]").forEach(function(b){
    b.onclick = function(){ paySetSlip(p, b.getAttribute("data-sok"), "ยืนยันแล้ว", b) };
  });
  $$("#py-slips [data-sno]").forEach(function(b){
    b.onclick = function(){ paySetSlip(p, b.getAttribute("data-sno"), "ไม่ใช่ของใบนี้", b) };
  });

  var add = $("#py-add");
  if(!add) return;
  add.onclick = function(){
    var f = $("#py-file").files[0];
    if(!f){ toast("ยังไม่ได้เลือกไฟล์สลิป"); return }
    /* กันไว้ตั้งแต่ในเครื่อง ดีกว่าให้รออัปโหลดสิบวินาทีแล้วค่อยบอกว่าใหญ่เกิน */
    if(f.size > 10*1024*1024){
      toast("ไฟล์ใหญ่ " + Math.round(f.size/1024/1024*10)/10 + " MB เกิน 10 MB — ย่อรูปก่อน");
      return;
    }
    add.disabled = true; add.textContent = "กำลังอัปโหลด…";
    var r = new FileReader();
    r.onerror = function(){
      add.disabled = false; add.textContent = "แนบสลิปเข้าออเดอร์นี้";
      toast("อ่านไฟล์ไม่ได้ ลองเลือกใหม่อีกครั้ง");
    };
    r.onload = function(){
      call("addSlip", [p.no, {
        data: r.result, paidAt: $("#py-date").value,
        amount: $("#py-amt").value, bank: $("#py-bank").value.trim()
      }], function(res){
        add.disabled = false; add.textContent = "แนบสลิปเข้าออเดอร์นี้";
        $("#py-file").value = "";
        p.slips = res.slips;
        $("#py-slips").innerHTML = res.slips.map(slipRowHtml).join("");
        payBind(p);
        $("#py-say").innerHTML = res.warn
          ? '<div class="warn">แนบแล้ว แต่ ' + esc(res.warn) + '</div>'
          : '<div class="ok-note">แนบสลิปเรียบร้อย</div>';
        slipWaitLoad();
      }, function(m){
        add.disabled = false; add.textContent = "แนบสลิปเข้าออเดอร์นี้";
        $("#py-say").innerHTML = '<div class="stop">แนบไม่สำเร็จ<br>' + esc(m) + '</div>';
      });
    };
    r.readAsDataURL(f);
  };
}

function paySetSlip(p, fileId, status, btn){
  var paid = false;
  if(status === "ยืนยันแล้ว"){
    paid = confirm("ยืนยันว่าเงินเข้าบัญชีแล้ว\n\nกด ตกลง = ทำเครื่องหมายว่าออเดอร์ "
      + p.no + " ชำระแล้วด้วย\nกด ยกเลิก = ยืนยันแค่สลิป ยังไม่ปิดยอดออเดอร์");
  }
  btn.disabled = true;
  call("setSlipStatus", [fileId, status, "", paid], function(res){
    toast(status === "ยืนยันแล้ว"
      ? (paid ? "ยืนยันแล้ว และปิดยอด " + p.no : "ยืนยันสลิปแล้ว")
      : "ทำเครื่องหมายว่าไม่ใช่สลิปของใบนี้");
    slipWaitLoad();
    if(paid) loadOrders(true);
    p.slips = res.slips;
    var box = $("#py-slips");
    if(!box) return;                        /* ปิดหน้าต่างไปแล้วระหว่างรอ */
    box.innerHTML = res.slips.map(slipRowHtml).join("");
    payBind(p);                             /* ปุ่มชุดใหม่ต้องผูกใหม่ ไม่งั้นกดไม่ติด */
  }, function(m){
    btn.disabled = false;
    toast("ไม่สำเร็จ: " + m);
  });
}

/* ------------------------------------------------------------------ สรุปยอด */

/* ช่วงเวลาที่ดูได้ — ชุดเดียวกับที่ร้านใช้คิดงานจริง (วันนี้ / เมื่อวาน / 7 วัน / เดือนนี้) */
var RANGES = [
  { key:"today", label:"วันนี้" },
  { key:"yday",  label:"เมื่อวาน" },
  { key:"7d",    label:"7 วันล่าสุด" },
  { key:"month", label:"เดือนนี้" },
  { key:"all",   label:"ทั้งหมด" }
];
var SUM_RANGE = "today";
var SUM_CACHE = null;

function isoShift_(days){
  var d = new Date(); d.setDate(d.getDate() + days);
  var p = function(n){ return n < 10 ? "0" + n : "" + n };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function inRange_(iso, key){
  if (!iso) return false;
  if (key === "all")   return true;
  if (key === "today") return iso === isoShift_(0);
  if (key === "yday")  return iso === isoShift_(-1);
  if (key === "7d")    return iso >= isoShift_(-6) && iso <= isoShift_(0);
  if (key === "month") return iso.slice(0,7) === isoShift_(0).slice(0,7);
  return true;
}

/** แถวแท่งนอนหนึ่งแถว — ชื่อ · ตัวเลขหลัก · แท่ง · บรรทัดรายละเอียด */
function bar_(name, value, sub, ratio){
  return '<div class="brow">'
    + '<div class="btop"><span class="bname">' + esc(name) + '</span>'
    + '<b class="bval">' + value + '</b></div>'
    + '<div class="btrack"><i style="width:' + Math.max(2, Math.round(ratio*100)) + '%"></i></div>'
    + (sub ? '<div class="bsub">' + esc(sub) + '</div>' : '')
    + '</div>';
}

/** จัดกลุ่มแล้วเรียงจากมากไปน้อย คืนมาไม่เกิน top แถว */
function group_(list, keyOf, addOf, top){
  var m = {};
  list.forEach(function(o){
    var k = keyOf(o) || "ไม่ระบุ";
    if (!m[k]) m[k] = { key:k, n:0, v:0, extra:0 };
    m[k].n++;
    addOf(m[k], o);
  });
  var arr = Object.keys(m).map(function(k){ return m[k] });
  arr.sort(function(a,b){ return b.v - a.v });
  return top ? arr.slice(0, top) : arr;
}

function section_(title, rows){
  if (!rows) return "";
  return '<div class="card"><div class="subhd" style="margin-top:0">' + esc(title) + '</div>' + rows + '</div>';
}

function loadSummary(){
  /* ปุ่มช่วงเวลาวาดครั้งเดียว กดสลับแล้วคำนวณจากข้อมูลชุดเดิม ไม่ต้องยิงชีทซ้ำ */
  if (!$("#sum-range").innerHTML){
    $("#sum-range").innerHTML = RANGES.map(function(r){
      return '<button data-r="' + r.key + '"' + (r.key===SUM_RANGE?' class="on"':'') + '>' + r.label + '</button>';
    }).join("");
    $("#sum-range").addEventListener("click", function(e){
      var b = e.target.closest("button[data-r]"); if(!b) return;
      SUM_RANGE = b.dataset.r;
      $$("#sum-range button").forEach(function(x){ x.classList.toggle("on", x.dataset.r===SUM_RANGE) });
      /* แถบปุ่มเลื่อนได้ ปุ่มที่เลือกต้องอยู่ในสายตาเสมอ ไม่งั้นกดแล้วไม่รู้ว่าอยู่ช่วงไหน */
      if (b.scrollIntoView) b.scrollIntoView({ block:"nearest", inline:"center" });
      if (SUM_CACHE) drawSummary(SUM_CACHE);
    });
  }
  /* วาดที่ตั้งลายเซ็นทุกครั้งที่เข้าหน้านี้ ไม่ผูกกับว่ามีออเดอร์ในช่วงที่เลือกหรือไม่ */
  drawSigSettings();
  drawAlerts();
  if (SUM_CACHE) { drawSummary(SUM_CACHE); drawDue(SUM_CACHE); return; }
  $("#summary").innerHTML = '<div class="load">กำลังโหลด…</div>';
  call("getOrders", [500], function(list){
    list = list || [];
    SUM_CACHE = list;
    if (!ORDERS.length) ORDERS = list;
    drawSummary(list);
    drawDue(list);
  }, function(m){
    $("#summary").innerHTML = '<div class="empty" style="color:var(--red)">โหลดไม่สำเร็จ<br>' + esc(m) + '</div>';
  });
}

/* ------------------------------------------------------------ ค้างชำระ

   ชีทมีช่องสถานะอยู่แล้ว แต่ไม่มีที่ไหนรวมให้ดูว่าใครยังไม่จ่าย รวมเท่าไร
   ของที่เก็บเงินปลายทางกับลูกค้าเครดิต ถ้าไม่มีที่รวมก็ตกหล่นได้ทั้งใบ
   เรียงใบเก่าสุดขึ้นก่อน เพราะใบที่ค้างนานที่สุดคือใบที่ต้องโทรก่อน   */

/* สถานะการเงินของใบหนึ่ง — คิดที่เดียว ใช้ทั้งแถบกรอง ป้ายสี และข้อความทวง

   ร้านมีเงื่อนไขจ่ายสองแบบเท่านั้น
     เงินสด            ครบกำหนดวันที่ขายเลย ค้างข้ามวันคือเริ่มสาย
     เครดิต 30 วัน     ครบกำหนดอีก 30 วัน ยังไม่ถึงกำหนดยังไม่ใช่ลูกหนี้ที่ต้องโทรตาม

   แยกสองแบบนี้ให้ออกเป็นเรื่องสำคัญ ถ้าใบเครดิตขึ้นแดงตั้งแต่วันแรก
   คนจะเลิกเชื่อสีแดงทั้งหน้า แล้วใบที่สายจริงก็จะถูกมองข้ามไปด้วย   */

var CREDIT_STATUS = "รอชำระเครดิต 30วัน";
var CREDIT_DAYS = 30;

function payDays_(iso){
  var a = new Date(String(iso)+"T00:00:00"), b = new Date(todayISO()+"T00:00:00");
  var n = Math.round((b-a)/86400000);
  return isNaN(n) ? 0 : n;
}

/** คืน {key, label, days, over} — key ใช้จับคู่กับแถบกรองและสีของป้าย */
function payState(o){
  var st = String((o&&o.status)||"").trim();
  if (isDead(o))        return { key:"dead",  label:st || "ยกเลิก", days:0, over:0 };
  if (st === "ชำระแล้ว") return { key:"paid",  label:"ชำระเรียบร้อย", days:0, over:0 };

  var credit = st === CREDIT_STATUS;
  var d = payDays_(o && o.date);
  var over = credit ? d - CREDIT_DAYS : d;
  if (over > 0) {
    return { key:"over", label:"เกินกำหนดชำระ " + over + " วัน", days:d, over:over };
  }
  return credit
    ? { key:"cr30", label:CREDIT_STATUS, days:d, over:over }
    : { key:"due",  label:"รอชำระ",      days:d, over:over };
}

/* แถบกรองด้านบน — กดแล้วดูเฉพาะกลุ่มนั้น ค่าตั้งต้นคือใบที่ยังไม่ได้เงิน */
var PAY_TABS = [
  { key:"paid", label:"ชำระเรียบร้อย",  ic:"paid" },
  { key:"due",  label:"ค้างชำระ",       ic:"due"  },
  { key:"cr30", label:"เครดิต 30 วัน",  ic:"cr30" },
  { key:"over", label:"เกินกำหนดชำระ",  ic:"over" }
];
var PAY_PICK = "due";

function drawDue(all){
  var box = $("#sum-due");
  if(!box) return;

  var live = (all||[]).filter(function(o){ return !isDead(o) && Number(o.net||0) > 0 });
  var mine = live.filter(function(o){
    var k = payState(o).key;
    /* "ค้างชำระ" หมายถึงเงินที่ยังไม่ได้ทั้งหมด ไม่ว่าจะถึงกำหนดหรือยัง
       ไม่งั้นกดดูค้างชำระแล้วยอดไม่ตรงกับที่ค้างจริง ซึ่งเป็นตัวเลขที่ใช้ตัดสินใจ */
    return PAY_PICK === "due" ? k !== "paid" : k === PAY_PICK;
  });

  var total = 0;
  mine.forEach(function(o){ total += Number(o.net)||0 });
  /* เก่าสุดขึ้นก่อน — ใบที่ค้างนานที่สุดคือใบที่ต้องโทรก่อน */
  mine.sort(function(a,b){ return String(a.date) < String(b.date) ? -1 : 1 });

  var count = {};
  PAY_TABS.forEach(function(t){ count[t.key] = 0 });
  /* ใบเครดิตกับใบเกินกำหนดก็คือเงินที่ยังไม่ได้เหมือนกัน จึงนับเข้า "ค้างชำระ" ด้วย
     ตัวเลขบนแถบจึงบวกกันได้เกินจำนวนใบทั้งหมด ซึ่งถูกแล้ว เพราะเป็นการมองคนละมุม */
  live.forEach(function(o){
    var k = payState(o).key;
    if (k === "paid") { count.paid++; return; }
    count.due++;
    if (k === "cr30" || k === "over") count[k]++;
  });

  var head = PAY_TABS.filter(function(t){ return t.key === PAY_PICK })[0] || PAY_TABS[1];
  var money = PAY_PICK === "paid" ? "var(--green)"
            : (PAY_PICK === "over" ? "var(--red)" : "var(--amber)");

  box.innerHTML =
      '<div class="paytabs" id="pay-tabs">'
    + PAY_TABS.map(function(t){
        return '<button data-pay="' + t.key + '"' + (t.key===PAY_PICK ? ' class="on"' : '') + '>'
          + '<img alt="" data-payic="' + t.ic + '">'
          + '<span>' + esc(t.label) + '</span>'
          + '<i>' + (count[t.key]||0) + '</i></button>';
      }).join("")
    + '</div>'
    + '<div class="card">'
    + '<div class="sum big" style="border:0;margin:0;padding:2px 0">'
    +   '<span>' + esc(head.label) + ' ' + mine.length + ' ใบ</span>'
    +   '<b style="color:' + money + '">' + baht(total) + '</b></div>'
    + (mine.length
      ? '<div id="due-list" style="margin-top:6px">'
        + mine.slice(0,12).map(function(o){
            var p = payState(o);
            return '<div class="row"><div class="i">'
              + '<b>' + esc(o.cust||"ไม่ระบุชื่อ") + '</b>'
              + '<span>' + esc(o.no) + ' · ' + esc(thaiDate(o.date))
              + (p.key !== "paid" && p.days > 0
                  ? ' · <span style="color:' + (p.over>0?'var(--red)':'var(--amber)') + '">ค้าง '
                    + p.days + ' วัน</span>' : '')
              + '</span>'
              + '<span style="color:var(--ink);font-weight:700;font-size:1.02rem">'
              + baht(o.net) + '</span>'
              + '<span class="paybar ' + p.key + '">' + esc(p.label) + '</span>'
              + slipBadge(o.no)
              + '</div><div class="acts">'
              + '<button class="sq" data-due-sm="' + esc(o.no) + '" title="ทวงถาม / ส่งข้อความ">💬</button>'
              + '<button class="sq" data-due-py="' + esc(o.no) + '" title="ส่ง QR เก็บเงิน / แนบสลิป">💰</button>'
              /* ปุ่มเขียว = เปิดประวัติของลูกค้ารายนี้ และปิดยอดจากในนั้นได้
                 ตอนถือสายทวงเงิน ต้องรู้ก่อนว่ารายนี้ซื้อกับเรามาแค่ไหน
                 ค้างใบเดียวจากสิบใบ กับค้างใบเดียวเพราะเพิ่งซื้อครั้งแรก คนละเรื่องกัน */
              + '<button class="sq ok" data-due-cu="' + esc(o.cust||"") + '" '
              + 'data-no="' + esc(o.no) + '" title="ประวัติคำสั่งซื้อ / ปิดยอด">✔</button>'
              + '</div></div>';
          }).join("")
        + '</div>'
        + (mine.length > 12 ? '<div class="hint">แสดง 12 ใบแรกจากทั้งหมด ' + mine.length + ' ใบ</div>' : '')
      : '<div class="empty" style="padding:18px 8px"><b>ไม่มีใบในกลุ่มนี้</b>'
        + 'กดแถบด้านบนเพื่อดูกลุ่มอื่น</div>')
    /* ชีทมีช่องสถานะช่องเดียว บอกทั้ง "จ่ายหรือยัง" และ "ส่งหรือยัง" พร้อมกันไม่ได้
       ระบบจึงนับเฉพาะ "ชำระแล้ว" ว่าเก็บเงินได้แล้ว อย่างอื่นถือว่ายังค้าง */
    + '<div class="hint">นับเฉพาะใบที่สถานะยังไม่ใช่ “ชำระแล้ว” · '
    + 'ใบเครดิตจะยังไม่ขึ้นแดงจนกว่าจะเกิน ' + CREDIT_DAYS + ' วันนับจากวันที่ขาย</div>'
    + '</div>';

  $$("#pay-tabs [data-payic]").forEach(function(im){
    var ic = (typeof PAY_ICONS !== "undefined") && PAY_ICONS[im.dataset.payic];
    if (ic) im.src = ic; else im.remove();
  });
  $("#pay-tabs").onclick = function(e){
    var b = e.target.closest("button[data-pay]");
    if(!b) return;
    PAY_PICK = b.dataset.pay;
    drawDue(all);
  };

  function find(no){ return (all||[]).filter(function(o){ return o.no === no })[0] }
  $$("#due-list [data-due-sm]").forEach(function(b){
    b.onclick = function(){ var o = find(b.getAttribute("data-due-sm")); if(o) openMsg(o) };
  });
  $$("#due-list [data-due-py]").forEach(function(b){
    b.onclick = function(){ var o = find(b.getAttribute("data-due-py")); if(o) openPay(o) };
  });
  $$("#due-list [data-due-cu]").forEach(function(b){
    b.onclick = function(){
      openCustomer(b.getAttribute("data-due-cu"), b.getAttribute("data-no"));
    };
  });
}

/* --------------------------------------------- ประวัติคำสั่งซื้อของลูกค้ารายเดียว

   เปิดจากปุ่มเขียวในหน้าค้างชำระ ตอนกำลังจะโทรทวง
   บอกสามอย่างที่ต้องรู้ก่อนกดโทร: ซื้อมาแล้วกี่ใบ · รวมเท่าไร · ค้างอยู่กี่ใบ
   แล้วปิดยอดใบที่กำลังดูอยู่ได้จากในนี้เลย ไม่ต้องย้อนออกไปหาใหม่           */

function openCustomer(name, no){
  var cust = String(name||"").trim();
  if(!cust){ toast("ใบนี้ไม่ได้ระบุชื่อลูกค้า จึงไม่มีประวัติให้ดู"); return }

  openModal("ประวัติคำสั่งซื้อ — " + cust,
    '<div id="cu-body"><div class="load">กำลังโหลด…</div></div>');

  call("getCustomerHistory", [cust, 60], function(r){
    var box = $("#cu-body");
    if(!box) return;
    var list = (r && r.orders) || [];
    box.innerHTML =
        '<div class="kpis" style="margin-bottom:10px">'
      + '<div class="kpi"><span>ซื้อไปแล้ว</span><b>' + (r.n||0) + ' ใบ</b></div>'
      + '<div class="kpi"><span>ยอดรวม</span><b>' + baht(r.total||0) + '</b></div>'
      /* กำไรคือเหตุผลที่ต้องรู้ว่าใครเป็นลูกค้าประจำ — ลูกค้าที่ซื้อเยอะแต่ต่อราคา
         จนแทบไม่เหลือกำไร กับลูกค้าที่ซื้อน้อยกว่าแต่ได้กำไรเต็ม เป็นคนละเรื่องกัน */
      + '<div class="kpi"><span>กำไรจากลูกค้ารายนี้</span><b>' + baht(r.profit||0) + '</b></div>'
      + '<div class="kpi"><span>เฉลี่ยต่อใบ</span><b>'
      +   baht((r.n||0) ? (r.total||0)/(r.n||1) : 0) + '</b></div>'
      + '<div class="kpi"><span>ค้างชำระ</span><b'
      +   ((r.dueN||0) ? ' style="color:var(--amber)"' : '') + '>' + (r.dueN||0) + ' ใบ</b></div>'
      + '<div class="kpi"><span>ยอดที่ค้าง</span><b'
      +   ((r.due||0) ? ' style="color:var(--amber)"' : '') + '>' + baht(r.due||0) + '</b></div>'
      + '</div>'
      + (no ? '<button class="btn" id="cu-paid">ทำเครื่องหมายว่า ' + esc(no) + ' ชำระแล้ว</button>' : '')
      + '<div id="cu-msg" style="margin:8px 0"></div>'
      + '<div class="subhd">ทุกใบของลูกค้ารายนี้ (' + list.length + ')</div>'
      + (list.length
        ? list.map(function(o){
            var p = payState(o);
            return '<div class="row"><div class="i">'
              + '<b' + (isDead(o) ? ' style="text-decoration:line-through;color:var(--gray)"' : '')
              + '>' + esc(o.no) + '</b>'
              + '<span>' + esc(thaiDate(o.date))
              + (o.channel ? ' · ' + chanTag(o.channel) : '') + '</span>'
              + '<span style="color:var(--ink);font-weight:700">' + baht(o.net) + '</span>'
              + '<span class="paybar ' + p.key + '">' + esc(p.label) + '</span>'
              + '</div>'
              /* ใบที่ยกเลิกไปแล้วยังคีย์ซ้ำได้ — ลูกค้าเคยสั่งของชุดนี้จริง
                 สิ่งที่ยกเลิกคือใบ ไม่ใช่ความต้องการซื้อของลูกค้า */
              + '<div class="acts"><button class="btn ghost mini-w" data-rp="' + esc(o.no)
              + '">คีย์ออเดอร์ซ้ำ</button></div>'
              + '</div>';
          }).join("")
        : '<div class="empty">ยังไม่มีใบอื่นของลูกค้ารายนี้</div>')
      + '<div class="hint" style="margin-top:8px">ใบที่ยกเลิกหรือตีกลับขึ้นแบบขีดฆ่า '
      + 'และไม่ถูกนับรวมในยอดด้านบน</div>';

    /* ปุ่มคีย์ซ้ำผูกกับใบที่โหลดมาแล้ว ไม่ต้องยิงชีทอีกรอบตอนกด */
    $$("#cu-body [data-rp]").forEach(function(b){
      b.onclick = function(){
        var pick = list.filter(function(x){ return String(x.no) === b.dataset.rp })[0];
        repeatOrder(pick);
      };
    });

    var pd = $("#cu-paid");
    if(pd) pd.onclick = function(){
      if(!confirm("ทำเครื่องหมายว่าออเดอร์ " + no + " ชำระแล้ว?")) return;
      pd.disabled = true; pd.textContent = "กำลังบันทึก…";
      api("setTracking", no, undefined, "ชำระแล้ว").then(function(){
        $("#cu-msg").innerHTML = '<div class="msg ok" style="display:block">บันทึกว่า <b>'
          + esc(no) + '</b> ชำระแล้ว</div>';
        pd.textContent = "ปิดยอดแล้ว";
        SUM_CACHE = null; ORDERS = [];
        loadSummary();
      }, function(e){
        pd.disabled = false; pd.textContent = "ทำเครื่องหมายว่า " + no + " ชำระแล้ว";
        $("#cu-msg").innerHTML = '<div class="msg err" style="display:block">'
          + esc(e && e.message ? e.message : e) + '</div>';
      });
    };
  }, function(m){
    var box = $("#cu-body");
    if(box) box.innerHTML = '<div class="empty" style="color:var(--red)">โหลดไม่สำเร็จ<br>'
      + esc(m) + '</div>';
  });
}

/* ------------------------------------------------------------- หน้าลูกค้า

   ลูกค้าประจำคือคนที่ทำเงินให้ร้านจริง ๆ แต่ระบบเดิมไม่มีที่ไหนตอบได้เลยว่า
   ใครซื้อไปเท่าไร กำไรเท่าไร และค้างอยู่กี่ใบ — ต้องเปิดชีทแล้วไล่กรองเอง

   ไม่ทำเป็นแท็บ เพราะแถบล่างเต็มแล้ว เข้าจากปุ่มบนหน้าออเดอร์ทั้งหมด
   แบบเดียวกับหน้านำเข้า Shopee แท็บ "ออเดอร์" จึงยังติดไฟค้างไว้     */

var CUST_SORT = "last";
var CUST_SORTS = [
  { key:"last",  label:"ซื้อล่าสุด"  },
  { key:"total", label:"ยอดสูงสุด"   },
  { key:"due",   label:"ค้างชำระ"    }
];

function custPageInit(){
  var q = $("#cu-q");
  if(q && !q.dataset.bound){
    q.dataset.bound = "1";
    q.oninput = drawCustPage;
  }
  var bk = $("#cu-back");
  if(bk && !bk.dataset.bound){
    bk.dataset.bound = "1";
    bk.onclick = function(){ go("list") };
  }
  var box = $("#cu-list");
  if(box) box.innerHTML = '<div class="load">กำลังโหลดรายชื่อลูกค้า…</div>';
  /* custList เก็บรายชื่อไว้ในเครื่องแล้ว การค้นจึงไม่ยิงชีทซ้ำทุกตัวอักษร */
  custList(function(){ drawCustPage() });
}

/* คัดตามคำค้น แล้วเรียงตามที่เลือก — เงียบ ๆ ในเครื่อง ไม่ยิงเซิร์ฟเวอร์ */
function custPick(list, q, sort){
  var want = String(q||"").trim().toLowerCase();
  var qd = want.replace(/\D/g,"");
  var out = (list||[]).filter(function(c){
    if(!want) return true;
    if(String(c.name||"").toLowerCase().indexOf(want) > -1) return true;
    if(qd.length >= 3 && String(c.tel||"").replace(/\D/g,"").indexOf(qd) > -1) return true;
    return false;
  });
  var num = function(v){ return Number(v) || 0 };
  out.sort(function(a,b){
    if(sort === "total") return num(b.total) - num(a.total) || (a.name < b.name ? -1 : 1);
    if(sort === "due")   return num(b.due)   - num(a.due)   || (a.name < b.name ? -1 : 1);
    /* ค่าตั้งต้นคือคนที่เพิ่งซื้อล่าสุด ซึ่งเป็นลำดับที่ชีทส่งมาอยู่แล้ว */
    return String(b.last||"").localeCompare(String(a.last||"")) || (a.name < b.name ? -1 : 1);
  });
  return out;
}

function drawCustPage(){
  var box = $("#cu-list");
  if(!box) return;
  var q = ($("#cu-q") && $("#cu-q").value) || "";
  var all = CUSTS || [];
  var list = custPick(all, q, CUST_SORT);

  var chips = '<div class="sorts">' + CUST_SORTS.map(function(s){
    return '<button type="button" data-cs="' + s.key + '"'
         + (s.key === CUST_SORT ? ' class="on"' : '') + '>' + esc(s.label) + '</button>';
  }).join("") + '</div>';

  var head = '<div class="hint" style="padding:0 2px 8px">ลูกค้าทั้งหมด <b>' + all.length
    + '</b> ราย' + (q ? ' · ตรงกับที่ค้น <b>' + list.length + '</b> ราย' : '') + '</div>';

  box.innerHTML = chips + head + (list.length
    ? list.slice(0, 200).map(function(c, i){
        var due = Number(c.due) || 0;
        return '<div class="row cu-row" data-cu="' + i + '"><div class="i">'
          + '<b>' + esc(c.name || "ไม่ระบุชื่อ") + '</b>'
          + '<span>' + (c.tel ? esc(c.tel) + ' · ' : '')
          + 'ซื้อ ' + (Number(c.okN) || 0) + ' ใบ'
          + (c.last ? ' · ล่าสุด ' + esc(thaiDate(c.last)) : '') + '</span>'
          + '<span style="color:var(--ink);font-weight:700">' + baht(c.total || 0) + '</span>'
          /* ค้างชำระเป็นเรื่องที่ต้องเห็นตั้งแต่ยังไม่กดเข้าไปดู
             ไม่งั้นต้องเปิดทีละรายเพื่อรู้ว่าใครติดเงินอยู่ */
          + (due ? '<span class="paybar due">ค้าง ' + (Number(c.dueN)||0) + ' ใบ · '
                 + baht(due) + '</span>' : '')
          + '</div></div>';
      }).join("")
    : '<div class="empty"><b>ไม่พบลูกค้าที่ค้นหา</b>พิมพ์ชื่อหรือเบอร์โทรบางส่วนก็ได้</div>');

  $$("#cu-list .sorts button").forEach(function(b){
    b.onclick = function(){ CUST_SORT = b.dataset.cs; drawCustPage() };
  });
  $$("#cu-list .cu-row").forEach(function(r){
    r.onclick = function(){
      var c = list[+r.dataset.cu];
      if(c) openCustomer(c.name);
    };
  });
}

/* ------------------------------------------------------ คีย์ออเดอร์ซ้ำ

   ลูกค้าประจำสั่งของชุดเดิมซ้ำทุกเดือน ทางเดียวที่เคยทำได้คือเปิดใบเก่าดู
   แล้วพิมพ์ใหม่ทั้งใบ ทั้งที่อยู่สามบรรทัดและรายการสินค้าทุกบรรทัด

   ใส่ให้เฉพาะของที่ยังมีอยู่ในฐานสินค้าจริง ตัวไหนหายไปแล้วบอกให้รู้
   ไม่ใช่เงียบ ๆ แล้วปล่อยให้บันทึกใบที่ขาดของไป                        */

function repeatOrder(o){
  if(!o){ toast("ไม่มีข้อมูลใบนี้ให้คีย์ซ้ำ"); return }
  closeModal();
  go("new");

  var set = function(id, v){
    if(v !== undefined && v !== null && String(v) !== "") $("#"+id).value = v;
  };
  /* วันที่ต้องเป็นวันนี้เสมอ ไม่ใช่วันของใบเก่า ไม่งั้นยอดจะไปลงเดือนที่ปิดไปแล้ว */
  $("#f-date").value = todayISO();
  set("f-cust", o.cust);
  set("f-tel",  o.tel);
  set("f-addr", o.addr);
  /* เลขพัสดุกับหมายเหตุของใบเก่าไม่เกี่ยวกับใบใหม่ ต้องไม่ติดมาด้วย */
  $("#f-track").value = "";
  $("#f-note").value  = "";
  if(o.channel) pickOption("#f-channel", o.channel);
  if(o.carrier) pickOption("#f-carrier", o.carrier);
  if(o.vat)     pickOption("#f-vat", o.vat);
  if(o.ship !== undefined && o.ship !== null && o.ship !== ""){
    $("#f-ship").value = o.ship;
    $("#f-ship").dataset.touched = "1";
  }
  $("#f-disc").value = Number(o.discount) || 0;

  var raw  = (o.items || []).filter(function(it){ return Number(it.qty) > 0 });
  var its  = raw.filter(function(it){ return it.sku && prodBySku(it.sku) });
  if(its.length){
    $("#items").innerHTML = "";
    its.forEach(function(it){
      addItem({ sku: it.sku, qty: it.qty, price: it.price, gift: Number(it.price) === 0 });
    });
  }
  recalc();
  window.scrollTo(0, 0);

  var miss = raw.length - its.length;
  toast(miss
    ? ("คีย์ซ้ำจาก " + o.no + " แล้ว · มี " + miss + " รายการที่ไม่มีในฐานสินค้าแล้ว ต้องเลือกเอง")
    : ("คีย์ซ้ำจาก " + o.no + " แล้ว ตรวจอีกครั้งก่อนบันทึก"));
}

/* ------------------------------------------- แฟ้มเอกสาร: แยกเป็นแฟ้มตามชนิดใบ

   เดิมหน้านี้เรียก listDocs ซึ่งคืนเฉพาะใบที่ "ไม่มีเลขออเดอร์"
   แต่ใบเสร็จ/ใบกำกับภาษี ใบแจ้งหนี้ และใบมัดจำ ออกจากออเดอร์เสมอ จึงมีเลขออเดอร์ทุกใบ
   แปลว่าใบกำกับภาษีที่ออกไปแล้ว ไม่เคยโผล่ในหน้านี้เลยสักใบ ทั้งที่อยู่ในชีทครบ
   และช่องค้นหายังเขียนว่าค้นด้วย "เลขออเดอร์" ได้ ทั้งที่ไม่มีทางเจอ

   ของใหม่เข้าแฟ้มก่อน ใบคนละชนิดไม่ปนกัน — ใบเสนอราคาคือใบที่ยัง "อาจจะขาย"
   ใบกำกับภาษีคือใบที่ "ขายไปแล้วและแจ้งสรรพากรแล้ว" คนละเรื่องกันคนละความสำคัญ */

var FILE_KIND = "";
var DOC_KINDS = [
  { th: "ใบเสร็จรับเงิน", label: "ใบเสร็จ / ใบกำกับภาษี", ic: "🧾",
    note: "ใบที่ขายจบแล้ว ใช้ยื่นภาษี" },
  { th: "บิลเงินสด",     label: "บิลเงินสด",             ic: "💵",
    note: "ขายแบบไม่ออกใบกำกับภาษี" },
  { th: "ใบแจ้งหนี้",     label: "ใบแจ้งหนี้",            ic: "📃",
    note: "วางบิลแล้วรอเก็บเงิน" },
  { th: "ใบเสนอราคา",    label: "ใบเสนอราคา",           ic: "📝",
    note: "ยังไม่ได้ขาย รอลูกค้าตอบ" },
  { th: "ใบรับเงินมัดจำ", label: "ใบรับเงินมัดจำ",        ic: "💰",
    note: "รับมัดจำไว้ก่อนส่งของ" }
];

function docKind(th){
  for(var i = 0; i < DOC_KINDS.length; i++) if(DOC_KINDS[i].th === th) return DOC_KINDS[i];
  return { th: th, label: th, ic: "📄", note: "" };
}

/** จำนวนใบในแฟ้ม — ฝั่งชีทส่งมาเป็นก้อนแยกสามกอง
    เผื่อไฟล์หลังบ้านเป็นรุ่นเก่าที่ส่งมาเป็นตัวเลขเดี่ยว ก็ยังอ่านได้ ไม่พังทั้งหน้า */
function docCount(v){
  if(v && typeof v === "object"){
    return { n: Number(v.n)||0, live: Number(v.live)||0,
             revised: Number(v.revised)||0, dead: Number(v.dead)||0 };
  }
  var n = Number(v) || 0;
  return { n: n, live: n, revised: 0, dead: 0 };
}

function drawFileDocs(){
  var box = $("#fl-docs");
  if(!box) return;
  var q = ($("#fl-q") && $("#fl-q").value.trim()) || "";
  box.innerHTML = '<div class="load">กำลังเปิดแฟ้ม…</div>';
  /* ค้นหาแล้วไม่ต้องเข้าแฟ้ม — คนที่พิมพ์เลขใบมาคือคนที่รู้อยู่แล้วว่าจะหาใบไหน
     บังคับให้เดาก่อนว่าใบนั้นชนิดอะไรคือทำให้ช่องค้นหาไร้ประโยชน์ */
  api("findDocs", { q: q, type: q ? "" : FILE_KIND, limit: 60 }).then(function(res){
    var rows = (res && res.rows) || [], counts = (res && res.counts) || {};
    if(q) drawDocHits(box, rows, q);
    else if(!FILE_KIND) drawDocFolders(box, counts);
    else drawDocOne(box, rows, counts, res.total || rows.length);
  }, function(e){
    box.innerHTML = '<div class="empty" style="color:var(--red)"><b>เปิดแฟ้มไม่ได้</b>'
      + esc(e && e.message ? e.message : e) + '</div>';
  });
}

/** หน้าแรกของแฟ้ม — สี่แฟ้มเรียงกัน พร้อมจำนวนใบข้างใน */
/** รูปหน้าแฟ้ม — ถ้ารูปยังไม่มา (ไฟล์รูปเป็นรุ่นเก่า) ตกไปใช้ emoji แทน
    ดีกว่าช่องว่างที่ทำให้ทั้งแถวเบี้ยวโดยไม่มีใครรู้ว่าหายไปไหน */
function foldIc(k){
  var src = (typeof DOC_ICONS !== "undefined" && DOC_ICONS) ? DOC_ICONS[k.th] : "";
  return src
    ? '<img class="fold-ic" src="' + src + '" alt="">'
    : '<span class="fold-ic fold-em">' + k.ic + '</span>';
}

function drawDocFolders(box, counts){
  box.innerHTML = '<div class="hint" style="padding:0 2px 8px">'
      + 'กดที่แฟ้มเพื่อดูใบข้างใน · หรือพิมพ์ค้นหาข้างบนถ้ารู้เลขใบอยู่แล้ว</div>'
    + DOC_KINDS.map(function(k){
        var c = docCount(counts[k.th]);
        /* จำนวนบนแฟ้มนับเฉพาะใบที่ใช้ได้ — ใบที่ยกเลิกแล้วคือใบที่ใช้ไม่ได้
           นับรวมเข้าไปคือหลอกตัวเองว่ามีใบอยู่มากกว่าที่มีจริง
           แต่ก็ไม่ซ่อน บอกต่อท้ายว่าข้างในมีใบแก้ไข/ใบยกเลิกอยู่กี่ใบ */
        var side = [];
        if(c.revised) side.push("แก้ไข " + c.revised);
        if(c.dead) side.push("ยกเลิก " + c.dead);
        return '<div class="fold' + (c.n ? '' : ' none') + '" data-fk="' + esc(k.th) + '">'
          + foldIc(k)
          + '<span class="fold-tx"><b>' + esc(k.label) + '</b>'
          +   '<em>' + esc(side.length ? side.join(" · ") : k.note) + '</em></span>'
          + '<span class="fold-n">'
          +   (c.n ? (c.live + c.revised) + ' ใบ' : 'ยังไม่มี') + '</span>'
          + '</div>';
      }).join("");
  box.querySelectorAll("[data-fk]").forEach(function(el){
    el.onclick = function(){
      if(el.classList.contains("none")) return;
      FILE_KIND = el.getAttribute("data-fk");
      drawFileDocs();
    };
  });
}

/** แบ่งใบในแฟ้มเป็นสามกอง — ใช้ได้ตามปกติ · เคยแก้ไข · ยกเลิกแล้ว

    สามอย่างนี้หน้าตาเหมือนกันหมด ต่างกันแค่ตัวหนังสือเล็ก ๆ ท้ายบรรทัด
    ปนกันอยู่ในรายการเดียวเมื่อไร วันหนึ่งจะมีคนหยิบใบที่ยกเลิกแล้วไปส่งลูกค้า
    หรือส่งให้บัญชี แล้วรู้ตัวตอนที่แก้ยากไปแล้ว */
var DOC_GROUPS = [
  { key: "live", hd: "ใช้ได้ตามปกติ",
    pick: function(d){ return !d.voidWhy && !Number(d.revised) } },
  { key: "revised", hd: "เคยแก้ไข — ยอดในระบบไม่เท่ากับใบที่พิมพ์ครั้งแรก",
    pick: function(d){ return !d.voidWhy && Number(d.revised) > 0 } },
  { key: "dead", hd: "ยกเลิกแล้ว — ห้ามส่งลูกค้า ห้ามส่งบัญชี",
    pick: function(d){ return !!d.voidWhy } }
];

/** ข้างในแฟ้มหนึ่งใบ */
function drawDocOne(box, rows, counts, total){
  var k = docKind(FILE_KIND);
  var outId = "rp-out-fold";
  if(!rows.length){
    box.innerHTML = docBackBar()
      + '<div class="empty"><b>ยังไม่มี' + esc(k.label) + '</b>'
      + 'ใบที่ออกจากนี้ไปจะมาอยู่ในแฟ้มนี้</div>';
  } else {
    box.innerHTML = docBackBar()
      + DOC_GROUPS.map(function(g){
          var part = rows.filter(g.pick);
          if(!part.length) return "";
          return '<div class="subhd grp-' + g.key + '">' + esc(g.hd)
            + ' · ' + part.length + ' ใบ</div>'
            + part.map(docRowHtml).join("");
        }).join("")
      + '<div id="' + outId + '" style="margin-top:10px"></div>'
      + (total > rows.length
          ? '<div class="hint" style="margin-top:8px">แสดง ' + rows.length + ' ใบล่าสุด '
            + 'จากทั้งหมด ' + total + ' ใบ · พิมพ์เลขใบหรือชื่อลูกค้าในช่องค้นหาข้างบน '
            + 'เพื่อหาใบที่เก่ากว่านี้</div>'
          : '');
    bindDocRows(box, outId, drawFileDocs);
  }
  var b = box.querySelector(".fold-back");
  if(b) b.onclick = function(){ FILE_KIND = ""; drawFileDocs() };
}

function docBackBar(){
  return '<button class="mini fold-back" style="margin-bottom:10px">← ทุกแฟ้ม</button>';
}

/** ผลค้นหา — ยังแยกหัวข้อตามชนิดใบ ไม่เทรวมกันเป็นกองเดียว */
function drawDocHits(box, rows, q){
  if(!rows.length){
    box.innerHTML = '<div class="empty"><b>ไม่พบเอกสารที่ค้นหา</b>'
      + 'พิมพ์เลขที่เอกสาร ชื่อลูกค้า หรือเลขออเดอร์บางส่วนก็ได้</div>';
    return;
  }
  var by = {};
  rows.forEach(function(d){ (by[d.type] || (by[d.type] = [])).push(d) });
  var order = DOC_KINDS.map(function(k){ return k.th });
  for(var t in by) if(order.indexOf(t) < 0) order.push(t);

  var outId = "rp-out-hits";
  box.innerHTML = '<div class="hint" style="padding:0 2px 8px">ผลค้นหา “' + esc(q) + '” · '
      + rows.length + ' ใบ</div>'
    + order.filter(function(t){ return by[t] }).map(function(t){
        var k = docKind(t);
        return '<div class="subhd">' + k.ic + ' ' + esc(k.label)
          + ' · ' + by[t].length + ' ใบ</div>'
          + by[t].map(docRowHtml).join("");
      }).join("")
    + '<div id="' + outId + '" style="margin-top:10px"></div>';
  bindDocRows(box, outId, drawFileDocs);
}

/* ------------------------------------------------------------- แฟ้มเอกสาร

   สองเรื่องที่เคยตามหายาก มาอยู่หน้าเดียวกัน
     เอกสารที่ออกไปแล้ว  เคยอยู่ต่อท้ายฟอร์มใบเสนอราคา ต้องเลื่อนผ่านใบ A4 ทั้งใบ
     สรุปรายเดือน        เคยไม่มีที่ไหนเลย ต้องเปิดชีทแล้วไล่กรองเอง

   ไม่ทำเป็นแท็บ แถบล่างเต็มแล้ว เข้าจากปุ่มในหน้าใบเสนอราคา แท็บนั้นจึงติดไฟค้างไว้ */

var FILE_TAB = "doc";
var MONTHS_TH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
                 "ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

/** 2026-01 → "ม.ค. 2569" — ปีไทยเหมือนทุกที่ในแอป */
function ymThai(ym){
  var m = /^(\d{4})-(\d{2})$/.exec(String(ym||""));
  if(!m) return String(ym||"");
  return MONTHS_TH[Number(m[2])-1] + " " + (Number(m[1]) + 543);
}

function fileInit(){
  var bk = $("#fl-back");
  if(bk && !bk.dataset.bound){
    bk.dataset.bound = "1";
    bk.onclick = function(){ go("quote") };
  }
  $$("#fl-tabs button").forEach(function(b){
    if(b.dataset.bound) return;
    b.dataset.bound = "1";
    b.onclick = function(){ FILE_TAB = b.dataset.fl; fileDraw() };
  });
  var q = $("#fl-q");
  if(q && !q.dataset.bound){
    q.dataset.bound = "1";
    q.oninput = function(){ FILE_KIND = ""; drawFileDocs() };
  }
  pasteInit();
  fileDraw();
}

function fileDraw(){
  $$("#fl-tabs button").forEach(function(b){
    b.classList.toggle("on", b.dataset.fl === FILE_TAB);
  });
  $("#fl-doc-card").style.display   = FILE_TAB === "doc"   ? "" : "none";
  $("#fl-month-card").style.display = FILE_TAB === "month" ? "" : "none";
  if(FILE_TAB === "doc") drawFileDocs();
  else loadMonths();
}

/* ------------------------------------------------------ สรุปรายเดือน */

var MONTHS = null;

function loadMonths(force){
  var box = $("#fl-months");
  if(!box) return;
  if(MONTHS && !force){ drawMonths(); return }
  box.innerHTML = '<div class="load">กำลังคิดยอดจากชีท…</div>';
  /* ขอย้อนหลัง 12 เดือน เดือนที่ยังไม่มีอะไรเลยก็ต้องขึ้น จะได้เห็นว่ายังไม่ได้กรอกค่าแอด */
  call("getMonthReport", [12], function(list){
    MONTHS = list || [];
    drawMonths();
  }, function(m){
    box.innerHTML = '<div class="empty" style="color:var(--red)">คิดยอดไม่สำเร็จ<br>'
      + esc(m) + '</div>';
  });
}

/* ยอดของเดือนหนึ่งไม่ใช่ตัวเลขตัวเดียว — ไฟล์รายเดือนที่เจ้าของร้านมีเป็นยอด Shopee
   ล้วน ๆ ถ้าเอามากรอกรวมกับช่องทางอื่นจะอ่านผิดทันที ทั้งยอดขายและค่าแอด
   จึงแยกทีละช่องทาง ยอดของเดือน = ผลรวมของช่องทางในเดือนนั้น ไม่เก็บซ้ำอีกที่ */
function drawMonths(){
  var box = $("#fl-months");
  if(!box) return;
  var list = MONTHS || [];
  if(!list.length){
    box.innerHTML = '<div class="empty"><b>ยังไม่มีข้อมูลสักเดือน</b>'
      + 'พอคีย์ออเดอร์ใบแรก เดือนนั้นจะมาขึ้นตรงนี้เอง</div>';
    return;
  }

  /* ยอดรวมทุกเดือนที่เห็นอยู่ — คำถามแรกที่เจ้าของร้านถามคือ "ทั้งปีเหลือเท่าไร" */
  var t = { sales:0, cost:0, ads:0, net:0 };
  list.forEach(function(r){
    t.sales += Number(r.sales)||0; t.cost += Number(r.cost)||0;
    t.ads   += Number(r.ads)||0;   t.net  += Number(r.net)||0;
  });

  box.innerHTML =
      '<div class="kpis" style="margin-bottom:12px">'
    + '<div class="kpi"><span>ยอดขายรวม ' + list.length + ' เดือน</span><b>' + baht(t.sales) + '</b></div>'
    + '<div class="kpi"><span>ต้นทุนรวม</span><b>' + baht(t.cost) + '</b></div>'
    + '<div class="kpi"><span>ค่าแอดรวม</span><b>' + baht(t.ads) + '</b></div>'
    + '<div class="kpi"><span>กำไรสุทธิรวม</span><b style="color:'
    +   (t.net < 0 ? 'var(--red)' : 'var(--green)') + '">' + baht(t.net) + '</b></div>'
    + '</div>'
    + list.map(function(r, i){ return monthCard(r, i) }).join("")
    + '<div class="hint" style="margin-top:10px">กำไรสุทธิ = ยอดขาย − ต้นทุน − ค่าแอด · '
    + 'ยอดของเดือนคือผลรวมของทุกช่องทาง · '
    + 'ใบที่ยกเลิกหรือตีกลับไม่ถูกนับเป็นยอดขาย · '
    + 'ช่องที่เว้นว่างไว้ระบบคิดให้จากออเดอร์จริง ที่กรอกเองชนะที่ระบบคิด '
    + '(แก้ในชีท <b>สรุปเดือน</b> ได้)</div>';

  bindMonths(list);
}

/** หนึ่งเดือน = หัวเดือนกับยอดรวม แล้วไล่ทีละช่องทางข้างใน */
function monthCard(r, i){
  var neg = Number(r.net) < 0;
  var chans = r.chans || [];
  return '<div class="mrow" data-mi="' + i + '">'
    + '<div class="mhd"><b>' + esc(ymThai(r.ym)) + '</b>'
    +   '<span>' + (chans.length ? chans.length + ' ช่องทาง' : 'ยังไม่มีช่องทาง')
    +   (r.orders ? ' · ' + r.orders + ' ใบในระบบ' : '') + '</span></div>'
    + '<div class="mgrid">'
    +   '<div>ยอดขาย<b>' + baht(r.sales) + '</b></div>'
    +   '<div>ต้นทุน<b>' + baht(r.cost) + '</b></div>'
    +   '<div>ค่าแอด<b>' + baht(r.ads) + '</b></div>'
    +   '<div class="' + (neg ? 'neg' : 'net') + '">กำไรสุทธิ<b>' + baht(r.net) + '</b></div>'
    + '</div>'
    + (chans.length
        ? '<div class="mchans">' + chans.map(function(c, j){ return chanCard(c, j) }).join("") + '</div>'
        : '<div class="hint" style="margin-top:8px">เดือนนี้ยังไม่มียอดของช่องทางไหนเลย '
          + 'เลือกช่องทางข้างล่างแล้วกรอกยอดจากไฟล์ได้</div>')
    + '<div class="madd">'
    +   '<select class="m-newchan">' + chanOptions(chans) + '</select>'
    +   '<button class="mini m-add">เพิ่มช่องทาง</button>'
    + '</div>'
    + '</div>';
}

/** ช่องทางที่ยังไม่มีในเดือนนี้เท่านั้น — เลือกตัวที่มีอยู่แล้วจะได้การ์ดซ้ำสองใบ */
function chanOptions(chans){
  var have = {};
  (chans || []).forEach(function(c){ have[c.chan] = 1 });
  var all = ((BOOT && BOOT.lists && BOOT.lists.channel) || []).slice();
  if(all.indexOf("อื่น ๆ") < 0) all.push("อื่น ๆ");
  var left = all.filter(function(v){ return !have[v] });
  if(!left.length) return '<option value="">มีครบทุกช่องทางแล้ว</option>';
  return left.map(function(v){
    return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
  }).join("");
}

/** หนึ่งช่องทางในเดือนนั้น — ตัวเลขที่เห็น กับช่องกรอกที่ทับตัวเลขนั้นได้ */
function chanCard(c, j){
  var neg = Number(c.net) < 0;
  return '<div class="mchan" data-ci="' + j + '">'
    + '<div class="mchd"><b>' + esc(c.chan) + '</b>'
    +   '<span>' + (c.orders ? c.orders + ' ใบในระบบ' : 'ไม่มีออเดอร์ในระบบ') + '</span></div>'
    + '<div class="mgrid">'
    +   '<div>ยอดขาย<b>' + baht(c.sales)
    +     (c.typedSales ? '<span class="mtyped">กรอกเอง</span>' : '') + '</b></div>'
    +   '<div>ต้นทุน<b>' + baht(c.cost)
    +     (c.typedCost ? '<span class="mtyped">กรอกเอง</span>' : '') + '</b></div>'
    +   '<div>ค่าแอด<b>' + baht(c.ads) + '</b></div>'
    +   '<div class="' + (neg ? 'neg' : 'net') + '">กำไรสุทธิ<b>' + baht(c.net) + '</b></div>'
    + '</div>'
    + (c.note ? '<div class="hint" style="margin-top:6px">' + esc(c.note) + '</div>' : '')
    + '<div class="medit">'
    +   monthInput("m-sales", "ยอดขาย", c.sales, c.typedSales, c.orders)
    +   monthInput("m-cost",  "ต้นทุน", c.cost,  c.typedCost,  c.orders)
    +   monthInput("m-ads",   "ค่าแอด", c.ads,   Number(c.ads) > 0, 0)
    +   '<button class="mini m-save">บันทึก</button>'
    + '</div>'
    + '<div class="m-msg"></div>'
    + '</div>';
}

/* ช่องว่างไม่ได้แปลว่าศูนย์ แปลว่า "ใช้ที่ระบบคิดให้" — placeholder จึงต้องบอกแบบนั้น
   ไม่ใส่ตัวเลขลงใน placeholder เพราะช่องแคบกว่าเลขยาว ๆ พอถูกตัดท้ายจะกลายเป็น
   เลขคนละตัว (1,103.59 อ่านได้เป็น 11) ตัวเลขจริงอยู่ในตารางเหนือช่องกรอกอยู่แล้ว */
function monthInput(cls, label, val, typed, orders){
  var ph = typed ? label : (orders ? "ระบบคิดให้" : "ยังไม่ได้กรอก");
  return '<label class="mfld"><span>' + esc(label) + '</span>'
    + '<input type="number" inputmode="decimal" step="0.01" class="' + cls + '"'
    + ' placeholder="' + esc(ph) + '"'
    + ' value="' + (typed ? num_(val) : "") + '"></label>';
}

function bindMonths(list){
  $$("#fl-months .mrow").forEach(function(el){
    var r = list[+el.dataset.mi];

    /* เดือนเก่าที่ไม่มีออเดอร์ในระบบเลย ต้องเปิดช่องทางขึ้นมากรอกเองได้
       ทำฝั่งหน้าจอล้วน ยังไม่เขียนลงชีทจนกว่าจะกดบันทึก จะได้ไม่มีแถวเปล่าค้าง */
    var add = el.querySelector(".m-add");
    if(add) add.onclick = function(){
      var v = el.querySelector(".m-newchan").value;
      if(!v) return;
      r.chans = (r.chans || []).concat([{
        chan: v, orders: 0, sales: 0, cost: 0, ads: 0, gross: 0, net: 0,
        typedSales: false, typedCost: false, note: "", isNew: true
      }]);
      drawMonths();
      var fresh = $$("#fl-months .mrow")[+el.dataset.mi];
      var cards = fresh ? fresh.querySelectorAll(".mchan") : [];
      var last = cards[cards.length - 1];
      if(last) last.querySelector(".m-sales").focus();
    };

    el.querySelectorAll(".mchan").forEach(function(ce){
      var c = r.chans[+ce.dataset.ci];
      ce.querySelector(".m-save").onclick = function(){
        var b = this;
        function val(sel){
          var s = ce.querySelector(sel).value.trim();
          return s === "" ? "" : Number(s);
        }
        b.disabled = true; b.textContent = "กำลังบันทึก…";
        call("saveMonth", [{ ym: r.ym, chan: c.chan,
                             sales: val(".m-sales"), cost: val(".m-cost"), ads: val(".m-ads"),
                             by: byName(), clientKey: newKey() }],
          function(){
            ce.querySelector(".m-msg").innerHTML =
              '<div class="msg ok" style="display:block">บันทึก ' + esc(c.chan) + ' ของ '
              + esc(ymThai(r.ym)) + ' แล้ว</div>';
            b.disabled = false; b.textContent = "บันทึก";
            loadMonths(true);
          },
          function(m){
            b.disabled = false; b.textContent = "บันทึก";
            ce.querySelector(".m-msg").innerHTML =
              '<div class="msg err" style="display:block">' + esc(m) + '</div>';
          });
      };
    });
  });
}

/* --------------------------------- วางตารางจาก Excel แล้วคิดยอดของทั้งปีให้

   เดือนก่อนเริ่มใช้ระบบไม่มีออเดอร์ในชีทสักใบ ยอดอยู่ในไฟล์ที่โหลดจาก Shopee ล้วน ๆ
   จะให้นั่งบวกเองทีละเดือนแล้วพิมพ์เข้ามาก็ได้ แต่ไฟล์เดือนละพันกว่าบรรทัด
   บวกมือทีเดียวผิดคือกำไรทั้งเดือนผิด และไม่มีอะไรจับได้เลย

   ใช้ตัวอ่านตารางชุดเดียวกับหน้านำเข้าออเดอร์ Shopee ต่างกันแค่ปลายทาง
   อันนั้นลงเป็นออเดอร์รายใบเพื่อตัดสต๊อก อันนี้ลงเป็นยอดรวมของเดือน ไม่แตะสต๊อก */

var PASTE_MONTHS = null;

function pasteInit(){
  var op = $("#fl-paste-open");
  if(op && !op.dataset.bound){
    op.dataset.bound = "1";
    op.onclick = function(){
      var box = $("#fl-paste");
      var show = box.style.display === "none";
      box.style.display = show ? "" : "none";
      if(show) $("#fl-text").focus();
    };
  }
  var cl = $("#fl-paste-close");
  if(cl && !cl.dataset.bound){
    cl.dataset.bound = "1";
    cl.onclick = function(){ $("#fl-paste").style.display = "none" };
  }
  var rd = $("#fl-read");
  if(rd && !rd.dataset.bound){
    rd.dataset.bound = "1";
    rd.onclick = pasteRead;
  }
}

function pasteRead(){
  var out = $("#fl-paste-out");
  var txt = $("#fl-text").value;
  if(!String(txt).trim()){
    out.innerHTML = '<div class="msg err" style="display:block">ยังไม่ได้วางอะไรลงมา</div>';
    return;
  }
  var chan = (typeof shopChannel === "function") ? shopChannel() : "";
  if(!chan){
    /* ไม่มีช่องทางชื่อ Shopee ในชีท ตั้งค่า = กรอกลงไปก็ไปอยู่ผิดช่องทาง
       บอกตั้งแต่ก่อนคิดยอด ดีกว่าให้คิดเสร็จแล้วกดบันทึกไม่ได้ */
    out.innerHTML = '<div class="msg err" style="display:block">'
      + 'ยังไม่มีช่องทางขายชื่อ Shopee ในชีท <b>ตั้งค่า</b><br>'
      + 'เติมคำว่า Shopee ลงในรายการช่องทางขายก่อน แล้วเปิดแอปใหม่</div>';
    return;
  }

  var r = monthTotals(txt);
  if(!r.ok){
    /* บอกให้ตรงว่าขาดคอลัมน์ไหน คนจะได้กลับไปส่งออกไฟล์ใหม่ให้มีคอลัมน์นั้น
       ไม่ใช่บอกลอย ๆ ว่า "อ่านไม่ได้" แล้วปล่อยให้เดาเอง */
    out.innerHTML = '<div class="msg err" style="display:block">'
      + '<b>อ่านตารางนี้ไม่ได้</b><br>ขาดคอลัมน์ ' + esc((r.missing || []).join(" · "))
      + '<br><br>ในไฟล์ที่ส่งออกจาก Shopee ให้ติ๊กคอลัมน์นี้มาด้วย '
      + 'แล้วค่อยคัดลอกมาวางใหม่ · ระบบไม่คิดยอดให้ทั้งที่ข้อมูลไม่ครบ '
      + 'เพราะเลขที่ได้จะดูน่าเชื่อแต่ผิด'
      + ((r.headers && r.headers.length)
          ? '<br><br><span style="font-weight:400">คอลัมน์ที่เจอในตารางที่วางมา: '
            + esc(r.headers.join(" · ")) + '</span>'
          : '')
      + '</div>';
    return;
  }
  if(!r.months.length){
    out.innerHTML = '<div class="msg err" style="display:block">'
      + 'อ่านตารางได้ แต่ไม่มีแถวไหนมีวันที่ใช้ได้เลย — คลุมมาครบทั้งแผ่นหรือยัง</div>';
    return;
  }

  PASTE_MONTHS = r.months;
  pasteDraw(chan, r.noDate);
}

function pasteDraw(chan, noDate){
  var list = PASTE_MONTHS || [];
  var sum = list.reduce(function(a, m){ return a + m.sales }, 0);
  var drop = list.reduce(function(a, m){ return a + m.dropSales }, 0);

  $("#fl-paste-out").innerHTML =
      '<div class="msg ok" style="display:block">อ่านได้ ' + list.length + ' เดือน '
    + 'รวม ' + baht(sum) + ' — ยอดนี้จะลงที่ช่องทาง <b>' + esc(chan) + '</b></div>'
    + (drop ? '<div class="hint" style="margin:8px 2px">ไม่นับใบที่ยกเลิกหรือคืนของ '
        + baht(drop) + ' — ยอดรวมที่ Shopee โชว์ท้ายไฟล์มักบวกใบพวกนี้ด้วย '
        + 'ตัวเลขจึงไม่เท่ากัน และตัวที่ถูกคือตัวที่ไม่บวก</div>' : '')
    + (noDate ? '<div class="hint" style="margin:8px 2px">มี ' + noDate
        + ' แถวที่ไม่มีวันที่ ไม่ได้นับ (มักเป็นแถวรวมยอดที่พิมพ์ไว้ท้ายแผ่น)</div>' : '')
    + '<div class="mchans" style="margin-top:10px">'
    + list.map(function(m, i){
        return '<div class="mchan" data-pi="' + i + '">'
          + '<div class="mchd"><b>' + esc(ymThai(m.ym)) + '</b>'
          +   '<span>' + m.orders + ' ใบ · ' + m.lines + ' บรรทัด</span></div>'
          + '<div class="mgrid">'
          +   '<div>ยอดขาย<b>' + baht(m.sales) + '</b></div>'
          +   '<div>ไม่นับ (ยกเลิก/คืน)<b>' + baht(m.dropSales) + '</b></div>'
          + '</div>'
          + '<div class="medit"><button class="mini p-one">กรอกลงเดือนนี้</button></div>'
          + '<div class="m-msg"></div>'
          + '</div>';
      }).join("")
    + '</div>'
    + '<button class="btn" id="fl-all" style="margin-top:10px">กรอกทั้งหมด '
    +   list.length + ' เดือน</button>'
    + '<div class="hint" style="margin-top:8px">กรอกแล้วทับเฉพาะ <b>ยอดขาย</b> ของช่องทาง '
    + esc(chan) + ' เท่านั้น · ต้นทุนกับค่าแอดที่เคยกรอกไว้ไม่ถูกแตะ</div>';

  $$("#fl-paste-out .mchan").forEach(function(el){
    var m = list[+el.dataset.pi];
    el.querySelector(".p-one").onclick = function(){
      pasteSave([m], chan, this, el.querySelector(".m-msg"));
    };
  });
  $("#fl-all").onclick = function(){
    pasteSave(list, chan, this, null);
  };
}

/* บันทึกทีละเดือนเรียงกัน ไม่ยิงพร้อมกันทั้งกอง — ฝั่งชีทมี LockService อยู่
   ยิงพร้อมกันสิบเดือนคือเก้าเดือนไปรอคิวจนหมดเวลา แล้วขึ้น "ระบบกำลังยุ่งอยู่" */
function pasteSave(months, chan, btn, msgBox){
  var was = btn.textContent, i = 0, done = 0, bad = [];
  btn.disabled = true;

  function step(){
    if(i >= months.length){
      btn.disabled = false; btn.textContent = was;
      var t = bad.length
        ? '<div class="msg err" style="display:block">กรอกได้ ' + done + ' เดือน · '
          + 'ไม่ผ่าน ' + bad.length + ' เดือน<br>' + esc(bad.join(" · ")) + '</div>'
        : '<div class="msg ok" style="display:block">กรอกยอด ' + chan + ' แล้ว '
          + done + ' เดือน</div>';
      if(msgBox) msgBox.innerHTML = t;
      else $("#fl-paste-out").insertAdjacentHTML("afterbegin", t);
      loadMonths(true);
      return;
    }
    var m = months[i++];
    btn.textContent = "กำลังกรอก " + ymThai(m.ym) + "…";
    call("saveMonth", [{ ym: m.ym, chan: chan, sales: m.sales,
                         by: byName(), clientKey: newKey() }],
      function(){ done++; step() },
      function(e){ bad.push(ymThai(m.ym) + " (" + e + ")"); step() });
  }
  step();
}

/* --------------------------------------------- ของใกล้หมด + ล็อตใกล้หมดอายุ

   ทำระบบล็อตมาทั้งชุดเพื่อคุมวันหมดอายุของเคมี แต่ไม่มีอะไรเตือนเลย
   ของที่หมดอายุคือของที่ขายไม่ได้ และรู้ตอนลูกค้าสั่งแล้วคือสายไป
   คิดจากข้อมูลที่โหลดมาตอนเปิดแอปอยู่แล้ว ไม่ต้องยิงชีทเพิ่ม        */

var EXP_SOON_DAYS = 60;

function drawAlerts(){
  var box = $("#sum-alert");
  if(!box) return;

  var lots = (BOOT && BOOT.lots) || {};
  var def = Number(BOOT && BOOT.reorderDefault) || 0;
  var low = [], exp = [];
  var now = Date.now();

  (CFG.products||[]).forEach(function(p){
    var remain = p.remain;
    var point = (p.reorder === null || p.reorder === undefined || p.reorder === "")
      ? def : Number(p.reorder);
    if(remain !== null && remain !== undefined && point > 0 && Number(remain) <= point){
      low.push({ sku:p.sku, name:p.name, remain:Number(remain), point:point, unit:p.unit });
    }
    var l = lots[p.sku];
    if(l && l.next && l.next.exp){
      var days = Math.round((l.next.exp - now) / 86400000);
      if(days <= EXP_SOON_DAYS){
        exp.push({ sku:p.sku, name:p.name, lotNo:l.next.lotNo,
                   remain:l.next.remain, days:days, unit:p.unit });
      }
    }
  });

  if(!low.length && !exp.length){
    box.innerHTML = '<div class="card"><div class="sum big" style="border:0;margin:0;padding:2px 0">'
      + '<span>สต๊อกและวันหมดอายุ</span><b style="color:var(--green)">ปกติ ✓</b></div></div>';
    return;
  }

  /* เหลือน้อยที่สุดขึ้นก่อน และของที่หมดอายุแล้วขึ้นก่อนของที่ใกล้หมดอายุ */
  low.sort(function(a,b){ return a.remain - b.remain });
  exp.sort(function(a,b){ return a.days - b.days });

  box.innerHTML = '<div class="card">'
    + (exp.length ? '<div class="subhd" style="margin-top:0">ล็อตที่ต้องรีบระบาย ('
        + exp.length + ')</div>'
        + exp.slice(0,6).map(function(e){
            var bad = e.days < 0;
            return '<div class="lotline ' + (bad ? 'bad' : 'warn') + '">'
              + (bad ? '⛔ หมดอายุแล้ว ' + (-e.days) + ' วัน' : '⚠️ อีก ' + e.days + ' วันหมดอายุ')
              + ' — ' + esc(e.name) + ' · ล็อต ' + esc(e.lotNo)
              + ' · เหลือ ' + esc(qtyUnit(e.remain, e.unit||"ชิ้น")) + '</div>';
          }).join("")
        + (exp.length > 6 ? '<div class="hint">และอีก ' + (exp.length-6) + ' ล็อต</div>' : '')
      : '')
    + (low.length ? '<div class="subhd">ถึงจุดสั่งซื้อแล้ว (' + low.length + ')</div>'
        + low.slice(0,8).map(function(p){
            return '<div class="lotline ' + (p.remain <= 0 ? 'bad' : 'warn') + '">'
              + (p.remain <= 0 ? '⛔ หมดแล้ว' : '📦 เหลือ ' + esc(qtyUnit(p.remain, p.unit||"ชิ้น")))
              + ' — ' + esc(p.name)
              + ' <span style="color:var(--gray)">(จุดสั่งซื้อ ' + p.point + ')</span></div>';
          }).join("")
        + (low.length > 8 ? '<div class="hint">และอีก ' + (low.length-8) + ' รายการ</div>' : '')
      : '')
    + '</div>';
}

function drawSummary(all){
  var live = all.filter(function(o){
    return !isDead(o) && inRange_(o.date, SUM_RANGE);
  });

  if (!live.length){
    $("#summary").innerHTML = '<div class="empty"><b>ยังไม่มีออเดอร์ในช่วงนี้</b>'
      + 'ลองเลือกช่วงเวลาอื่นดู</div>';
    return;
  }

  var net=0, sub=0, ship=0, profit=0, pieces=0;
  live.forEach(function(o){
    net    += Number(o.net)||0;
    sub    += Number(o.subtotal)||0;
    ship   += Number(o.ship)||0;
    profit += Number(o.profit)||0;
    (o.items||[]).forEach(function(it){ pieces += Number(it.qty)||0 });
  });

  var h = '<div class="kpis">'
    + '<div class="kpi"><span>ออเดอร์</span><b>' + live.length + ' ใบ</b></div>'
    + '<div class="kpi"><span>จำนวนชิ้น</span><b>' + pieces + '</b></div>'
    + '<div class="kpi wide"><span>ยอดชำระสุทธิ</span><b>' + baht(net) + '</b></div>'
    + '<div class="kpi good"><span>กำไรขั้นต้น</span><b>' + baht(profit) + '</b></div>'
    + '<div class="kpi"><span>ค่าจัดส่งรวม</span><b>' + baht(ship) + '</b></div>'
    + '</div>';

  function rows_(arr, fmt){
    var max = arr.length ? arr[0].v : 0;
    return arr.map(function(g){
      return bar_(g.key, baht(g.v), fmt(g), max ? g.v/max : 0);
    }).join("");
  }

  var byCarrier = group_(live, function(o){ return o.carrier },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.ship)||0 });
  h += section_("ตามค่ายขนส่ง", rows_(byCarrier, function(g){
    return g.n + " ใบ · ค่าส่ง " + baht(g.extra);
  }));

  var byChan = group_(live, function(o){ return o.channel },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.profit)||0 });
  h += section_("ตามช่องทางขาย", rows_(byChan, function(g){
    return g.n + " ใบ · กำไร " + baht(g.extra);
  }));

  /* สินค้าขายดี — นับเป็น "ชิ้น" เหมือนที่ร้านดู ไม่ใช่นับเป็นใบ */
  var prod = {};
  live.forEach(function(o){
    (o.items||[]).forEach(function(it){
      var k = it.name || it.sku; if (!k) return;
      if (!prod[k]) prod[k] = { key:k, n:0, v:0, extra:0 };
      prod[k].n += Number(it.qty)||0;
      prod[k].v += Number(it.total)||0;
      prod[k].extra += 1;
    });
  });
  var top = Object.keys(prod).map(function(k){ return prod[k] })
    .sort(function(a,b){ return b.n - a.n }).slice(0, 5);
  var maxN = top.length ? top[0].n : 0;
  h += section_("สินค้าขายดี 5 อันดับ", top.map(function(g){
    return bar_(g.key, g.n + " ชิ้น", baht(g.v) + " · " + g.extra + " ออเดอร์",
      maxN ? g.n/maxN : 0);
  }).join(""));

  var byStaff = group_(live, function(o){ return o.staff },
    function(g,o){ g.v += Number(o.net)||0 });
  if (byStaff.length > 1)
    h += section_("ผู้คีย์ออเดอร์", rows_(byStaff, function(g){ return g.n + " ใบ" }));

  h += '<div class="hint" style="padding:0 2px">ตัวเลขทั้งหมดมาจากชีทโดยตรง '
    + 'ไม่ได้คิดซ้ำในแอป · ไม่รวมออเดอร์ที่ยกเลิก</div>';

  /* บอกให้ชัดว่าตัวเลขพวกนี้มาจากไฟล์ไหน กดเปิดได้เลย
     ในไดรฟ์มีไฟล์ชื่อคล้ายกันหลายอัน เคยหลงแก้อยู่คนละไฟล์กับที่แอปเขียนมาแล้ว */
  var f = (BOOT && BOOT.file) || {};
  if (f.name) {
    h += '<div class="hint" style="padding:8px 2px 0">ข้อมูลทั้งหมดอยู่ในไฟล์ '
      + (f.url ? '<a href="'+esc(f.url)+'" target="_blank" rel="noopener"><b>'+esc(f.name)+'</b></a>'
               : '<b>'+esc(f.name)+'</b>')
      + ' — ไฟล์อื่นที่ชื่อคล้ายกันในไดรฟ์ ไม่ใช่ตัวที่แอปเขียน</div>';
  }

  $("#summary").innerHTML = h;
}

/* ------------------------------------------------------------------ ปิดยอดวัน

   หน้าสรุปยอดตอบว่า "ช่วงนี้เป็นยังไง" — หน้านี้ตอบว่า "วันนั้นขายไปเท่าไร"
   คนละงานกันจึงแยกหน้า ปิดยอดคือดูวันเดียวให้ครบทุกใบแล้วจบวัน

   ตัวเลขไม่ได้คิดจากออเดอร์ที่โหลดค้างไว้ในจอ แต่ยิงถามชีทด้วยวันที่ตรง ๆ
   ย้อนไปวันไหนก็ได้ครบทุกใบ ไม่ขาดหายเงียบ ๆ เมื่อออเดอร์สะสมมากขึ้น       */

var DAY_ISO = "";
var DAY_BACK = 7;

function dayShift_(iso, n){
  var p = String(iso||"").split("-");
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]) + Number(n||0));
  return isoOf(d.getTime());
}

function dayInit(){
  if (!DAY_ISO) DAY_ISO = todayISO();
  if (!$("#dy-quick").innerHTML){
    $("#dy-quick").innerHTML =
        '<button data-dq="0">วันนี้</button><button data-dq="-1">เมื่อวาน</button>';
    $("#dy-quick").addEventListener("click", function(e){
      var b = e.target.closest("button[data-dq]"); if(!b) return;
      goDay(dayShift_(todayISO(), Number(b.dataset.dq)));
    });
    $("#dy-prev").onclick = function(){ goDay(dayShift_(DAY_ISO, -1)) };
    $("#dy-next").onclick = function(){ goDay(dayShift_(DAY_ISO, +1)) };
    $("#dy-date").onchange = function(){ if(this.value) goDay(this.value) };
  }
  goDay(DAY_ISO);
}

function goDay(iso){
  DAY_ISO = iso;
  $("#dy-date").value = iso;
  $("#dy-date").max = todayISO();
  $("#dy-when").textContent = thaiDate(iso)
    + (iso === todayISO() ? " · วันนี้" : (iso === dayShift_(todayISO(),-1) ? " · เมื่อวาน" : ""));
  /* ห้ามเดินไปวันข้างหน้า — ยังไม่มีของให้ปิดยอด กดแล้วได้หน้าว่างเปล่าเปล่า ๆ */
  $("#dy-next").disabled = iso >= todayISO();
  $$("#dy-quick button").forEach(function(b){
    b.classList.toggle("on", dayShift_(todayISO(), Number(b.dataset.dq)) === iso);
  });
  $("#dy-body").innerHTML = '<div class="load">กำลังโหลด…</div>';
  call("getDayReport", [iso, DAY_BACK], function(r){
    /* กันคำตอบที่มาช้าของวันเก่ามาทับวันที่กำลังดูอยู่ตอนนี้ */
    if (!r || r.date !== DAY_ISO) return;
    drawDay(r);
  }, function(m){
    $("#dy-body").innerHTML = '<div class="empty" style="color:var(--red)">โหลดไม่สำเร็จ<br>'
      + esc(m) + '</div>';
  });
}

/** ตัวเลขของวัน — คิดที่เดียวแล้วใช้ทั้งหน้าจอและข้อความที่คัดลอก จะได้ไม่มีทางไม่ตรงกัน */
function dayTotals(rep){
  var live = (rep.orders||[]).filter(function(o){ return !isDead(o) });
  var t = { n:live.length, dead:(rep.orders||[]).length - live.length,
            pieces:0, net:0, paid:0, due:0, profit:0, ship:0, cost:0 };
  live.forEach(function(o){
    var net = Number(o.net)||0;
    t.net += net;
    t.profit += Number(o.profit)||0;
    t.ship += Number(o.ship)||0;
    t.cost += Number(o.cost)||0;
    /* ชีทมีช่องสถานะช่องเดียว บอกทั้ง "จ่ายหรือยัง" และ "ส่งหรือยัง" พร้อมกันไม่ได้
       จึงนับเฉพาะ "ชำระแล้ว" ว่าเก็บเงินได้แล้ว เหมือนที่หน้าค้างชำระนับ ตัวเลขสองหน้าจะได้ตรงกัน */
    if (String(o.status||"").trim() === "ชำระแล้ว") t.paid += net; else t.due += net;
    (o.items||[]).forEach(function(it){ t.pieces += Number(it.qty)||0 });
  });
  return t;
}

function drawDay(rep){
  var t = dayTotals(rep);
  var live = (rep.orders||[]).filter(function(o){ return !isDead(o) });

  var h = '<div class="kpis">'
    + '<div class="kpi"><span>ออเดอร์</span><b>' + t.n + ' ใบ</b></div>'
    + '<div class="kpi"><span>จำนวนชิ้น</span><b>' + t.pieces + '</b></div>'
    + '<div class="kpi wide"><span>ยอดขายรวม</span><b>' + baht(t.net) + '</b></div>'
    + '<div class="kpi good"><span>เก็บเงินแล้ว</span><b>' + baht(t.paid) + '</b></div>'
    + '<div class="kpi"><span>ยังไม่เก็บ</span><b'
    +   (t.due > 0 ? ' style="color:var(--amber)"' : '') + '>' + baht(t.due) + '</b></div>'
    + '<div class="kpi good"><span>กำไรขั้นต้น</span><b>' + baht(t.profit) + '</b></div>'
    + '<div class="kpi"><span>ค่าจัดส่ง</span><b>' + baht(t.ship) + '</b></div>'
    + '</div>';

  if (t.dead)
    h += '<div class="hint" style="padding:0 2px 10px">มีใบที่ยกเลิกอีก ' + t.dead
       + ' ใบ ไม่ได้นับรวมในยอดข้างบน</div>';

  h += '<button class="btn ghost" id="dy-copy">คัดลอกสรุปวันนี้เป็นข้อความ</button>';

  if (!t.n){
    $("#dy-body").innerHTML = '<div class="empty"><b>วันนี้ยังไม่มีออเดอร์</b>'
      + 'กดปุ่ม ◀ เพื่อย้อนไปดูวันก่อนหน้า</div>' + dayTrend(rep);
    bindDayTrend();
    return;
  }

  var byChan = group_(live, function(o){ return o.channel },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.profit)||0 });
  var maxC = byChan.length ? byChan[0].v : 0;
  h += section_("ตามช่องทางขาย", byChan.map(function(g){
    return bar_(g.key, baht(g.v), g.n + " ใบ · กำไร " + baht(g.extra), maxC ? g.v/maxC : 0);
  }).join(""));

  /* ทุกใบของวันนั้น ไม่ตัดให้เหลือแค่บางส่วน — ปิดยอดคือต้องเห็นครบ ไม่งั้นปิดไม่ลง */
  h += '<div class="card"><div class="subhd" style="margin-top:0">ออเดอร์ของวันนี้ '
     + t.n + ' ใบ</div>'
     + (rep.orders||[]).map(function(o){
         var dead = isDead(o);
         return '<div class="row"><div class="i">'
           + '<b' + (dead ? ' style="text-decoration:line-through;color:var(--gray)"' : '') + '>'
           + esc(o.cust||"ไม่ระบุชื่อ") + '</b>'
           + '<span>' + esc(o.no) + (o.channel ? ' · ' + chanTag(o.channel) : '') + '</span>'
           + '<span style="color:var(--ink);font-weight:700">' + baht(o.net) + '</span> '
           + '<span class="tag ' + statusTag(o.status) + '">' + esc(o.status||"-") + '</span>'
           + '</div></div>';
       }).join("")
     + '</div>';

  h += dayTrend(rep);

  $("#dy-body").innerHTML = h;
  $("#dy-copy").onclick = function(){ copyText(dayText(rep), "คัดลอกสรุปวันแล้ว") };
  bindDayTrend();
}

/** แท่ง 7 วันย้อนหลัง กดแท่งไหนก็เด้งไปปิดยอดวันนั้น */
function dayTrend(rep){
  var tr = rep.trend || [];
  if (!tr.length) return "";
  var max = 0;
  tr.forEach(function(d){ var v = Number(d.net)||0; if (v > max) max = v });
  return section_(tr.length + " วันย้อนหลัง", tr.slice().reverse().map(function(d){
    return '<button class="tapbar' + (d.date===rep.date ? ' on' : '') + '" data-dy="'
      + esc(d.date) + '">'
      + bar_(thaiDate(d.date), baht(d.net),
             d.n + " ใบ · กำไร " + baht(d.profit), max ? (Number(d.net)||0)/max : 0)
      + '</button>';
  }).join(""));
}

function bindDayTrend(){
  $$("#dy-body [data-dy]").forEach(function(b){
    b.onclick = function(){ goDay(b.getAttribute("data-dy")) };
  });
}

/** ข้อความสรุปวันสำหรับส่งเข้าไลน์กลุ่ม — ตัวเลขชุดเดียวกับที่เห็นบนจอ */
function dayText(rep){
  var t = dayTotals(rep);
  var L = ["สรุปยอดวัน " + thaiDate(rep.date),
           "ออเดอร์ " + t.n + " ใบ · " + t.pieces + " ชิ้น",
           "ยอดขายรวม " + baht(t.net),
           "เก็บเงินแล้ว " + baht(t.paid),
           "ยังไม่เก็บ " + baht(t.due),
           "กำไรขั้นต้น " + baht(t.profit),
           "ค่าจัดส่ง " + baht(t.ship)];
  if (t.dead) L.push("ยกเลิก " + t.dead + " ใบ (ไม่นับรวม)");
  var live = (rep.orders||[]).filter(function(o){ return !isDead(o) });
  var byChan = group_(live, function(o){ return o.channel },
    function(g,o){ g.v += Number(o.net)||0 });
  if (byChan.length){
    L.push("— ช่องทางขาย —");
    byChan.forEach(function(g){ L.push(g.key + " " + g.n + " ใบ " + baht(g.v)) });
  }
  return L.join("\n");
}

/* ------------------------------------------------------------ ตั้งลายเซ็นร้าน */

var SIG_KINDS = [
  { key: "auth",    title: "ผู้มีอำนาจลงนาม",       note: "ช่องขวาสุดของใบ" },
  { key: "cashier", title: "ผู้รับเงิน/พนักงานขาย", note: "ช่องกลางของใบ" }
];

function drawSigSettings(){
  var box = $("#sig-box");
  if (!box) return;
  var have = (CFG.doc && CFG.doc.sign) || {};
  box.innerHTML = SIG_KINDS.map(function(k){
    var on = !!signParse(have[k.key]);
    return '<div class="fld" data-sig="'+k.key+'">'
      + '<label>'+esc(k.title)+' <span class="hint" style="font-weight:400">· '+esc(k.note)+'</span></label>'
      + '<div class="signprev"><canvas data-prev="'+k.key+'" width="600" height="150"></canvas></div>'
      + '<button class="btn ghost" data-signbtn="'+k.key+'" style="margin-top:8px">'
      + (on ? 'เซ็นใหม่ / ลบลายเซ็นนี้' : 'เซ็นลายเซ็น')+'</button>'
      /* คนที่มีลายเซ็นสแกนไว้อยู่แล้วไม่ต้องเซ็นใหม่บนจอ ซึ่งมักออกมาไม่เหมือนของจริง
         แอปตัดขอบขาว ทำพื้นโปร่ง และย่อให้พอดีช่องในชีทให้เอง */
      + '<button class="btn ghost" data-sigimg="'+k.key+'" style="margin-top:7px">'
      + 'ใช้รูปลายเซ็นที่มีอยู่แล้ว</button>'
      + '<input type="file" accept="image/*" data-sigfile="'+k.key+'" style="display:none">'
      + '</div>';
  }).join("");

  SIG_KINDS.forEach(function(k){
    var cv = box.querySelector('canvas[data-prev="'+k.key+'"]');
    if (cv) {
      var g = cv.getContext("2d");
      g.clearRect(0,0,cv.width,cv.height);
      if (!signDraw(g, have[k.key], 20, 12, cv.width-40, cv.height-24)) {
        g.fillStyle = "#9aa0a6"; g.font = "26px sans-serif"; g.textAlign = "center";
        g.fillText("ยังไม่ได้เซ็น", cv.width/2, cv.height/2+9);
        g.textAlign = "left";
      }
    }
    var b = box.querySelector('button[data-signbtn="'+k.key+'"]');
    if (b) b.onclick = function(){ askSign(k); };

    var pick = box.querySelector('button[data-sigimg="'+k.key+'"]');
    var file = box.querySelector('input[data-sigfile="'+k.key+'"]');
    if (pick && file) {
      pick.onclick = function(){ file.value = ""; file.click(); };
      file.onchange = function(){
        var f = file.files && file.files[0];
        if (!f) return;
        pick.disabled = true; pick.textContent = "กำลังจัดรูป…";
        signFromImage(f).then(function(url){
          pick.textContent = "กำลังบันทึก…";
          return api("saveSignature", k.key, url).then(function(){
            CFG.doc.sign = CFG.doc.sign || {};
            CFG.doc.sign[k.key] = url;
            drawSigSettings();
            toast("ใช้รูปลายเซ็นนี้แล้ว");
          });
        }).catch(function(e){
          pick.disabled = false; pick.textContent = "ใช้รูปลายเซ็นที่มีอยู่แล้ว";
          toast("ใช้รูปนี้ไม่ได้: " + (e && e.message ? e.message : e));
        });
      };
    }
  });
}

function askSign(k){
  signPad("ลายเซ็น" + k.title,
    "เซ็นในกรอบด้วยนิ้วหรือปากกาสไตลัส · กด “ล้าง” แล้วกด “ใช้ลายเซ็นนี้” ทั้งที่ว่าง = ลบลายเซ็นเดิมทิ้ง")
  .then(function(sig){
    var btn = $('button[data-signbtn="'+k.key+'"]');
    if (btn) { btn.disabled = true; btn.textContent = "กำลังบันทึก…"; }
    api("saveSignature", k.key, sig ? JSON.stringify(sig) : "").then(function(){
      CFG.doc.sign = CFG.doc.sign || {};
      CFG.doc.sign[k.key] = sig ? JSON.stringify(sig) : "";
      drawSigSettings();
      toast(sig ? "เก็บลายเซ็นแล้ว ใบที่ออกหลังจากนี้จะมีลายเซ็นเอง" : "ลบลายเซ็นแล้ว");
    }, function(e){
      drawSigSettings();
      toast("บันทึกไม่สำเร็จ: " + (e && e.message ? e.message : e));
    });
  });
}

/* -------------------------------------------------------------------- modal */

function openModal(title, html){
  $("#m-title").textContent=title;
  $("#m-body").innerHTML=html;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); $("#m-body").innerHTML="" }
$("#modal").addEventListener("click", function(e){ if(e.target===this) closeModal() });
$("#m-close").onclick = closeModal;
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal() });

/* ------------------------------------------------------------ รับของเข้าสต๊อก

   หน้านี้มีอยู่เพราะการรับของต้องลงสองชีทเสมอ (รับเข้า + ล็อตสินค้า)
   ตอนที่ยังต้องเปิดชีทลงเอง ลืมอันใดอันหนึ่งเมื่อไรคือพังแบบเงียบ ๆ:
   ลงแต่ล็อต ยอดคงเหลือเป็นศูนย์ · ลงแต่รับเข้า ขายไม่ได้เพราะไม่มีล็อตให้ตัด   */

var RECV_KEY = "";     /* คีย์กันบันทึกซ้ำของครั้งนี้ ออกใหม่ทุกครั้งที่บันทึกสำเร็จ */
var RECV_READY = false;

function recvInit(){
  if(RECV_READY) return;
  RECV_READY = true;

  $("#r-sku").innerHTML = prodOptions("");
  fillSelect("#r-type", (BOOT && BOOT.lists && BOOT.lists.recvType) || ["ซื้อเข้า"]);
  $("#r-date").value = todayISO();

  /* ผู้บันทึกใช้รายชื่อชุดเดียวกับหน้าคีย์ออเดอร์ และจำคนล่าสุดไว้เหมือนกัน */
  var by = $("#f-by");
  $("#r-by").innerHTML = by ? by.innerHTML : "";
  if(by && by.value) $("#r-by").value = by.value;

  $("#r-sku").onchange = recvSkuChanged;
  $("#btn-recv").onclick = recvSave;
  recvSkuChanged();
}

/** ของตัวนี้คุมล็อตไหม เหลือเท่าไร — ตอบจากข้อมูลที่โหลดมาตอนเปิดแอป */
function recvLotInfo(sku){
  var lot = (BOOT && BOOT.lots) ? BOOT.lots[sku] : null;
  return lot || null;
}

function recvSkuChanged(){
  var sku = $("#r-sku").value;
  var card = $("#r-lot-card");
  if(!sku){
    $("#r-now").textContent = "เลือกสินค้าก่อน";
    card.style.display = "none";
    return;
  }
  var p = null;
  for(var i=0;i<CFG.products.length;i++) if(CFG.products[i].sku===sku){ p=CFG.products[i]; break }
  var lot = recvLotInfo(sku);
  var now = "ตอนนี้สต๊อกเหลือ " + qtyUnit(
    (p && p.remain!==null && p.remain!==undefined) ? p.remain : "—", (p&&p.unit)||"ชิ้น");
  if(lot) now += " · ในล็อตเหลือ " + lot.total + " (" + lot.count + " ล็อต)";
  $("#r-now").textContent = now;

  /* คุมล็อตอยู่แล้ว = บังคับใส่เลขล็อต · ยังไม่เคยมีล็อต = ใส่ก็ได้ไม่ใส่ก็ได้ */
  card.style.display = "";
  $("#r-lot-why").innerHTML = lot
    ? "<b>สินค้าตัวนี้คุมล็อต ต้องใส่เลขล็อต</b> ไม่งั้นของเข้าสต๊อกแต่ขายไม่ได้ เพราะระบบไม่มีล็อตให้ตัด"
    : "สินค้าตัวนี้ยังไม่เคยลงล็อตไว้ ใส่หรือไม่ใส่ก็ได้ — ถ้าเป็นของที่มีวันหมดอายุ แนะนำให้ใส่";
}

function recvSave(){
  clearMsg();
  var sku = $("#r-sku").value;
  var qty = Number($("#r-qty").value);
  if(!sku){ showErr("ยังไม่ได้เลือกสินค้า"); return }
  if(!(qty > 0)){ showErr("จำนวนที่รับเข้าต้องมากกว่า 0"); return }

  var lot = recvLotInfo(sku);
  var lotNo = $("#r-lot").value.trim();
  if(lot && !lotNo){
    showErr("สินค้าตัวนี้คุมล็อต ต้องใส่เลขล็อตด้วย — ถ้าลงแต่จำนวน ของจะเข้าสต๊อกแต่ขายไม่ได้");
    return;
  }

  /* คีย์เดิมตลอดจนกว่าจะบันทึกสำเร็จ กดซ้ำหรือเน็ตหลุดแล้วยิงใหม่จึงไม่ได้ของสองก้อน */
  if(!RECV_KEY) RECV_KEY = "rs-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);

  var btn = $("#btn-recv");
  btn.disabled = true; btn.textContent = "กำลังบันทึก…";
  call("receiveStock", [{
    clientKey: RECV_KEY, sku: sku, qty: qty,
    cost: $("#r-cost").value.trim(), date: $("#r-date").value,
    type: $("#r-type").value, doc: $("#r-doc").value.trim(),
    ref: $("#r-ref").value.trim(), note: $("#r-note").value.trim(),
    staff: $("#r-by").value, lotNo: lotNo, exp: $("#r-exp").value
  }], function(res){
    btn.disabled = false; btn.textContent = "บันทึกรับของเข้า";
    if(!res){ showErr("ชีทตอบกลับมาไม่ได้ — ลองกดใหม่อีกครั้ง"); return }
    RECV_KEY = "";
    recvDone(res);
  }, function(m){
    btn.disabled = false; btn.textContent = "บันทึกรับของเข้า";
    showErr(m);
  });
}

function recvDone(res){
  /* ยอดที่โชว์เป็นตัวที่อ่านกลับจากชีทหลังคำนวณเสร็จ ไม่ใช่บวกเอาเองในแอป */
  var lines = [
    "รับ " + esc(res.name || res.sku) + " เข้า " + res.qty + " ชิ้นแล้ว",
    res.lotNo ? "ลงล็อต " + esc(res.lotNo) + " ให้ด้วย" : "สินค้าตัวนี้ไม่ได้คุมล็อต ลงเฉพาะชีทรับเข้า"
  ];
  if(res.remain !== null && res.remain !== undefined) lines.push("สต๊อกคงเหลือตอนนี้ " + res.remain);
  if(res.lotRemain !== null && res.lotRemain !== undefined) lines.push("ในล็อตรวม " + res.lotRemain);
  showOk(lines.join("<br>"));
  toast("บันทึกรับของเข้าแล้ว");

  /* ยอดคงเหลือในหน้าคีย์ออเดอร์ต้องตรงกับของจริงทันที ไม่ใช่รอเปิดแอปใหม่ */
  call("getBootstrap", [], function(b){
    if(!b) return;
    BOOT = b;
    CFG.products = (b.products||[]).map(function(p){
      return { id:p.sku, sku:p.sku, code:"", name:p.name, price:p.price,
               unit:p.unit, perPack:p.perPack, remain:p.remain, group:p.group,
               reorder:p.reorder };
    });
    /* ยอดคงเหลือที่ติดมากับชื่อสินค้าเปลี่ยนไปแล้ว ทุกช่องที่เปิดค้างอยู่ต้องเห็นเลขใหม่ */
    refreshProdOptions();
    recvSkuChanged();
  }, function(){ /* โหลดยอดใหม่ไม่ได้ไม่ใช่เรื่องใหญ่ ของลงชีทไปแล้ว */ });

  ["r-qty","r-cost","r-lot","r-exp","r-doc","r-ref","r-note"].forEach(function(id){
    $("#"+id).value = "";
  });
}

/* --------------------------------------------------------------- ผูกปุ่มทั้งหมด */

var HELP_FROM = "new";

/** หน้าที่กำลังเปิดอยู่ — ใช้ตอนกดกลับจากคู่มือ */
function curPage(){
  var on = $$(".tabs button").filter(function(b){ return b.classList.contains("on") })[0];
  return on ? on.dataset.go : "new";
}

function go(page){
  ["new","list","recv","quote","day","sum","shop","cust","file","help"].forEach(function(p){
    $("#pg-"+p).style.display = (p===page)?"":"none";
  });
  /* หน้านำเข้า Shopee ไม่มีปุ่มของตัวเองบนแถบล่าง เข้ามาจากหน้าออเดอร์
     จึงให้แท็บ "ออเดอร์" ยังติดไฟค้างไว้ ไม่ใช่ดับหมดทั้งแถบจนไม่รู้ว่าอยู่ตรงไหน */
  var tab = (page==="shop" || page==="cust") ? "list"
          : (page==="file" ? "quote" : page);
  $$(".tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.go===tab) });
  if(page==="list") loadOrders();
  if(page==="day")  dayInit();
  if(page==="sum")  loadSummary();
  if(page==="quote") quoteInit();
  if(page==="recv") recvInit();
  if(page==="shop") shopInit();
  if(page==="cust") custPageInit();
  if(page==="file") fileInit();
}

document.addEventListener("DOMContentLoaded", function(){
  /* ตั้งขนาดตัวอักษรก่อนอย่างอื่น จะได้ไม่เห็นหน้าจอกระตุกตอนเปลี่ยนขนาด */
  fsInit();
  $$(".tabs button").forEach(function(b){ b.onclick=function(){ go(b.dataset.go) } });
  bindAddrFind("#f-addr-find", "#f-addr-hit", "#f-addr");
  ordSearchInit();
  bindCustFind("#f-cust", "#f-cust-hit", function(c){
    $("#f-cust").value = c.name;
    custToast(custFill([["#f-tel", c.tel, "เบอร์โทร"], ["#f-addr", c.addr || c.taxAddr, "ที่อยู่"]]));
  });
  $("#btn-add").onclick   = function(){ addItem(); recalc() };
  $("#btn-parse").onclick = doParse;
  $("#btn-save").onclick  = save;
  $("#btn-shop").onclick = function(){ go("shop") };
  $("#btn-cust").onclick = function(){ go("cust") };
  $("#btn-file").onclick = function(){ go("file") };
  /* ไอคอนอยู่ใน Assets ซึ่งเป็นตัวแปรใน JS ไม่ใช่ไฟล์รูป จึงใส่ตอนเปิดแอป
     ไม่ใช่เขียนไว้ใน HTML — และถ้าวันไหนไอคอนหาย ปุ่มก็ยังอ่านออกเหมือนเดิม */
  ["#btn-shop-ic", "#sp-ic"].forEach(function(sel){
    var el = $(sel);
    if (el && typeof SHOPEE_ICON !== "undefined") el.src = SHOPEE_ICON;
    else if (el) el.remove();
  });
  /* ไอคอนแถบล่างก็มาจาก Assets เหมือนกัน ใส่ให้ตอนเปิดแอปทีเดียว
     ไอคอนไหนหาย ปุ่มนั้นเหลือแต่ชื่อ ซึ่งยังกดได้และอ่านออกเหมือนเดิม */
  $$(".tabs button").forEach(function(b){
    var im = b.querySelector("img");
    if (!im) return;
    var ic = (typeof TAB_ICONS !== "undefined") && TAB_ICONS[b.dataset.go];
    if (ic) im.src = ic; else im.remove();
  });
  /* คู่มืออยู่ปุ่ม ? บนหัวจอ เห็นได้จากทุกหน้า — กลับแล้วไปหน้าที่ยืนอยู่ก่อนเปิด */
  $("#fs-help").onclick = function(){ HELP_FROM = curPage(); go("help") };
  $("#hp-back").onclick = function(){ go(HELP_FROM || "new") };
  ["f-disc","f-ship"].forEach(function(id){ $("#"+id).oninput = recalc });
  ["f-vat","f-status"].forEach(function(id){ $("#"+id).onchange = recalc });
  $("#f-disc").addEventListener("change", recalc);

  /* ค่าจัดส่งแนะนำอัตโนมัติ เฉพาะตอนที่ยังไม่ได้พิมพ์เอง */
  $("#f-ship").dataset.touched = "";
  $("#f-ship").addEventListener("input", function(){ this.dataset.touched="1" });

  $("#list").addEventListener("click", function(e){
    var b=e.target.closest("[data-lb],[data-tk],[data-sm],[data-py],[data-dc],[data-ac],[data-ed],[data-rt],[data-cx]");
    if(!b) return;
    if(b.dataset.lb!==undefined) openLabel(ORDERS[+b.dataset.lb]);
    else if(b.dataset.tk!==undefined) openTracking(ORDERS[+b.dataset.tk]);
    else if(b.dataset.sm!==undefined) openMsg(ORDERS[+b.dataset.sm]);
    else if(b.dataset.py!==undefined) openPay(ORDERS[+b.dataset.py]);
    else if(b.dataset.dc!==undefined) openDoc(ORDERS[+b.dataset.dc]);
    else if(b.dataset.ac!==undefined) openAcct(ORDERS[+b.dataset.ac]);
    else if(b.dataset.ed!==undefined) openEditItems(ORDERS[+b.dataset.ed]);
    else if(b.dataset.rt!==undefined) openReturn(ORDERS[+b.dataset.rt]);
    else if(b.dataset.cx!==undefined) openCancel(ORDERS[+b.dataset.cx]);
  });

  boot();
});
</script>
