<script>
/* หน้าจอคีย์ออเดอร์
 *
 * หลักที่ยึดตลอดไฟล์นี้: บันทึกไม่สำเร็จ ต้องบอกให้เห็นชัดและคงข้อมูลในฟอร์มไว้เสมอ
 * ห้ามกลืน error เงียบ ๆ เพราะพนักงานจะคิดว่าบันทึกแล้วทั้งที่ยังไม่ได้บันทึก
 */

var BOOT = null;          /* ข้อมูลจากชีท */
var APP = {};             /* ตั้งค่าแอป (ผู้ส่ง ค่าส่ง ลิงก์ติดตาม) */
var ORDERS = [];          /* ออเดอร์ที่โหลดมาล่าสุด */
var SAVING = false;
var BY_NEW = "✎ พิมพ์ชื่อเอง…";   /* ตัวเลือกสุดท้ายของเมนูผู้คีย์ออเดอร์ */

/* -------------------------------------------------------------- ข้อความแจ้ง */

function showErr(msg){
  var b=$("#err"); b.innerHTML=esc(msg); b.classList.add("on");
  $("#ok").classList.remove("on");
  b.scrollIntoView({behavior:"smooth",block:"center"});
}
function showOk(msg){
  var b=$("#ok"); b.innerHTML=msg; b.classList.add("on");
  $("#err").classList.remove("on");
  b.scrollIntoView({behavior:"smooth",block:"center"});
}
function clearMsg(){ $("#err").classList.remove("on"); $("#ok").classList.remove("on") }

/* เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์ — ทุกจุดที่ล้มต้องมีทางออกที่ผู้ใช้เห็น */
function call(fn, args, done, fail){
  google.script.run
    .withSuccessHandler(function(r){ try{ done(r) }catch(e){ showErr("แสดงผลไม่สำเร็จ: "+e.message) } })
    .withFailureHandler(function(e){
      var m=(e&&e.message)?e.message:String(e);
      if(fail) fail(m); else showErr(m);
    })[fn].apply(null, args||[]);
}

/* แบบ promise สำหรับจุดที่ต้องต่อหลายขั้น (ออกเลขเอกสาร → วาดกระดาษ → แชร์) */
/* ส่งค่าได้หลายตัว ไม่ใช่ตัวเดียว — voidDoc ต้องส่งทั้งเลขใบ เหตุผล และชื่อคนกด
   ที่เรียกด้วยค่าเดียวอยู่เดิมยังทำงานเหมือนเดิมทุกที่ */
function api(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(res, rej){
    call(fn, args, res, function(m){ rej(new Error(m)) });
  });
}

/* ------------------------------------------------------------------ เริ่มระบบ */

function boot(){
  $("#who").textContent = STAFF_EMAIL;
  $("#btn-paste-open").onclick = function(){
    var b = $("#paste-box"), open = b.style.display === "";
    b.style.display = open ? "none" : "";
    this.textContent = open ? "วางที่อยู่จากแชท" : "ซ่อนช่องวางข้อความ";
    if (!open) $("#paste").focus();
  };
  /* โลโก้บนหัวจอ ใส่ก่อนโหลดชีทเลย จะได้ไม่วูบตอนเปิด
     ใช้ตราของระบบตัดสต๊อก ถ้าไม่มีค่อยตกมาใช้โลโก้ร้าน */
  var hdLogo = (typeof APP_LOGO !== "undefined" && APP_LOGO) ? APP_LOGO
             : (typeof SHOP_LOGO !== "undefined" ? SHOP_LOGO : "");
  if (hdLogo) $("#logo").innerHTML = '<img src="' + hdLogo + '" alt="">';
  call("getBootstrap", [], function(b){
    BOOT = b; APP = b.app || {};
    CFG.products = b.products.map(function(p){
      /* รูปทรงเดียวกับสินค้าในแอปเดิม ตัวอ่านข้อความจากไลน์จะได้ใช้ได้โดยไม่ต้องแก้ */
      return { id:p.sku, sku:p.sku, code:"", name:p.name, price:p.price,
               unit:p.unit, perPack:p.perPack, remain:p.remain, group:p.group };
    });
    CFG.sender = APP.sender || CFG.sender;
    CFG.codFee = Number(APP.codFee||0);
    CFG.logo   = (typeof SHOP_LOGO!=="undefined") ? SHOP_LOGO : "";
    CFG.brand  = b.shop || "AST Chem-Tooling";
    CFG.head1  = APP.head1 || "";
    CFG.head2  = APP.head2 || "";
    $("#brand").textContent = CFG.brand;      /* ชื่อร้านเอาจากชีท ตั้งค่าระบบ */
    CFG.carrierLinks = APP.track || {};
    CFG.line   = APP.line || "";

    /* ข้อมูลบนหัวเอกสารขาย — มาจากชีท ตั้งค่าแอป ทั้งหมด ไม่มีอะไรฝังในโค้ด
       โลโก้บนเอกสารใช้ตัวความละเอียดสูงกว่าของใบปะหน้า เพราะพิมพ์ลง A4 */
    CFG.doc = { co: APP.co || {}, bank: APP.bank || "", thanks: APP.thanks || "",
                terms: APP.docTerms || "", website: APP.website || "",
                logo: (typeof DOC_LOGO !== "undefined") ? DOC_LOGO : CFG.logo };
    CFG.docSeller = APP.docSeller || "";
    CFG.docSellerEmail = APP.docSellerEmail || "";

    /* ผู้คีย์ — ทั้งร้านใช้บัญชี Google เดียวกัน ชื่อคนคีย์จึงต้องเลือกเอง
       จำไว้ในเครื่องนี้ ครั้งหน้าเปิดมาก็เป็นชื่อเดิม ไม่ต้องเลือกซ้ำทุกใบ */
    var staffList = (APP.staffList && APP.staffList.length) ? APP.staffList : ["แอดมิน"];
    /* ชื่อที่เคยพิมพ์เองในเครื่องนี้ ขึ้นมาในรายการด้วย จะได้พิมพ์ครั้งเดียวพอ
       (คนคีย์คนใหม่มาช่วยวันเดียว ไม่ต้องรอแก้ชีทก่อนถึงจะคีย์ได้) */
    staffList = staffList.concat(myStaff().filter(function(n){
      return staffList.indexOf(n) < 0;
    }));
    fillSelect("#f-by", staffList.concat([BY_NEW]));
    var remembered = "";
    try { remembered = localStorage.getItem("ast-by") || "" } catch(e){}
    if (remembered && staffList.indexOf(remembered) > -1) $("#f-by").value = remembered;
    $("#f-by").onchange = function(){
      var typing = this.value === BY_NEW;
      $("#f-by-new").style.display = typing ? "" : "none";
      if (typing) { $("#f-by-new").value = ""; $("#f-by-new").focus(); return }
      try { localStorage.setItem("ast-by", this.value) } catch(e){}
    };
    /* พอพิมพ์ชื่อเสร็จแล้วละมือ เก็บชื่อลงเครื่องและใส่กลับเข้ารายการทันที
       ไม่ต้องกดปุ่มเพิ่ม ไม่ต้องรีเฟรช */
    $("#f-by-new").onblur = function(){
      var v = this.value.trim();
      if (!v) return;
      var mine = myStaff();
      if (mine.indexOf(v) < 0) {
        mine.push(v);
        try { localStorage.setItem("ast-by-list", JSON.stringify(mine)) } catch(e){}
      }
      var sel = $("#f-by");
      var has = false;
      for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === v) has = true;
      if (!has) {
        var op = document.createElement("option");
        op.value = v; op.textContent = v;
        sel.insertBefore(op, sel.options[sel.options.length - 1]);
      }
      sel.value = v;
      this.style.display = "none";
      try { localStorage.setItem("ast-by", v) } catch(e){}
    };

    fillSelect("#f-channel", b.lists.channel);
    fillSelect("#f-carrier", b.lists.carrier);
    fillSelect("#f-vat",     b.lists.vat);
    fillSelect("#f-status",  b.lists.status);
    $("#f-date").value = todayISO();
    $("#next-no").textContent = b.nextNo;

    $("#booting").style.display="none";
    $("#form").style.display="";
    if(!itemRows().length) addItem();
    recalc();
  }, function(m){
    $("#booting").innerHTML='<div style="color:var(--red);line-height:1.7">โหลดข้อมูลจากชีทไม่สำเร็จ<br>'
      +esc(m)+'<br><br><button class="mini" onclick="location.reload()">ลองใหม่</button></div>';
  });
}

function fillSelect(sel, list){
  $(sel).innerHTML = (list||[]).map(function(x){
    return '<option value="'+esc(x)+'">'+esc(x)+'</option>';
  }).join("");
}
function todayISO(){
  var d=new Date(), p=function(n){return n<10?"0"+n:""+n};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

/* --------------------------------------------------------- รายการสินค้าหลายแถว */

function prodOptions(sel){
  return '<option value="">— เลือกสินค้า —</option>' + CFG.products.map(function(p){
    var left = (p.remain===null||p.remain===undefined) ? "" : "  (เหลือ "+p.remain+")";
    return '<option value="'+esc(p.sku)+'"'+(sel===p.sku?" selected":"")+'>'
         + esc(p.sku+" · "+p.name+left)+'</option>';
  }).join("");
}
function itemRows(){ return $$("#items .it") }

function addItem(v){
  v = v || {};
  var d = document.createElement("div");
  d.className = "it";
  d.innerHTML =
    '<div class="hd"><b>รายการที่ <span class="n"></span></b>'
   +'<button class="mini red rm" type="button">ลบ</button></div>'
   +'<div class="fld sku-wrap" style="margin-bottom:8px"><select class="i-sku">'+prodOptions(v.sku)+'</select></div>'
   /* ของซื้อมาขายไปไม่มีในฐานสินค้า และมักไม่ได้ขายซ้ำ — พิมพ์ชื่อลงไปตรง ๆ ได้เลย */
   +'<div class="fld free-wrap" style="margin-bottom:8px;display:none">'
   +'<input class="i-name" type="text" placeholder="พิมพ์ชื่อสินค้า" value="'+esc(v.name||"")+'"></div>'
   +'<div class="three">'
   +'<div><label style="font-size:13px;color:var(--gray)">จำนวน</label>'
   +'<input class="i-qty" type="number" inputmode="numeric" min="1" step="1" value="'+(v.qty||"")+'"></div>'
   +'<div class="std-cell"><label style="font-size:13px;color:var(--gray)">ราคามาตรฐาน</label>'
   +'<input class="i-std" readonly tabindex="-1" style="background:#f2f4f7;color:var(--gray)"></div>'
   +'<div class="cost-cell" style="display:none"><label style="font-size:13px;color:var(--gray)">ต้นทุน/หน่วย</label>'
   +'<input class="i-cost" type="number" inputmode="decimal" min="0" placeholder="ไม่ใส่ก็ได้" value="'+(v.cost||"")+'"></div>'
   +'<div><label style="font-size:13px;color:var(--gray)">ราคาขายจริง</label>'
   +'<input class="i-price" type="number" inputmode="decimal" min="0" placeholder="ปล่อยว่าง" value="'+(v.price||"")+'"></div>'
   +'</div>'
   +'<label class="giftck"><input type="checkbox" class="i-free"'+(v.free?" checked":"")+'> ซื้อมาขายไป — พิมพ์ชื่อและราคาเอง ไม่ต้องมีรหัสสินค้า</label>'
   /* ของแถมต้องเป็นรายการสินค้าจริง ไม่ใช่ข้อความลอย ๆ สต๊อกจะได้ถูกตัดตามไปด้วย
      ว่าแถมอะไรไปกี่ชิ้น — ติ๊กช่องนี้แล้วราคาขายจริงกลายเป็น 0 */
   +'<label class="giftck"><input type="checkbox" class="i-gift"'+(v.gift?" checked":"")+'> แถมฟรี (ราคา 0 แต่ยังตัดสต๊อก)</label>'
   +'<div class="lotline"></div>';
  $("#items").appendChild(d);

  d.querySelector(".rm").onclick = function(){
    if(itemRows().length<=1){ toast("ต้องมีสินค้าอย่างน้อย 1 รายการ"); return }
    d.remove(); renumber(); recalc();
  };
  d.querySelector(".i-sku").onchange = function(){ recalc() };
  d.querySelector(".i-qty").oninput  = function(){ recalc() };
  d.querySelector(".i-price").oninput= function(){ recalc() };
  d.querySelector(".i-name").oninput = function(){ recalc() };
  d.querySelector(".i-cost").oninput = function(){ recalc() };
  d.querySelector(".i-free").onchange = function(){ freeToggle(d) };
  if(v.free) freeToggle(d);
  d.querySelector(".i-gift").onchange = function(){
    var pr = d.querySelector(".i-price");
    if (this.checked) { pr.value = "0"; pr.readOnly = true; pr.style.background = "#f2f4f7"; }
    else { pr.value = ""; pr.readOnly = false; pr.style.background = ""; }
    recalc();
  };
  renumber();
  return d;
}
function renumber(){
  itemRows().forEach(function(r,i){ r.querySelector(".n").textContent = i+1 });
}

/* สลับแถวระหว่าง "เลือกจากฐานสินค้า" กับ "พิมพ์ชื่อเอง"
   ซ่อนช่องที่ไม่ใช้แทนที่จะเพิ่มช่องใหม่ แถวจึงสูงเท่าเดิม อ่านบนมือถือได้เหมือนกัน */
function freeToggle(d){
  var on = d.querySelector(".i-free").checked;
  d.querySelector(".sku-wrap").style.display  = on ? "none" : "";
  d.querySelector(".free-wrap").style.display = on ? "" : "none";
  d.querySelector(".std-cell").style.display  = on ? "none" : "";
  d.querySelector(".cost-cell").style.display = on ? "" : "none";
  recalc();
}
function isFree(r){ return r.querySelector(".i-free").checked }
function readItems(){
  return itemRows().map(function(r){
    var free = isFree(r);
    return {
      free:  free,
      sku:   free ? "" : r.querySelector(".i-sku").value,
      name:  free ? r.querySelector(".i-name").value.trim() : "",
      cost:  free ? r.querySelector(".i-cost").value : "",
      qty:   r.querySelector(".i-qty").value,
      price: r.querySelector(".i-gift").checked ? "0" : r.querySelector(".i-price").value
    };
  });
}
function prodBySku(sku){
  for(var i=0;i<CFG.products.length;i++) if(CFG.products[i].sku===sku) return CFG.products[i];
  return null;
}

/* ---------------------------------------------------------------- คิดยอดรวม */

/* ค่าจัดส่งที่แนะนำ — สูตรเดียวกับแอปเดิม (โอน >= ยอดส่งฟรี = ฟรี) */
function suggestShip(sub){
  var base = Number(APP.shipFee||0);
  return (APP.freeOver && sub >= Number(APP.freeOver)) ? 0 : base;
}

function recalc(){
  var sub = 0, need = {};
  itemRows().forEach(function(r){
    var qty = Number(r.querySelector(".i-qty").value)||0;
    var ov  = r.querySelector(".i-price").value;

    /* แถวพิมพ์ชื่อเองไม่มีราคามาตรฐานให้ดึง ยอดจึงมาจากราคาที่กรอกล้วน ๆ
       และไม่มีล็อตให้ตัด เพราะของยังไม่เคยเข้าสต๊อก */
    if(isFree(r)){
      if(qty>0) sub += Math.round(qty*(Number(ov)||0)*100)/100;
      freeLine(r);
      return;
    }

    var sku = r.querySelector(".i-sku").value;
    var p   = prodBySku(sku);
    r.querySelector(".i-std").value = p ? Number(p.price).toFixed(2) : "";
    var unit = (ov==="" ? (p?Number(p.price):0) : Number(ov))||0;
    if(p && qty>0) sub += Math.round(qty*unit*100)/100;
    if(sku) need[sku] = (need[sku]||0) + qty;
    lotLine(r, p, sku);
  });
  /* สินค้าตัวเดียวกันถูกสั่งหลายแถว ต้องดูยอดรวมทั้งใบด้วย
     แถวเดียวไม่ต้องเขียนทับ เพราะข้อความรายแถวบอกละเอียดกว่าอยู่แล้ว */
  var rowsPerSku = {};
  itemRows().forEach(function(r){
    if(isFree(r)) return;
    var sku = r.querySelector(".i-sku").value;
    if(sku) rowsPerSku[sku] = (rowsPerSku[sku]||0) + 1;
  });
  itemRows().forEach(function(r){
    if(isFree(r)) return;
    var sku = r.querySelector(".i-sku").value;
    if(!sku || rowsPerSku[sku] < 2) return;
    var lot = (BOOT&&BOOT.lots)?BOOT.lots[sku]:null;
    if(lot && need[sku] > lot.total){
      var el = r.querySelector(".lotline");
      el.className = "lotline bad";
      el.textContent = "สินค้าตัวนี้ถูกสั่งหลายแถว รวม "+need[sku]
        +" ชิ้น แต่ในล็อตเหลือ "+lot.total+" ชิ้น ไม่พอ";
    }
  });

  /* เติมค่าจัดส่งที่แนะนำให้ตราบใดที่พนักงานยังไม่ได้พิมพ์เอง
     พอพิมพ์เองแล้วจะไม่ไปทับ ไม่งั้นค่าที่ตั้งใจกรอกจะหายตอนแก้รายการสินค้า */
  var shipBox = $("#f-ship");
  if(!shipBox.dataset.touched) shipBox.value = suggestShip(sub);

  var disc = Number($("#f-disc").value)||0;
  var ship = Number(shipBox.value)||0;
  var isVat = /^รับ/.test($("#f-vat").value||"");
  var vat = isVat ? Math.round((sub-disc)*Number(BOOT?BOOT.vatRate:0)*100)/100 : 0;

  $("#s-sub").textContent  = baht(sub);
  $("#s-disc").textContent = baht(disc);
  $("#s-ship").textContent = baht(ship);
  $("#s-vat").textContent  = baht(vat);
  $("#s-vat-row").style.display = isVat ? "" : "none";
  $("#s-net").textContent  = baht(sub-disc+ship+vat);
}

/* บอกตรงนั้นเลยว่าติ๊กหรือไม่ติ๊กต้นทุนแล้วผลต่างกันยังไง
   เพราะเป็นจุดเดียวที่ตัวเลขกำไรในชีทจะเพี้ยนได้โดยไม่มีอะไรฟ้อง */
function freeLine(r){
  var el = r.querySelector(".lotline");
  el.className = "lotline"; el.textContent = "";
  var nm = r.querySelector(".i-name").value.trim();
  if(!nm) return;
  var qty = Number(r.querySelector(".i-qty").value)||0;
  if(r.querySelector(".i-cost").value === ""){
    el.className = "lotline warn";
    el.textContent = "ไม่ได้ใส่ต้นทุน — ยอดขายถูก แต่ชีทจะคิดต้นทุนเป็น 0 กำไรใบนี้จะสูงเกินจริง "
      + "และของตัวนี้จะไม่เข้าฐานสินค้า";
    return;
  }
  el.className = "lotline ok";
  el.textContent = "จะเพิ่ม \u201C"+nm+"\u201D เข้าฐานสินค้าให้ พร้อมลงรับเข้า "+qty
    + " ชิ้นเท่าที่ขาย สต๊อกจึงเป็นศูนย์ ไม่ติดลบ และกำไรคิดจากต้นทุนจริง";
}

function lotLine(r, p, sku){
  var el = r.querySelector(".lotline");
  el.className = "lotline"; el.textContent = "";
  if(!p || !sku) return;
  var lot = (BOOT&&BOOT.lots)?BOOT.lots[sku]:null;
  var qty = Number(r.querySelector(".i-qty").value)||0;
  if(!lot){
    if(p.remain!==null && p.remain!==undefined && qty>p.remain){
      el.className="lotline warn";
      el.textContent="สต๊อกในชีทเหลือ "+p.remain+" ชิ้น น้อยกว่าที่สั่ง";
    }
    return;
  }
  if(qty>lot.total){
    el.className="lotline bad";
    el.textContent="ล็อตเหลือรวม "+lot.total+" ชิ้น ไม่พอกับที่สั่ง";
    return;
  }
  el.className="lotline ok";
  el.textContent = "จะตัดล็อต "+lot.next.lotNo
    + (lot.next.exp ? " (หมดอายุ "+thaiDate(isoOf(lot.next.exp))+")" : " (ไม่ระบุวันหมดอายุ)")
    + " ก่อน · ล็อตทั้งหมดเหลือ "+lot.total+" ชิ้น";
}
function isoOf(ms){
  var d=new Date(ms), p=function(n){return n<10?"0"+n:""+n};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function thaiDate(iso){
  if(!iso) return "";
  var d=new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return String(iso);
  var m=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return d.getDate()+" "+m[d.getMonth()]+" "+(d.getFullYear()+543);
}

/* -------------------------------------------------------------- บันทึกออเดอร์ */

/* clientKey ต่อ 1 ใบ — กดซ้ำหรือยิงใหม่หลังเน็ตหลุด จะได้ออเดอร์ใบเดิม ไม่ใช่ใบใหม่
   ต้องคงตัวเดิมไว้จนกว่าจะบันทึกสำเร็จ ถึงค่อยเปลี่ยนเป็นใบถัดไป */
var LAST_SAVED = null;   /* ใบที่เพิ่งบันทึก ไว้กดพิมพ์ใบปะหน้า/ส่งข้อความต่อทันที */
var CLIENT_KEY = newKey();
function newKey(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "k"+Date.now()+"-"+Math.random().toString(36).slice(2);
}

function save(){
  if(SAVING) return;
  clearMsg();

  var items = readItems().filter(function(it){ return it.free ? it.name : it.sku });
  if(!items.length){ showErr("ยังไม่ได้เลือกสินค้า"); return }
  for(var i=0;i<items.length;i++){
    var q=Number(items[i].qty);
    if(!(q>0)){ showErr("รายการที่ "+(i+1)+": ยังไม่ได้ใส่จำนวน"); return }
    if(items[i].free && items[i].price===""){
      showErr("รายการที่ "+(i+1)+" ("+esc(items[i].name)+"): สินค้าที่พิมพ์ชื่อเอง"
        +" ต้องใส่ราคาขายจริงด้วย เพราะไม่มีราคามาตรฐานในฐานสินค้าให้ดึง");
      return;
    }
  }
  if(!$("#f-cust").value.trim()){ showErr("ยังไม่ได้ใส่ชื่อลูกค้า"); return }

  var payload = {
    clientKey: CLIENT_KEY,
    date: $("#f-date").value, channel: $("#f-channel").value,
    cust: $("#f-cust").value.trim(), tel: $("#f-tel").value.trim(),
    addr: $("#f-addr").value.trim(),
    carrier: $("#f-carrier").value, track: $("#f-track").value.trim(),
    vat: /^รับ/.test($("#f-vat").value||""),
    discount: Number($("#f-disc").value)||0,
    ship: Number($("#f-ship").value)||0,
    status: $("#f-status").value, by: byName(),
    note: $("#f-note").value.trim(),
    items: items
  };

  SAVING = true;
  var btn=$("#btn-save");
  btn.disabled = true; btn.textContent = "กำลังบันทึกลงชีท…";

  call("createOrder", [payload], function(r){
    SAVING=false; btn.disabled=false; btn.textContent="บันทึกออเดอร์ลงชีท";
    if(r.duplicate){
      showOk("ใบนี้บันทึกไปแล้ว เลขที่ <b>"+esc(r.no)+"</b> ระบบไม่บันทึกซ้ำให้");
      return;
    }
    var lots = (r.lots&&r.lots.length) ? "<br>ตัดล็อต: "+esc(r.lots.join(" · ")) : "";
    /* งานยังไม่จบตรงที่บันทึก — ต้องพิมพ์ใบปะหน้าและส่งข้อความให้ลูกค้าต่อ
       ฟอร์มถูกล้างไปแล้ว ถ้าไม่เก็บใบที่เพิ่งบันทึกไว้ตรงนี้ ต้องไปตามหาในแท็บออเดอร์
       จึงจับใบนี้ไว้แล้ววางปุ่มไว้ให้ทำต่อได้เลย */
    LAST_SAVED = orderFromForm_(payload, r);
    showOk("บันทึกแล้ว เลขที่ <b>"+esc(r.no)+"</b> · ยอดสุทธิ "+baht(r.net)+lots
      +"<br>สต๊อกและกำไรในชีทอัปเดตให้เองแล้ว"
      +'<div class="okact">'
      +'<button id="ok-lb">🖨 พิมพ์ใบปะหน้า</button>'
      +'<button id="ok-mg">💬 ข้อความส่งลูกค้า</button>'
      +'<button id="ok-dc">📄 ออกเอกสาร</button></div>');
    $("#ok-lb").onclick = function(){ openLabel(LAST_SAVED) };
    $("#ok-mg").onclick = function(){ openMsg(LAST_SAVED) };
    $("#ok-dc").onclick = function(){ openDoc(LAST_SAVED) };
    /* กดปุ่มขอเอกสารไว้ตั้งแต่ยังไม่บันทึก — บันทึกเสร็จแล้วต่อให้เลย ไม่ต้องกดซ้ำ */
    if(PENDING_DOC){ var ty=PENDING_DOC; PENDING_DOC=null; openDoc(LAST_SAVED, ty); }
    CLIENT_KEY = newKey();
    resetForm();
    ORDERS = []; SUM_CACHE = null;
    call("getBootstrap", [], function(b){
      BOOT=b; $("#next-no").textContent=b.nextNo;
      CFG.products = b.products.map(function(p){
        return { id:p.sku, sku:p.sku, code:"", name:p.name, price:p.price,
                 unit:p.unit, perPack:p.perPack, remain:p.remain, group:p.group };
      });
    }, function(){ /* ตัวเลขคงเหลือไม่สดก็ไม่เป็นไร ออเดอร์บันทึกไปแล้ว */ });
  }, function(m){
    SAVING=false; btn.disabled=false; btn.textContent="บันทึกออเดอร์ลงชีท";
    showErr("บันทึกไม่สำเร็จ — ข้อมูลในฟอร์มยังอยู่ครบ กดบันทึกใหม่ได้เลย\n\n" + m);
  });
}

/**
 * ประกอบใบที่เพิ่งบันทึกจากฟอร์ม ให้หน้าตาเหมือนใบที่อ่านมาจากชีท
 * ใบปะหน้ากับข้อความส่งลูกค้าจะได้ใช้ตัวเดียวกันได้ ไม่ต้องเขียนสองทาง
 * ยอดเงินใช้ตัวที่ชีทคำนวณกลับมา ไม่คิดเองซ้ำ จะได้ไม่มีทางเพี้ยนจากชีท
 */
function orderFromForm_(payload, r){
  var by = {};
  CFG.products.forEach(function(p){ by[p.sku] = p });
  var items = payload.items.map(function(it){
    var p = by[it.sku] || {};
    var unit = (it.price===""||it.price==null) ? Number(p.price||0) : Number(it.price);
    var qty  = Number(it.qty)||0;
    return { sku:it.sku, name:p.name||it.sku, unit:p.unit||"ชิ้น", qty:qty,
             price:unit, total:Math.round(qty*unit*100)/100, lot:"" };
  });
  return { no:r.no, date:payload.date, channel:payload.channel,
           cust:payload.cust, tel:payload.tel, addr:payload.addr,
           carrier:payload.carrier, track:payload.track,
           vat: payload.vat ? "รับ VAT" : "ไม่รับ VAT",
           discount:payload.discount, ship:payload.ship,
           status:payload.status, note:payload.note, staff:payload.by,
           subtotal:r.subtotal, net:r.net, items:items };
}

function resetForm(){
  ["f-cust","f-tel","f-addr","f-track","f-note"].forEach(function(id){ $("#"+id).value="" });
  $("#f-disc").value=0;
  $("#f-ship").value=0; $("#f-ship").dataset.touched="";
  $("#paste").value=""; $("#pv-slot").innerHTML="";
  $("#items").innerHTML=""; addItem();

  recalc();
}

function doParse(){
  var txt = $("#paste").value;
  if(!txt.trim()){ toast("วางข้อความก่อน"); return }
  var d = parseOrderText(txt);
  if(!d.cust && !d.tel && !d.addr && !(d.items||[]).length){
    toast("อ่านข้อความไม่ออก ลองคัดลอกมาใหม่ทั้งก้อน"); return;

/* แสดงให้ตรวจก่อน ยังไม่แตะฟอร์มจนกว่าจะกด "ใช้ข้อมูลนี้" */
function showPreview(d){
  var n=0, got=0;
  var row=function(label,val,opt){
    var ok=!(val===null||val===undefined||val==="");
    if(!opt){ n++; if(ok) got++ }
    return '<div class="r'+(ok?"":" miss")+(opt?" opt":"")+'"><i>'+esc(label)+'</i><b>'
      +(ok?esc(String(val)):"อ่านไม่ได้ — กรอกเอง")+'</b></div>';
  };
  var addr=[d.addr,
    [d.tambon?"ต."+d.tambon:"",d.amphoe?"อ."+d.amphoe:""].filter(Boolean).join(" "),
    [d.province?"จ."+d.province:"",d.zip||""].filter(Boolean).join(" ")
  ].filter(function(x){return x&&x.trim()}).join("\n");

  var h = row("วันที่",d.date,true)
        + row("ชื่อลูกค้า",d.cust)
        + row("เบอร์โทร",d.tel)
        + row("ที่อยู่",addr)
        + row("ค่าจัดส่ง",d.ship===undefined?"":d.ship,true)
        + row("ยอดสินค้า",d.amt===undefined?"":d.amt,true);

  var its=d.items||[];
  h += '<div style="font-size:14px;color:var(--gray);margin:8px 0 4px;font-weight:600">รายการสินค้า '+its.length+' รายการ</div>';
  its.forEach(function(it,i){
    var p = it.sku ? prodBySku(it.sku) : null;
    n++; if(p) got++;
    h += '<div class="r'+(p?"":" miss")+'"><i>'+(i+1)+'. '+esc(it.name||"-")+'</i><b>'
       + (p ? esc(p.sku+" · จำนวน "+it.qty) : "จับคู่สินค้าในชีทไม่ได้ — เลือกเอง")
       + '</b></div>';
  });

  $("#pv-slot").innerHTML =
    '<div class="pv"><div style="font-weight:700;margin-bottom:8px">ตรวจก่อนใช้ — อ่านได้ '+got+' จาก '+n+' ช่อง</div>'
    + h
    + '<div class="hint" style="margin:10px 0 8px">ช่องที่อ่านไม่ได้จะไม่ถูกเขียนลงฟอร์ม ค่าที่กรอกไว้แล้วไม่หาย</div>'
    + '<button class="btn" id="pv-use">ใช้ข้อมูลนี้</button>'
    + '<button class="btn ghost" id="pv-no" style="margin-top:8px">ไม่ใช้</button></div>';

  $("#pv-use").onclick = function(){ applyParsed(d, addr) };
  $("#pv-no").onclick  = function(){ $("#pv-slot").innerHTML="" };
}

/* เขียนเฉพาะค่าที่อ่านได้จริง ค่าว่างไม่ไปล้างของที่กรอกไว้แล้ว */
function applyParsed(d, addr){
  var set=function(id,v){ if(v!==undefined && v!==null && v!=="") $("#"+id).value=v };
  set("f-date", d.date);
  set("f-cust", d.cust);
  set("f-tel",  d.tel);
  set("f-addr", addr);
  /* ค่าส่งที่ลูกค้าตกลงไว้ในแชท ชนะค่าที่ระบบแนะนำเสมอ */
  if(d.ship!==undefined && d.ship!==""){ $("#f-ship").value=d.ship; $("#f-ship").dataset.touched="1" }
  if(d.carrier) pickOption("#f-carrier", d.carrier);

  var its=(d.items||[]).filter(function(it){ return it.sku && prodBySku(it.sku) });
  if(its.length){
    $("#items").innerHTML="";
    its.forEach(function(it){ addItem({sku:it.sku, qty:it.qty, price:it.price}) });
  }
  $("#pv-slot").innerHTML="";
  recalc();
  var miss=(d.items||[]).length - its.length;
  toast(miss ? ("ใส่ให้แล้ว · ยังจับคู่สินค้าไม่ได้ "+miss+" รายการ ต้องเลือกเอง") : "ใส่ข้อมูลให้แล้ว ตรวจอีกครั้งก่อนบันทึก");
}
function pickOption(sel, want){
  var s=$(sel), w=String(want||"").toLowerCase();
  for(var i=0;i<s.options.length;i++){
    var o=s.options[i].value.toLowerCase();
    if(o===w || o.indexOf(w.split(" ")[0])>-1 || w.indexOf(o.split(" ")[0])>-1){ s.selectedIndex=i; return true }
  }
  return false;
}

  $("#list").innerHTML='<div class="load">กำลังโหลดออเดอร์จากชีท…</div>';
  call("getOrders",[40],function(list){ ORDERS=list; renderOrders() },
    function(m){ $("#list").innerHTML='<div class="empty" style="color:var(--red)">โหลดไม่สำเร็จ<br>'+esc(m)+'</div>' });
}

function statusTag(s){
  if(s==="ส่งแล้ว") return "ok";
  if(s==="ยกเลิก") return "bad";
  if(s==="ชำระแล้ว"||s==="จัดของแล้ว") return "ok";
  return "wait";
}

function renderOrders(){
  if(!ORDERS.length){ $("#list").innerHTML='<div class="empty"><b>ยังไม่มีออเดอร์</b>กดแท็บ “คีย์ออเดอร์” เพื่อบันทึกใบแรก</div>'; return }

    return '<div class="row"><div class="i">'

      +'<span style="color:var(--ink);font-weight:700">'+baht(o.net)+'</span> '
      +'<span class="tag '+statusTag(o.status)+'">'+esc(o.status||"-")+'</span>'
      + (o.check && o.check!=="OK" ? ' <span class="tag bad">'+esc(o.check)+'</span>' : '')
      +'</div><div class="acts">'
      +'<button class="sq" data-lb="'+i+'" title="ใบปะหน้า">🖨</button>'
      +'<button class="sq" data-tk="'+i+'" title="เลขพัสดุ">📦</button>'
      +'<button class="sq" data-sm="'+i+'" title="ข้อความแจ้งลูกค้า">💬</button>'
      +'<button class="sq" data-dc="'+i+'" title="ออกเอกสาร / ใบกำกับภาษี">📄</button>'

/* ------------------------------------------------- ปุ่มขอเอกสารบนหัวฟอร์ม

   เจ้าของร้านอยากได้ กรอก → ส่ง → ปริ้น จบในหน้าเดียว จึงวางปุ่มไว้บนหัวฟอร์ม
   แต่ใบกำกับภาษีอ้างเลขออเดอร์และยอดที่ชีทคำนวณจริง จะออกก่อนบันทึกไม่ได้
   ปุ่มจึงบันทึกออเดอร์ให้ก่อน แล้วเปิดหน้าออกเอกสารต่อทันที โดยถามก่อนหนึ่งครั้ง
   ไม่บันทึกเงียบ ๆ เพราะบันทึกแล้วสต๊อกถูกตัดจริง ถอยกลับไม่ได้ง่าย ๆ            */

function docBarInit(){
  $("#docbar").addEventListener("click", function(e){
    var b = e.target.closest("button[data-doc]");
    if(!b) return;
    var type = b.dataset.doc;

    /* ใบเสนอราคาไม่ผูกออเดอร์เลย ข้ามไปหน้าของมันได้ทันที ไม่ต้องบันทึกอะไร */
    if(type === "quote"){ go("quote"); return; }

    if(LAST_SAVED){ openDoc(LAST_SAVED, type); return; }
    if(SAVING){ toast("กำลังบันทึกอยู่ รอสักครู่"); return; }

    if(!confirm("ต้องบันทึกออเดอร์ลงชีทก่อนจึงออกเอกสารได้\n"
              + "(บันทึกแล้วสต๊อกจะถูกตัดตามจริง)\n\nบันทึกแล้วออกเอกสารเลยไหม")) return;
    PENDING_DOC = type;
    save();
  });
}

/* ชนิดเอกสารที่กดค้างไว้ก่อนบันทึก — พอบันทึกเสร็จให้เปิดหน้าออกเอกสารต่อเอง */
var PENDING_DOC = null;

/* ---------------------------------------------------------------- ใบเสนอราคา

   ออกก่อนมีออเดอร์ จึงไม่แตะสต๊อกและไม่กินเลขออเดอร์เลย
   รายการเลือกจากฐานสินค้าได้ และพิมพ์เองก็ได้ เพราะใบเสนอราคาบ่อยครั้ง
   มีของที่ยังไม่มีในสต๊อก หรือบรรทัดอย่าง "ค่าส่ง" ที่ไม่ใช่สินค้า           */

var Q_READY = false;

function quoteInit(){
  if(Q_READY) return;
  Q_READY = true;
  $("#q-date").value  = todayISO();
  var days = Number((APP && APP.quoteDays) || 7) || 7;
  var d = new Date(); d.setDate(d.getDate() + days);
  var pz = function(n){ return n<10?"0"+n:""+n };
  $("#q-valid").value = d.getFullYear()+"-"+pz(d.getMonth()+1)+"-"+pz(d.getDate());
  qAdd();
  /* ใบเสนอราคาที่เคยออก — พิมพ์ซ้ำหรือส่งซ้ำให้ลูกค้าได้ ไม่ต้องคีย์ใหม่
     ใบพวกนี้ไม่ผูกกับออเดอร์ ถ้าไม่มีรายการนี้ก็ตามหากลับไม่ได้เลย */
  drawOldDocs("", "#q-old");
  $("#q-add").onclick  = function(){ qAdd(); qCalc() };
  $("#q-make").onclick = qMake;
  ["#q-disc","#q-ship","#q-vat"].forEach(function(sel){
    $(sel).addEventListener("input", qCalc);
    $(sel).addEventListener("change", qCalc);

function qRows(){ return $$("#q-items .it") }

function qAdd(v){
  v = v || {};
  var d = document.createElement("div");
  d.className = "it";
  d.innerHTML =
    '<div class="hd"><b>รายการที่ <span class="n"></span></b>'
   +'<button class="mini red rm" type="button">ลบ</button></div>'
   +'<div class="fld" style="margin-bottom:8px"><select class="q-sku">'+prodOptions(v.sku)+'</select></div>'
   +'<div class="fld" style="margin-bottom:8px">'
   +'<label style="font-size:13px;color:var(--gray)">ข้อความที่จะพิมพ์บนใบ</label>'
   +'<input class="q-desc" value="'+esc(v.name||"")+'" placeholder="เลือกสินค้าข้างบน หรือพิมพ์เอง"></div>'
   +'<div class="three">'
   +'<div><label style="font-size:13px;color:var(--gray)">จำนวน</label>'
   +'<input class="q-qty" type="number" inputmode="decimal" min="0" step="any" value="'+(v.qty||"")+'"></div>'
   +'<div><label style="font-size:13px;color:var(--gray)">หน่วย</label>'
   +'<input class="q-unit" value="'+esc(v.unit||"")+'" placeholder="ชิ้น"></div>'
   +'<div><label style="font-size:13px;color:var(--gray)">ราคา/หน่วย</label>'
   +'<input class="q-price" type="number" inputmode="decimal" min="0" step="0.01" value="'+(v.price||"")+'"></div>'
   +'</div>';
  $("#q-items").appendChild(d);

  d.querySelector(".rm").onclick = function(){
    if(qRows().length<=1){ toast("ต้องมีอย่างน้อยหนึ่งรายการ"); return }
    d.remove(); qCalc();
  };
  /* เลือกสินค้าแล้วเติมชื่อ หน่วย ราคาให้ แต่แก้ทับได้ทุกช่อง
     เพราะราคาที่เสนอมักไม่เท่าราคาป้าย (ซื้อเยอะลดให้) */
  d.querySelector(".q-sku").onchange = function(){
    var sku = d.querySelector(".q-sku").value;
    var p = CFG.products.filter(function(x){ return x.sku===sku })[0];
    if(!p) return;
    d.querySelector(".q-desc").value  = p.name;
    if(!d.querySelector(".q-unit").value)  d.querySelector(".q-unit").value  = p.unit||"";
    if(!d.querySelector(".q-price").value) d.querySelector(".q-price").value = p.price||"";
    qCalc();
  };
  [".q-qty",".q-price",".q-desc"].forEach(function(c){
    d.querySelector(c).addEventListener("input", qCalc);
  });
  qNumber();
}

function qNumber(){
  qRows().forEach(function(r,i){ r.querySelector(".n").textContent = i+1 });
}

function qRead(){
  return qRows().map(function(r){
    return { name: r.querySelector(".q-desc").value.trim(),
             qty:  Number(r.querySelector(".q-qty").value)||0,
             unit: r.querySelector(".q-unit").value.trim(),
             price:Number(r.querySelector(".q-price").value)||0 };
  }).filter(function(it){ return it.name && it.qty>0 });
}

function qCalc(){
  qNumber();
  var items = qRead();
  var sub = items.reduce(function(a,it){ return a + Math.round(it.qty*it.price*100)/100 }, 0);
  var ship = Number($("#q-ship").value)||0, disc = Number($("#q-disc").value)||0;
  var goods = Math.round((sub + ship - disc)*100)/100;
  var mode = $("#q-vat").value;
  var rate = (mode==="none") ? 0 : 0.07;
  var base, vat, total;
  if(!rate){ base=goods; vat=0; total=goods }
  else if(mode==="incl"){ total=goods; base=Math.round(goods/1.07*100)/100; vat=Math.round((total-base)*100)/100 }
  else { base=goods; vat=Math.round(goods*0.07*100)/100; total=Math.round((base+vat)*100)/100 }
  $("#q-sum").innerHTML =
     '<div class="sum"><span>มูลค่าสินค้า</span><b>'+baht(base)+'</b></div>'
    +'<div class="sum"><span>ภาษีมูลค่าเพิ่ม '+(rate?"7%":"— ไม่คิด")+'</span><b>'+baht(vat)+'</b></div>'
    +'<div class="sum big"><span>รวมทั้งสิ้น</span><b>'+baht(total)+'</b></div>';
}

function qMake(){
  var items = qRead();
  if(!items.length){ toast("ยังไม่มีรายการที่กรอกครบ"); return }
  var name = $("#q-name").value.trim();

               addr:$("#q-addr").value.trim(), tel:$("#q-tel").value.trim(),

        +'ลงทะเบียนในชีท เอกสาร เรียบร้อย · <b>สต๊อกไม่ถูกตัด</b></div>'
        +'<img class="docimg" src="'+url+'" style="width:100%;border:1px solid var(--line);border-radius:10px">'
        +'<button class="btn" id="lb-share" style="margin-top:12px">แชร์ / สั่งพิมพ์</button>'
        +'<button class="btn dark" id="lb-save" style="margin-top:9px">บันทึกลงเครื่อง</button>'
        +'<button class="btn ghost" id="dc-copy" style="margin-top:9px">ดูสำเนา (เก็บส่งบัญชี)</button>'
        +'<button class="btn ghost" id="lb-open" style="margin-top:9px">เปิดในแท็บใหม่</button>';

      +esc(e&&e.message?e.message:e)+'</div>';

/* พิมพ์ซ้ำไม่ออกเลขใหม่ ไม่แตะสต๊อก ไม่เขียนอะไรลงชีท — แค่วาดใบเดิมออกมาอีกครั้ง */
function drawOldDocs(orderNo, boxSel){

            +'<button class="mini" data-rp="'+esc(d.no)+'">พิมพ์ซ้ำ</button>'

/* ยกเลิกเอกสารที่ออกผิด
   ไม่ทำเป็น "แก้ไข" ที่เขียนทับใบเดิม เพราะใบที่ออกไปแล้วลูกค้าถืออยู่ในมือ
   แก้ในระบบเงียบ ๆ แล้วใบสองใบไม่ตรงกันคือปัญหาตอนสรรพากรตรวจ
   วิธีที่ถูกคือติดป้ายว่ายกเลิกพร้อมเหตุผล แล้วออกใบใหม่แทน */
function askVoid(no, btn, orderNo, boxSel){
  var row = btn.closest(".row");
  if (row.querySelector(".vdbox")) { row.querySelector(".vd-why").focus(); return }

  var box = document.createElement("div");
  box.className = "vdbox";
  box.innerHTML =
    '<div class="hint" style="margin-bottom:6px">ยกเลิกใบ <b>'+esc(no)+'</b> — '
      +'ใบเดิมยังเก็บไว้ในระบบและพิมพ์ดูย้อนหลังได้ แต่จะถูกตีตราว่ายกเลิก '
      +'และออกใบใหม่ให้ออเดอร์นี้ได้ทันที</div>'
    +'<input class="vd-why" placeholder="เหตุผล เช่น ออกผิดชนิดเอกสาร / ชื่อลูกค้าผิด">'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="mini red vd-go">ยืนยันยกเลิก</button>'
    +'<button class="mini vd-no">ไม่ยกเลิก</button></div>'
    +'<div class="vd-msg hint" style="margin-top:6px"></div>';
  row.appendChild(box);

  var why = box.querySelector(".vd-why");
  var msg = box.querySelector(".vd-msg");
  why.focus();
  box.querySelector(".vd-no").onclick = function(){ box.remove() };
  why.onkeydown = function(e){ if (e.key === "Enter") box.querySelector(".vd-go").click() };

  box.querySelector(".vd-go").onclick = function(){
    var r = why.value.trim();
    if (r.length < 5) {
      msg.style.color = "var(--red)";
      msg.textContent = "ต้องบอกเหตุผลอย่างน้อย 5 ตัวอักษร — บัญชีกับสรรพากรจะอ่านช่องนี้";
      why.focus();
      return;
    }
    var go = box.querySelector(".vd-go");
    go.disabled = true; go.textContent = "กำลังยกเลิก…";
    msg.style.color = ""; msg.textContent = "";
    api("voidDoc", no, r, byName()).then(function(){
      toast("ยกเลิกใบ " + no + " แล้ว ออกใบใหม่ได้เลย");
      drawOldDocs(orderNo, boxSel);
    }, function(e){
      go.disabled = false; go.textContent = "ยืนยันยกเลิก";
      msg.style.color = "var(--red)";
      msg.textContent = "ยกเลิกไม่สำเร็จ: " + (e && e.message ? e.message : e);
    });
  };
}

function reprint(no, btn, outSel){
  var out = $(outSel || "#rp-out");
  if (btn) { btn.disabled = true; btn.textContent = "กำลังดึง…" }
  out.innerHTML = '<div class="load">กำลังดึงใบ '+esc(no)+' มาวาดใหม่…</div>';
  api("getDoc", no).then(function(r){
    var m = r.meta;
    m.seller = CFG.docSeller||""; m.sellerEmail = CFG.docSellerEmail||"";
    return buildDocPage(r.doc, m, CFG.doc||{}, "ต้นฉบับ").then(function(url){
      var warn = "";
      /* ใบเก่าที่ยังไม่มีภาพถ่าย ต้องประกอบจากออเดอร์ ถ้ายอดไม่ตรงกับที่บันทึกไว้
         ต้องบอกให้เห็น ห้ามพิมพ์ใบที่ยอดต่างจากใบที่ลูกค้าถืออยู่เงียบ ๆ */
      if (!r.exact) {
        warn = r.same
          ? '<div class="msg ok" style="display:block">ใบนี้ออกก่อนระบบเก็บรายการในใบ '
            +'จึงประกอบใหม่จากออเดอร์ให้ · <b>ยอดตรงกับที่บันทึกไว้</b> ('+baht(r.saved.total)+')</div>'
          : '<div class="msg err" style="display:block">⚠ ใบนี้ออกก่อนระบบเก็บรายการในใบ '
            +'และยอดที่ประกอบใหม่ได้ '+baht(r.doc.total)+' <b>ไม่ตรง</b>กับยอดที่บันทึกไว้ '
            +baht(r.saved.total)+' — แปลว่าออเดอร์ถูกแก้หลังออกใบ '
            +'<b>อย่าพิมพ์ใบนี้ส่งลูกค้า</b> ให้ยึดใบที่พิมพ์ไปแล้วเป็นหลัก</div>';
      }
      if (m.voidWhy) {
        warn += '<div class="msg err" style="display:block">ใบนี้ถูกยกเลิกไปแล้ว ('
          + esc(m.voidWhy) + ') พิมพ์ดูได้ แต่ใช้อ้างอิงทางบัญชีไม่ได้</div>';
      }
      out.innerHTML = warn
        +'<img class="docimg" src="'+url+'" style="width:100%;border:1px solid var(--line);border-radius:10px">'
        +'<button class="btn" id="lb-share" style="margin-top:12px">แชร์ / สั่งพิมพ์</button>'
        +'<button class="btn dark" id="lb-save" style="margin-top:9px">บันทึกลงเครื่อง</button>'
        +'<button class="btn ghost" id="dc-copy" style="margin-top:9px">ดูสำเนา (เก็บส่งบัญชี)</button>'
        +'<button class="btn ghost" id="lb-open" style="margin-top:9px">เปิดในแท็บใหม่</button>'
        +'<div class="hint" style="text-align:center;margin-top:10px">'
        +'พิมพ์ซ้ำใบเดิม เลขที่เอกสารยังเป็น '+esc(no)+' · ไม่ได้ออกใบใหม่ ไม่ตัดสต๊อกซ้ำ</div>';
      bindLabelButtons(url, no+".png", "a4");
      bindDocCopy(outSel || "#rp-out", r, m, no);
      if (btn) { btn.disabled = false; btn.textContent = "พิมพ์ซ้ำ" }
    });
  }).catch(function(e){
    if (btn) { btn.disabled = false; btn.textContent = "พิมพ์ซ้ำ" }
    out.innerHTML = '<div class="msg err" style="display:block">พิมพ์ซ้ำไม่สำเร็จ: '
      + esc(e && e.message ? e.message : e) + '</div>';
  });
}

/* ------------------------------------------- ขนาดตัวอักษรของทั้งแอป */

/* เจ้าของร้านอ่านตัวอักษรขนาดเดิมไม่ถนัด และคนคีย์แต่ละคนสายตาไม่เท่ากัน
   จึงให้ปรับเองได้ เก็บไว้ในเครื่องใครเครื่องมัน ไม่ต้องแก้โค้ดใหม่ทุกครั้ง
   ปรับที่ราก (html) ทีเดียว ทุกขนาดในหน้าเป็น rem จึงขยับตามพร้อมกันทั้งหน้า */
var FS_MIN = 17, FS_MAX = 30, FS_DEF = 20;

function fsGet(){
  var n = 0;
  try { n = Number(localStorage.getItem("ast-fs") || 0) } catch(e){}
  if (!n || isNaN(n)) n = FS_DEF;
  return Math.min(FS_MAX, Math.max(FS_MIN, n));
}
function fsApply(n){
  document.documentElement.style.fontSize = n + "px";
  try { localStorage.setItem("ast-fs", String(n)) } catch(e){}
  var dn = $("#fs-dn"), up = $("#fs-up");
  if (dn) dn.disabled = n <= FS_MIN;
  if (up) up.disabled = n >= FS_MAX;
}
function fsInit(){
  fsApply(fsGet());
  $("#fs-dn").onclick = function(){ fsApply(Math.max(FS_MIN, fsGet() - 1)) };
  $("#fs-up").onclick = function(){ fsApply(Math.min(FS_MAX, fsGet() + 1)) };
}

    +'<div class="hint">ที่อยู่จดทะเบียนของลูกค้า อาจไม่ใช่ที่อยู่ที่ส่งของ</div></div>'
    +'<div class="two"><div class="fld"><label>โทรศัพท์</label>'

    +'<div class="fld"><label>อีเมล</label><input id="dc-email" value="'+esc(memo.email||"")+'"></div></div>'
    +'<div class="two"><div class="fld"><label>เงื่อนไขการชำระเงิน</label>'
    +'<select id="dc-terms"><option>เงินสด</option><option>โอนเงิน</option>'

    +'<div class="fld"><label>ภาษีมูลค่าเพิ่ม</label>'
    +'<select id="dc-vat"><option value="excl">บวก VAT 7% จากราคา</option>'

    +'<option value="none">ไม่คิด VAT</option></select></div></div>'
    +'<button class="btn" id="dc-make">ออกเอกสาร</button>'
    +'<div id="dc-out" style="margin-top:12px"></div>');

  /* ติ๊กชื่อบนหัวใบให้ตามชนิดที่เลือกไว้ก่อน แล้วคนออกใบแก้เองได้
     สลับชนิดเอกสารเมื่อไหร่ ติ๊กตั้งต้นเปลี่ยนตาม แต่ถ้าแก้เองแล้วไม่ไปยุ่งอีก */
  function formTick(){
    var type = (document.querySelector('input[name=dctype]:checked')||{}).value || "rec";
    var def = (DOC_TYPE_NAMES.filter(function(t){ return t.key===type })[0]||{}).form || [];
    $$("#dc-form .fchk-i").forEach(function(c){
      c.checked = def.indexOf(Number(c.value)) > -1;
    });
  }
  formTick();
  $$("#dc-pick input[name=dctype]").forEach(function(r){
    r.addEventListener("change", function(){ if(!DC_FORM_TOUCHED) formTick() });
  });
  var DC_FORM_TOUCHED = false;
  $$("#dc-form .fchk-i").forEach(function(c){
    c.addEventListener("change", function(){ DC_FORM_TOUCHED = true });
  });

  /* ใบที่เคยออกให้ออเดอร์นี้ — ขึ้นไว้บนสุดพร้อมปุ่มพิมพ์ซ้ำ
     ก่อนหน้านี้ใบที่ออกไปแล้วเปิดกลับมาดูไม่ได้เลย กดออกใหม่ก็โดนกันใบซ้ำ
     คนเลยตันอยู่ตรงนั้น ทั้งที่แค่อยากได้กระดาษอีกแผ่น */
  drawOldDocs(o.no);

  /* เลขผู้เสียภาษีผิดหลักเดียว ลูกค้าเอาใบไปใช้เครดิตภาษีซื้อไม่ได้
     เตือนทันทีตอนพิมพ์ แต่ไม่บล็อก เพราะลูกค้าบุคคลธรรมดาไม่มีเลขนี้ */
  $("#dc-tax").addEventListener("input", function(){
    var t=this.value.replace(/[^\d]/g,""), m=$("#dc-taxmsg");
    if(!t){ m.textContent="เว้นว่างได้ถ้าลูกค้าเป็นบุคคลธรรมดาไม่ขอใบกำกับภาษี"; m.style.color=""; return }
    if(t.length<13){ m.textContent="ยังไม่ครบ 13 หลัก (พิมพ์แล้ว "+t.length+")"; m.style.color="var(--amber)"; return }
    if(taxIdOk(t)){ m.textContent="✓ เลขถูกต้อง"; m.style.color="var(--green)" }
    else { m.textContent="⚠ เลขนี้ไม่ผ่านการตรวจ ลองทานอีกครั้ง ถ้าผิดลูกค้าใช้ใบไม่ได้"; m.style.color="var(--red)" }
  });

  $("#dc-make").onclick = function(){
    var type = (document.querySelector('input[name=dctype]:checked')||{}).value || "rec";
    var vatSel = $("#dc-vat").value;
    var cust = { name:$("#dc-name").value.trim(), taxId:$("#dc-tax").value.replace(/[^\d]/g,""),
                 branch:$("#dc-branch").value, addr:$("#dc-addr").value.trim(),
                 tel:$("#dc-tel").value.trim(), email:$("#dc-email").value.trim() };
    taxMemoSave(o.cust, cust);
    var btn=this; btn.disabled=true;
    $("#dc-out").innerHTML='<div class="load">กำลังออกเลขเอกสารและลงชีท…</div>';
    api("issueDoc", {
      type:type, orderNo:o.no, cust:cust, po:$("#dc-po").value.trim(),
      terms:$("#dc-terms").value, date:o.date, by:byName(),
      vatMode: vatSel==="incl" ? "incl" : "excl", novat: vatSel==="none",
      form: readFormTicks(),
      clientKey: "dc-"+o.no+"-"+type+"-"+Date.now()
    }).then(function(r){
      drawDoc(r, o, cust, type, readFormTicks());
      /* รีเฟรชรายการใบที่ออกไปแล้วทันที ตอนที่รู้ตัวว่าออกผิดคือตอนเพิ่งเห็นใบ
         ปุ่มยกเลิกจึงต้องอยู่ตรงนั้นเลย ไม่ใช่ต้องปิดหน้าต่างแล้วเปิดใหม่ */
      drawOldDocs(o.no);
    }, function(e){
      btn.disabled=false;
      $("#dc-out").innerHTML='<div style="color:var(--red)">ออกเอกสารไม่สำเร็จ: '
        +esc(e&&e.message?e.message:e)+'</div>';
    });
  };
}

/* ชื่อที่ติ๊กไว้ว่าจะให้ขึ้นเข้มบนหัวใบ */

/* ตรวจเลขผู้เสียภาษี 13 หลักด้วยหลักตรวจสอบ mod 11 — ตรรกะเดียวกับ taxIdValid_ ฝั่งชีท */
function taxIdOk(v){
  var t=String(v||"").replace(/[^\d]/g,"");
  if(t.length!==13) return false;
  var sum=0;
  for(var i=0;i<12;i++) sum += Number(t.charAt(i))*(13-i);
  return (11-(sum%11))%10 === Number(t.charAt(12));
}

/* แปลงออเดอร์จากชีทให้เป็นรูปทรงที่ buildLabel ตัวเดิมรู้จัก */
function labelData(o, cod){
  return {
    no:o.no, id:o.no, date:o.date, cust:o.cust, tel:o.tel, addr:o.addr,
    carrier:o.carrier, track:o.track, pay: cod?"cod":"transfer",
    total:o.net, amt:o.subtotal, disc:o.discount,
    qty:(o.items||[]).reduce(function(n,it){return n+(Number(it.qty)||0)},0),
    items:(o.items||[]).map(function(it){ return {name:it.name||it.sku, qty:it.qty} })
  };
}

function bindLabelButtons(url, name, paper){
  /* paper "a4" สำหรับเอกสารขาย · ไม่ใส่ = ใบปะหน้าพัสดุ 100x150 มม. เหมือนเดิม
     ถ้าส่ง A4 ไปพิมพ์ด้วยขนาดซอง เครื่องพิมพ์จะย่อหน้าลง ตัวหนังสือที่เพิ่งขยายจะเล็กกลับไปอีก */
  var pg = paper === "a4" ? "@page{size:A4;margin:6mm}" : "@page{size:100mm 150mm;margin:0}";
  var toFile=function(){
    var b=atob(url.split(",")[1]), n=b.length, u8=new Uint8Array(n);
    while(n--) u8[n]=b.charCodeAt(n);
    var blob=new Blob([u8],{type:"image/png"});
    return {blob:blob, file:new File([blob],name,{type:"image/png"})};
  };
  $("#lb-share").onclick=async function(){
    try{
      var f=toFile();
      if(navigator.canShare && navigator.canShare({files:[f.file]})){
        await navigator.share({files:[f.file],title:"ใบปะหน้าพัสดุ"}); return;
      }
    }catch(e){ if(e&&e.name==="AbortError") return; }
    try{ window.print() }catch(e){ toast("เครื่องนี้แชร์ไม่ได้ ลองปุ่มบันทึกลงเครื่องแทน") }
  };
  $("#lb-save").onclick=function(){
    try{
      var f=toFile(), href=URL.createObjectURL(f.blob);
      var a=document.createElement("a"); a.href=href; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(href)},4000);
      toast("บันทึกแล้ว ดูในโฟลเดอร์ดาวน์โหลด");
    }catch(e){ toast("บันทึกไม่ได้ ลองปุ่มเปิดในแท็บใหม่") }
  };
  /* แตะที่ตัวรูปได้เลย เท่ากับกดปุ่มเปิดในแท็บใหม่ — บนมือถือคนหาปุ่มไม่เจอ
     แล้วไปถ่างนิ้วบนรูปเล็กในแอปแทน ซึ่งซูมไม่ขึ้นเพราะติดกรอบ iframe ของ Apps Script */
  var thumb = document.querySelector("img.docimg");
  if (thumb) {
    thumb.style.cursor = "zoom-in";
    thumb.title = "แตะเพื่อดูเต็มจอ / ซูม";
    thumb.onclick = function(){ $("#lb-open").click() };
  }
  $("#lb-open").onclick=function(){
    var w=window.open();
    if(!w){ toast("เบราว์เซอร์บล็อกแท็บใหม่"); return }
    if (paper === "a4") {
      /* กว้างคงที่ 1240 (ไม่ใช่ 100%) หน้าเว็บจึงกว้างกว่าจอมือถือ
         เบราว์เซอร์เลยยอมให้เลื่อนและถ่างนิ้วซูมได้จริง · initial-scale ปล่อยให้
         เบราว์เซอร์ย่อลงมาพอดีจอเองตอนเปิด แล้วค่อยถ่างนิ้วขยายดูทีละส่วน
         ตอนสั่งพิมพ์ @page A4 บังคับให้กลับไปเต็มหน้ากระดาษเหมือนเดิม */
      w.document.write('<!DOCTYPE html><meta name="viewport" content="width=1240">'
        +'<title>'+esc(name.replace(/\.png$/, ""))+'</title>'
        +'<style>'+pg+'body{margin:0;background:#555}'
        +'img{width:1240px;max-width:none;display:block}'
        +'@media print{body{background:#fff}img{width:100%}}</style>'
        +'<img src="'+url+'">');
    } else {
      w.document.write('<!DOCTYPE html><meta name="viewport" content="width=device-width,initial-scale=1">'
        +'<style>'+pg+'body{margin:0}img{width:100%;display:block}</style>'
        +'<img src="'+url+'">');
    }
    w.document.close();
  };
}

/* ใบชุดหนึ่งพิมพ์สองใบ — ต้นฉบับให้ลูกค้า สำเนาเก็บไว้ส่งฝ่ายบัญชี
   สองใบเนื้อความเหมือนกันทุกตัวอักษร ต่างกันแค่ตราชุดมุมขวาบน
   ปุ่มนี้จึงวาดใบเดิมซ้ำในโหมดสำเนา ไม่ได้ออกเลขใหม่ เลขที่เอกสารยังเป็นใบเดียวกัน
   (ออกเลขใหม่ให้สำเนา = เอกสารภาษีซ้ำซ้อน บัญชีจะตีกลับ) */
function bindDocCopy(boxSel, r, m, no){
  var box = $(boxSel), b = box.querySelector("#dc-copy");
  if(!b) return;
  b.onclick = function(){
    var next = b.getAttribute("data-set") === "สำเนา" ? "ต้นฉบับ" : "สำเนา";
    b.disabled = true; b.textContent = "กำลังวาด" + next + "…";
    buildDocPage(r.doc, m, CFG.doc||{}, next).then(function(url){
      box.querySelector("img.docimg").src = url;
      bindLabelButtons(url, no + (next === "สำเนา" ? "-สำเนา" : "") + ".png", "a4");
      bindDocCopy(boxSel, r, m, no);
      b.setAttribute("data-set", next);
      b.textContent = next === "สำเนา"
        ? "← กลับไปดูต้นฉบับ (ให้ลูกค้า)" : "ดูสำเนา (เก็บส่งบัญชี)";
      b.disabled = false;
    }, function(e){
      b.disabled = false; b.textContent = "ดูสำเนา (เก็บส่งบัญชี)";
      toast("วาดสำเนาไม่สำเร็จ: " + (e && e.message ? e.message : e));
    });
  };
}

function trackUrlOf(carrier, track){
  if(!carrier||!track) return "";
  var tpl=(APP.track||{})[carrier];
  if(!tpl) return "";                    /* ไม่มีลิงก์ก็ไม่เดา */
  var t=encodeURIComponent(String(track).trim());
  return tpl.replace(/\{track\}/g,t).replace(/\{T\}/g,t);
}

/* ข้อความแจ้งเลขพัสดุ — ตัวอักษรเหมือนของเดิมทุกตัว */
function shipMsg(o){

   + "🚛 ขนส่ง: " + (o.carrier||"-") + "\n\n"
   + "📦 เลขพัสดุ: " + (o.track||"-") + "\n\n"
   + "ขอบพระคุณที่อุดหนุนสินค้าจากทางร้านนะคะ 🙏💙 "
   + "หากได้รับสินค้าเรียบร้อยแล้ว รบกวนแจ้งให้ทางร้านทราบ "
   + "และหากพึงพอใจในสินค้าและการบริการ ฝากรีวิว ⭐⭐⭐⭐⭐ เป็นกำลังใจให้ทางร้านด้วยนะคะ";
  var url = trackUrlOf(o.carrier, o.track);
  if (url) t += "\n\nติดตามพัสดุ: " + url;
  return t;
}

/* ข้อความสรุปออเดอร์สำหรับส่งให้ลูกค้าตอนสั่ง */
/**
 * ข้อความสรุปออเดอร์ที่แอดมินส่งกลับให้ลูกค้า
 *
 * ยกรูปแบบมาจากที่ร้านพิมพ์เองในเพจทุกวัน — ของจริงหน้าตาแบบนี้
 *
 *   🛠 ชื่อรุ่น            ← ขึ้นครั้งเดียว ถ้าหลายไซซ์เป็นรุ่นเดียวกัน
 *   🔷 ขนาด
 *   💰 ราคา×จำนวน = รวม
 *
 * เหตุผลที่ต้องเหมือนเป๊ะ: ลูกค้าเก่าคุ้นกับหน้าตานี้แล้ว และแอดมินจะได้
 * กดคัดลอกส่งได้เลยโดยไม่ต้องมานั่งแก้ทีละบรรทัด
 */
function splitName_(name){
  /* ตัดชื่อสินค้าเป็น "รุ่น" กับ "ขนาด" ที่ตัวเลขขนาดตัวแรก
     เช่น "End Mill Corn cut 2F  3.0*15*3.175*38L (1pcs)"
          → รุ่น "End Mill Corn cut 2F" · ขนาด "3.0*15*3.175*38L (1pcs)" */
  var m = /\d+(\.\d+)?\s*[*×xX]/.exec(name || "");
  if (!m || !m.index) return { fam: (name||"").trim(), size: "" };
  return {
    fam:  name.slice(0, m.index).replace(/[\/\-\s]+$/, "").trim(),
    size: name.slice(m.index).trim()
  };
}

function dmy_(iso){
  /* ข้อความที่ส่งลูกค้าใช้ 29/08/2026 ตามที่ร้านพิมพ์เอง ไม่ใช่ปี พ.ศ.
     (ใบปะหน้ายังใช้ thaiDate เหมือนเดิม ไม่ไปแตะ) */
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||""));
  return m ? m[3] + "/" + m[2] + "/" + m[1] : String(iso||"");
}

function num_(n){
  /* 89 ไม่ใช่ 89.00 · 89.5 ยังเป็น 89.5 — ข้อความที่ส่งลูกค้าต้องอ่านง่าย */
  n = Math.round(Number(n||0) * 100) / 100;
  return String(n);
}

function orderMsg(o){
  var t = "📦 สรุปออเดอร์ลูกค้า\n📅 วันที่ " + dmy_(o.date) + "\n\n";
  /* ชื่อกับเบอร์อยู่หัวข้อความ ตำแหน่งเดียวกับที่ร้านพิมพ์เองมาตลอด
     ลูกค้าจะได้เห็นว่าเราจดชื่อเบอร์ถูก และร้านเอาไปเทียบกับใบปะหน้าได้
     (ข้อความนี้ยังอ่านกลับด้วยตัวแยกข้อความของแอปเองได้เหมือนเดิม) */
  if (o.cust) t += "👤 " + o.cust + "\n";
  if (o.tel)  t += "📞 " + o.tel + "\n";
  if (o.cust || o.tel) t += "\n";
  var lastFam = null;
  (o.items||[]).forEach(function(it){
    var p = splitName_(it.name || it.sku);
    if (p.fam && p.fam !== lastFam) { t += "🛠 " + p.fam + "\n"; lastFam = p.fam; }
    if (p.size) t += "🔷 " + p.size + "\n";
    /* ราคา 0 = ของแถม เขียนให้ลูกค้าอ่านรู้เรื่องว่าได้อะไรฟรีไปบ้าง */
    if (Number(it.price) === 0)
      t += "🎁 แถมฟรี " + num_(it.qty) + " " + (it.unit || "ชิ้น") + "\n";
    else
      t += "💰 " + num_(it.price) + "×" + num_(it.qty) + " = " + num_(it.total) + "\n";
  });
  t += "━━━━━━━━━━━━━\n";
  t += "💵 รวมค่าสินค้า : " + num_(o.subtotal) + " บาท\n";
  if (Number(o.discount) > 0) t += "🏷️ ส่วนลด : " + num_(o.discount) + " บาท\n";
  t += "🚚 ค่าจัดส่ง : " + num_(o.ship) + " บาท\n";
  t += "✅ ยอดชำระทั้งหมด : " + num_(o.net) + " บาท\n";
  if (o.addr) t += "━━━━━━━━━━━━━\n📍 ที่อยู่จัดส่ง\n" + o.addr + "\n";
  return t;
}

function openMsg(o){
  var ship = o.track ? shipMsg(o) : "";
  var body = '<div class="fld"><label>ข้อความสรุปออเดอร์ (ส่งตอนลูกค้าสั่ง)</label>'
    +'<textarea rows="12" id="mg-ord" readonly>'+esc(orderMsg(o))+'</textarea>'
    +'<button class="mini" id="mg-c1" style="margin-top:8px">คัดลอก</button></div>';
  if(ship){
    body += '<div class="fld" style="margin-top:14px"><label>ข้อความแจ้งเลขพัสดุ (ส่งตอนจัดส่ง)</label>'
      +'<textarea rows="12" id="mg-shp" readonly>'+esc(ship)+'</textarea>'
      +'<button class="mini" id="mg-c2" style="margin-top:8px">คัดลอก</button>'
      + (trackUrlOf(o.carrier,o.track) ? '' :
         '<div class="hint" style="color:var(--red)">ขนส่ง “'+esc(o.carrier||"ไม่ระบุ")
         +'” ยังไม่ได้ตั้งลิงก์ติดตามในชีท ตั้งค่าแอป ข้อความจึงไม่มีบรรทัดลิงก์</div>')
      +'</div>';
  }else{
    body += '<div class="hint" style="margin-top:12px">ยังไม่มีเลขพัสดุ ใส่เลขพัสดุก่อนจึงจะมีข้อความแจ้งจัดส่ง</div>';
  }
  openModal("ข้อความส่งลูกค้า — "+o.no, body);
  $("#mg-c1").onclick=function(){ copyText(orderMsg(o),"คัดลอกข้อความสรุปแล้ว") };
  if(ship) $("#mg-c2").onclick=function(){ copyText(ship,"คัดลอกข้อความแจ้งพัสดุแล้ว") };

function copyText(text, okMsg){
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99999);
  var done=false; try{done=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
  if(!done && navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){toast(okMsg)}) }
  else toast(done?okMsg:"กดค้างที่ข้อความเพื่อคัดลอก");
}

/* ------------------------------------------------------------------ สรุปยอด */

/* ช่วงเวลาที่ดูได้ — ชุดเดียวกับที่ร้านใช้คิดงานจริง (วันนี้ / เมื่อวาน / 7 วัน / เดือนนี้) */
var RANGES = [
  { key:"today", label:"วันนี้" },
  { key:"yday",  label:"เมื่อวาน" },
  { key:"7d",    label:"7 วันล่าสุด" },
  { key:"month", label:"เดือนนี้" },
  { key:"all",   label:"ทั้งหมด" }
];
var SUM_RANGE = "today";
var SUM_CACHE = null;

function isoShift_(days){
  var d = new Date(); d.setDate(d.getDate() + days);
  var p = function(n){ return n < 10 ? "0" + n : "" + n };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function inRange_(iso, key){
  if (!iso) return false;
  if (key === "all")   return true;
  if (key === "today") return iso === isoShift_(0);
  if (key === "yday")  return iso === isoShift_(-1);
  if (key === "7d")    return iso >= isoShift_(-6) && iso <= isoShift_(0);
  if (key === "month") return iso.slice(0,7) === isoShift_(0).slice(0,7);
  return true;
}

/** แถวแท่งนอนหนึ่งแถว — ชื่อ · ตัวเลขหลัก · แท่ง · บรรทัดรายละเอียด */
function bar_(name, value, sub, ratio){
  return '<div class="brow">'
    + '<div class="btop"><span class="bname">' + esc(name) + '</span>'
    + '<b class="bval">' + value + '</b></div>'
    + '<div class="btrack"><i style="width:' + Math.max(2, Math.round(ratio*100)) + '%"></i></div>'
    + (sub ? '<div class="bsub">' + esc(sub) + '</div>' : '')
    + '</div>';
}

/** จัดกลุ่มแล้วเรียงจากมากไปน้อย คืนมาไม่เกิน top แถว */
function group_(list, keyOf, addOf, top){
  var m = {};
  list.forEach(function(o){
    var k = keyOf(o) || "ไม่ระบุ";
    if (!m[k]) m[k] = { key:k, n:0, v:0, extra:0 };
    m[k].n++;
    addOf(m[k], o);
  });
  var arr = Object.keys(m).map(function(k){ return m[k] });
  arr.sort(function(a,b){ return b.v - a.v });
  return top ? arr.slice(0, top) : arr;
}

function section_(title, rows){
  if (!rows) return "";
  return '<div class="card"><div class="subhd" style="margin-top:0">' + esc(title) + '</div>' + rows + '</div>';
}

function loadSummary(){
  /* ปุ่มช่วงเวลาวาดครั้งเดียว กดสลับแล้วคำนวณจากข้อมูลชุดเดิม ไม่ต้องยิงชีทซ้ำ */
  if (!$("#sum-range").innerHTML){
    $("#sum-range").innerHTML = RANGES.map(function(r){
      return '<button data-r="' + r.key + '"' + (r.key===SUM_RANGE?' class="on"':'') + '>' + r.label + '</button>';
    }).join("");
    $("#sum-range").addEventListener("click", function(e){
      var b = e.target.closest("button[data-r]"); if(!b) return;
      SUM_RANGE = b.dataset.r;
      $$("#sum-range button").forEach(function(x){ x.classList.toggle("on", x.dataset.r===SUM_RANGE) });
      /* แถบปุ่มเลื่อนได้ ปุ่มที่เลือกต้องอยู่ในสายตาเสมอ ไม่งั้นกดแล้วไม่รู้ว่าอยู่ช่วงไหน */
      if (b.scrollIntoView) b.scrollIntoView({ block:"nearest", inline:"center" });
      if (SUM_CACHE) drawSummary(SUM_CACHE);
    });
  }
  if (SUM_CACHE) { drawSummary(SUM_CACHE); return; }
  $("#summary").innerHTML = '<div class="load">กำลังโหลด…</div>';
  call("getOrders", [500], function(list){
    SUM_CACHE = list;
    if (!ORDERS.length) ORDERS = list;
    drawSummary(list);
  }, function(m){
    $("#summary").innerHTML = '<div class="empty" style="color:var(--red)">โหลดไม่สำเร็จ<br>' + esc(m) + '</div>';
  });
}

function drawSummary(all){
  var live = all.filter(function(o){
    return o.status !== "ยกเลิก" && inRange_(o.date, SUM_RANGE);
  });

  if (!live.length){
    $("#summary").innerHTML = '<div class="empty"><b>ยังไม่มีออเดอร์ในช่วงนี้</b>'
      + 'ลองเลือกช่วงเวลาอื่นดู</div>';
    return;
  }

  var net=0, sub=0, ship=0, profit=0, pieces=0;
  live.forEach(function(o){
    net    += Number(o.net)||0;
    sub    += Number(o.subtotal)||0;
    ship   += Number(o.ship)||0;
    profit += Number(o.profit)||0;
    (o.items||[]).forEach(function(it){ pieces += Number(it.qty)||0 });
  });

  var h = '<div class="kpis">'
    + '<div class="kpi"><span>ออเดอร์</span><b>' + live.length + ' ใบ</b></div>'
    + '<div class="kpi"><span>จำนวนชิ้น</span><b>' + pieces + '</b></div>'
    + '<div class="kpi wide"><span>ยอดชำระสุทธิ</span><b>' + baht(net) + '</b></div>'
    + '<div class="kpi good"><span>กำไรขั้นต้น</span><b>' + baht(profit) + '</b></div>'
    + '<div class="kpi"><span>ค่าจัดส่งรวม</span><b>' + baht(ship) + '</b></div>'
    + '</div>';

  function rows_(arr, fmt){
    var max = arr.length ? arr[0].v : 0;
    return arr.map(function(g){
      return bar_(g.key, baht(g.v), fmt(g), max ? g.v/max : 0);
    }).join("");
  }

  var byCarrier = group_(live, function(o){ return o.carrier },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.ship)||0 });
  h += section_("ตามค่ายขนส่ง", rows_(byCarrier, function(g){
    return g.n + " ใบ · ค่าส่ง " + baht(g.extra);
  }));

  var byChan = group_(live, function(o){ return o.channel },
    function(g,o){ g.v += Number(o.net)||0; g.extra += Number(o.profit)||0 });
  h += section_("ตามช่องทางขาย", rows_(byChan, function(g){
    return g.n + " ใบ · กำไร " + baht(g.extra);
  }));

  /* สินค้าขายดี — นับเป็น "ชิ้น" เหมือนที่ร้านดู ไม่ใช่นับเป็นใบ */
  var prod = {};
  live.forEach(function(o){
    (o.items||[]).forEach(function(it){
      var k = it.name || it.sku; if (!k) return;
      if (!prod[k]) prod[k] = { key:k, n:0, v:0, extra:0 };
      prod[k].n += Number(it.qty)||0;
      prod[k].v += Number(it.total)||0;
      prod[k].extra += 1;
    });
  });
  var top = Object.keys(prod).map(function(k){ return prod[k] })
    .sort(function(a,b){ return b.n - a.n }).slice(0, 5);
  var maxN = top.length ? top[0].n : 0;
  h += section_("สินค้าขายดี 5 อันดับ", top.map(function(g){
    return bar_(g.key, g.n + " ชิ้น", baht(g.v) + " · " + g.extra + " ออเดอร์",
      maxN ? g.n/maxN : 0);
  }).join(""));

  var byStaff = group_(live, function(o){ return o.staff },
    function(g,o){ g.v += Number(o.net)||0 });
  if (byStaff.length > 1)
    h += section_("ผู้คีย์ออเดอร์", rows_(byStaff, function(g){ return g.n + " ใบ" }));

  h += '<div class="hint" style="padding:0 2px">ตัวเลขทั้งหมดมาจากชีทโดยตรง '
    + 'ไม่ได้คิดซ้ำในแอป · ไม่รวมออเดอร์ที่ยกเลิก</div>';

  /* บอกให้ชัดว่าตัวเลขพวกนี้มาจากไฟล์ไหน กดเปิดได้เลย
     ในไดรฟ์มีไฟล์ชื่อคล้ายกันหลายอัน เคยหลงแก้อยู่คนละไฟล์กับที่แอปเขียนมาแล้ว */
  var f = (BOOT && BOOT.file) || {};
  if (f.name) {
    h += '<div class="hint" style="padding:8px 2px 0">ข้อมูลทั้งหมดอยู่ในไฟล์ '
      + (f.url ? '<a href="'+esc(f.url)+'" target="_blank" rel="noopener"><b>'+esc(f.name)+'</b></a>'
               : '<b>'+esc(f.name)+'</b>')
      + ' — ไฟล์อื่นที่ชื่อคล้ายกันในไดรฟ์ ไม่ใช่ตัวที่แอปเขียน</div>';
  }

  $("#summary").innerHTML = h;
}

function openModal(title, html){
  $("#m-title").textContent=title;
  $("#m-body").innerHTML=html;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); $("#m-body").innerHTML="" }
$("#modal").addEventListener("click", function(e){ if(e.target===this) closeModal() });
$("#m-close").onclick = closeModal;
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal() });

function go(page){
  ["new","list","quote","sum"].forEach(function(p){
    $("#pg-"+p).style.display = (p===page)?"":"none";
  });
  $$(".tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.go===page) });
  if(page==="list") loadOrders();
  if(page==="sum")  loadSummary();
  if(page==="quote") quoteInit();
}

document.addEventListener("DOMContentLoaded", function(){
  /* ตั้งขนาดตัวอักษรก่อนอย่างอื่น จะได้ไม่เห็นหน้าจอกระตุกตอนเปลี่ยนขนาด */
  fsInit();
  $$(".tabs button").forEach(function(b){ b.onclick=function(){ go(b.dataset.go) } });
  $("#btn-add").onclick   = function(){ addItem(); recalc() };
  $("#btn-parse").onclick = doParse;
  $("#btn-save").onclick  = save;
  docBarInit();
  ["f-disc","f-ship"].forEach(function(id){ $("#"+id).oninput = recalc });
  ["f-vat","f-status"].forEach(function(id){ $("#"+id).onchange = recalc });
  $("#f-disc").addEventListener("change", recalc);

  /* ค่าจัดส่งแนะนำอัตโนมัติ เฉพาะตอนที่ยังไม่ได้พิมพ์เอง */
  $("#f-ship").dataset.touched = "";
  $("#f-ship").addEventListener("input", function(){ this.dataset.touched="1" });

  $("#list").addEventListener("click", function(e){
    var b=e.target.closest("[data-lb],[data-tk],[data-sm],[data-dc]");
    if(!b) return;
    if(b.dataset.lb!==undefined) openLabel(ORDERS[+b.dataset.lb]);
    else if(b.dataset.tk!==undefined) openTracking(ORDERS[+b.dataset.tk]);
    else if(b.dataset.sm!==undefined) openMsg(ORDERS[+b.dataset.sm]);
    else if(b.dataset.dc!==undefined) openDoc(ORDERS[+b.dataset.dc]);
  });

  boot();
});
