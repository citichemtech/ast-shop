<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- ลิงก์และการพิมพ์ต้องหลุดออกจาก iframe ของ Apps Script ไม่งั้นเปิดไม่ขึ้น -->
<base target="_top">
</head>
<body>

<style>
:root{
  --ink:#15181d; --gray:#6b7280; --line:#e3e6ea; --bg:#f5f6f8; --card:#fff;
  --blue:#1449C4; --green:#0a8f4d; --red:#c02626; --amber:#b06a00;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Prompt",sans-serif;
  padding-bottom:76px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
textarea{resize:vertical}

/* หัวเรื่อง — ทรงเดียวกับแอปเดิม: แถบน้ำเงินมุมล่างมน โลโก้กลมบนพื้นขาว */
.top{background:var(--blue);color:#fff;padding:16px 18px 20px;border-radius:0 0 24px 24px;
  display:flex;align-items:center;gap:12px}
.top .logo{width:52px;height:52px;border-radius:50%;background:#fff;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--blue);font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.16)}
.top .logo img{width:100%;height:100%;object-fit:cover}
.top .ttl{min-width:0}
.top b{display:block;font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.top .who{display:block;margin-top:3px;font-size:12px;opacity:.9;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wrap{padding:14px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;color:var(--gray);margin-bottom:5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--gray);margin-top:5px;line-height:1.5}
.subhd{font-size:13px;font-weight:700;color:var(--gray);margin:16px 0 8px;letter-spacing:.02em}

.btn{width:100%;padding:14px;border:0;border-radius:11px;background:var(--blue);color:#fff;
  font-weight:700;font-size:16px}
.btn[disabled]{opacity:.55}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:#00B900}
.mini{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px}
.mini.red{color:var(--red);border-color:#f0c9c9}

.it{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;background:#fbfcfd}
.it .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.it .hd b{font-size:12.5px;color:var(--gray)}
.it .hd .rm{margin-left:auto}
.it .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lotline{font-size:12px;margin-top:6px;line-height:1.5}
.lotline.warn{color:var(--amber)}
.lotline.bad{color:var(--red);font-weight:600}
.lotline.ok{color:var(--green)}

.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum.big{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

.row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .i{flex:1;min-width:0}
.row .i b{display:block}
.row .i span{font-size:12.5px;color:var(--gray)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sq{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:16px;padding:0}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--gray)}
.tag.ok{background:#e6f5ec;color:var(--green)}
.tag.wait{background:#fdf1e0;color:var(--amber)}
.tag.bad{background:#fbe9e9;color:var(--red)}

.pv{border:1px solid var(--blue);border-radius:11px;padding:12px;margin:10px 0;background:#f7f9ff}
.pv .r{display:flex;gap:8px;padding:5px 0;font-size:13.5px;border-bottom:1px dashed #dfe4ee}
.pv .r:last-of-type{border-bottom:0}
.pv .r i{width:104px;flex:none;color:var(--gray);font-style:normal;font-size:12.5px}
.pv .r b{flex:1;font-weight:600;word-break:break-word}
.pv .r.miss b{color:var(--red);font-weight:500}
.pv .r.opt i{opacity:.65}

.msg{padding:11px 12px;border-radius:10px;font-size:13.5px;line-height:1.6;margin-bottom:11px;display:none}
.msg.on{display:block}
.msg.err{background:#fbe9e9;color:#8f1d1d;border:1px solid #f0c9c9}
.msg.ok{background:#e6f5ec;color:#0a6b3c;border:1px solid #bfe4cf}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:11px 4px 13px;font-size:11.5px;color:var(--gray);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--blue);font-weight:700}
.tabs button em{font-style:normal;font-size:19px;line-height:1}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);display:none;align-items:flex-end}
.modal.on{display:flex}
.modal .sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:640px){.modal{align-items:center;justify-content:center}
  .modal .sheet{max-width:600px;border-radius:16px}}
/* ปุ่มปิดต้องมีจริง ๆ — บนมือถือพื้นที่นอกกล่องแทบไม่เหลือให้กด */
.m-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.m-hd h3{flex:1;font-size:17px;min-width:0}
.m-x{width:36px;height:36px;flex:none;border:1px solid var(--line);background:#fff;
  border-radius:9px;font-size:15px;color:var(--gray);padding:0}

#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:90;
  background:#15181d;color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--gray);padding:34px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:5px}
.load{text-align:center;color:var(--gray);padding:40px 12px}
/* ปุ่มทำงานต่อหลังบันทึก — พิมพ์ใบปะหน้า / ส่งข้อความ อยู่ในกล่องเขียวเลย
   ไม่ต้องไปตามหาใบที่เพิ่งคีย์ในแท็บออเดอร์อีกที */
.okact{display:flex;gap:8px;margin-top:11px}
.okact button{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--green);
  background:#fff;color:var(--green);font-weight:700;font-size:14.5px}
</style>

<div class="top">
  <div class="logo" id="logo">AST</div>
  <div class="ttl">
    <b id="brand">AST Chem-Tooling</b>
    <span class="who" id="who"></span>
  </div>
</div>

<div class="wrap">
  <div class="msg err" id="err"></div>
  <div class="msg ok" id="ok"></div>

  <!-- ---------------------------------------------------- คีย์ออเดอร์ -->
  <section id="pg-new">
    <div class="load" id="booting">กำลังโหลดข้อมูลสินค้าจากชีท…</div>

    <div id="form" style="display:none">
      <div class="card">
        <div class="fld">
          <label>วางข้อความสรุปออเดอร์จากไลน์</label>
          <textarea id="paste" rows="4" placeholder="คัดลอกข้อความจากแชทลูกค้ามาวางตรงนี้ แล้วกดปุ่มด้านล่าง"></textarea>
          <button class="mini" id="btn-parse" style="margin-top:8px">อ่านข้อความให้</button>
          <div class="hint">ระบบจะแสดงให้ตรวจก่อน ยังไม่กรอกลงฟอร์มจนกว่าจะกด “ใช้ข้อมูลนี้”</div>
        </div>
        <div id="pv-slot"></div>
      </div>

      <div class="card">
        <div class="two">
          <div class="fld"><label>วันที่</label><input id="f-date" type="date"></div>
          <div class="fld"><label>ช่องทางขาย</label><select id="f-channel"></select></div>
        </div>
        <div class="fld"><label>ชื่อลูกค้า</label><input id="f-cust" placeholder="ชื่อผู้รับ"></div>
        <div class="fld"><label>เบอร์โทร</label><input id="f-tel" inputmode="tel"></div>
        <div class="fld"><label>ที่อยู่จัดส่ง</label><textarea id="f-addr" rows="3"></textarea></div>
        <div class="two">
          <div class="fld"><label>ช่องทางจัดส่ง</label><select id="f-carrier"></select></div>
          <div class="fld"><label>เลขพัสดุ (ใส่ทีหลังได้)</label><input id="f-track"></div>
        </div>
      </div>

      <div class="card">
        <div class="subhd" style="margin-top:0">รายการสินค้า</div>
        <div id="items"></div>
        <button class="mini" id="btn-add">+ เพิ่มสินค้า</button>
      </div>

      <div class="card">
        <div class="two">
          <div class="fld"><label>ส่วนลด (บาท)</label><input id="f-disc" type="number" inputmode="decimal" value="0"></div>
          <div class="fld"><label>ค่าจัดส่ง (บาท)</label><input id="f-ship" type="number" inputmode="decimal" value="0"></div>
        </div>
        <div class="two">
          <div class="fld"><label>ภาษี</label><select id="f-vat"></select></div>
          <div class="fld"><label>สถานะ</label><select id="f-status"></select></div>
        </div>
        <div class="fld"><label>หมายเหตุ</label><input id="f-note"></div>

        <div class="sum"><span>ยอดสินค้า</span><b id="s-sub">฿0.00</b></div>
        <div class="sum"><span>ส่วนลด</span><b id="s-disc">฿0.00</b></div>
        <div class="sum"><span>ค่าจัดส่ง</span><b id="s-ship">฿0.00</b></div>
        <div class="sum" id="s-vat-row" style="display:none"><span>VAT</span><b id="s-vat">฿0.00</b></div>
        <div class="sum big"><span>ยอดชำระสุทธิ</span><b id="s-net">฿0.00</b></div>

        <button class="btn" id="btn-save" style="margin-top:12px">บันทึกออเดอร์ลงชีท</button>
        <div class="hint" id="save-hint">เลขที่ออเดอร์ถัดไป: <b id="next-no">—</b></div>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------ ออเดอร์ -->
  <section id="pg-list" style="display:none">
    <div class="card" id="list"><div class="load">กำลังโหลด…</div></div>
  </section>

  <!-- --------------------------------------------------------- สรุป -->
  <section id="pg-sum" style="display:none">
    <div class="card" id="summary"><div class="load">กำลังโหลด…</div></div>
  </section>
</div>

<div class="tabs">
  <button data-go="new" class="on"><em>＋</em>คีย์ออเดอร์</button>
  <button data-go="list"><em>▤</em>ออเดอร์</button>
  <button data-go="sum"><em>▦</em>สรุปยอด</button>
</div>

<div class="modal" id="modal"><div class="sheet">
  <div class="m-hd"><h3 id="m-title"></h3><button class="m-x" id="m-close" aria-label="ปิด">✕</button></div>
  <div id="m-body"></div>
</div></div>
<div id="toast"></div>

<script>
/* ตัวช่วยพื้นฐาน ต้องมาก่อนไฟล์อื่นเพราะทุกไฟล์เรียกใช้ */
function $(s){ return document.querySelector(s) }
function $$(s){ return [].slice.call(document.querySelectorAll(s)) }
var baht=function(n){return "฿"+Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})};
var esc=function(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on")},2400)}

/* CFG มีไว้ให้โค้ดที่ยกมาจากแอปเดิม (ตัวอ่านข้อความ + ใบปะหน้า) ใช้ได้โดยไม่ต้องแก้
   ของเดิมมาจาก localStorage ตัวนี้มาจากชีท — ชื่อฟิลด์เหมือนเดิมทุกตัว */
var CFG = { products:[], sender:{name:"",addr:"",tel:""}, codFee:0, logo:"", brand:"", carrierLinks:{}, line:"" };
var STAFF_EMAIL = "<?= staffEmail ?>";

</body>
</html>
