<!DOCTYPE html>
<html lang="th"><head>
<meta charset="UTF-8">
<base target="_top">
<style>
/* หน้าร้านที่ลูกค้าเปิดเอง — สินค้าทั้งหมดมาจากชีท ไม่มีอะไรฝังอยู่ในหน้านี้
   แก้ราคาที่ชีทที่เดียว ลูกค้ารีเฟรชแล้วเห็นราคาใหม่ทันที */
:root{
  --blue:#3D8BFF;--blue-dp:#1668D6;--red:#BE4B48;
  --ink:#141821;--gray:#7B8593;--line:#E6E9ED;--soft:#F4F6F8;--appw:480px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Prompt',system-ui,-apple-system,"Noto Sans Thai",sans-serif;
  color:var(--ink);background:#EEF1F4;font-size:15px;line-height:1.6}
#app{max-width:var(--appw);margin:0 auto;background:#fff;min-height:100vh;
  position:relative;padding-bottom:26px;overflow:hidden}
@media (min-width:600px){ :root{--appw:100%} }
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
img{display:block;max-width:100%}

.hdr{background:var(--blue);color:#fff;padding:18px 20px 26px;border-radius:0 0 26px 26px}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.hdr .sub{font-size:13px;opacity:.92;margin-top:4px}
.search{margin-top:16px;background:#fff;border-radius:14px;display:flex;
  align-items:center;gap:10px;padding:0 16px;height:50px}
.search svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;flex:none}
.search input{border:0;outline:0;flex:1;color:var(--ink);background:none}

.closed{margin:16px 20px 0;background:#FFF3E0;border:1px solid #F0D3A0;color:#8A5A12;
  border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.55}

.cats{display:flex;gap:9px;overflow-x:auto;padding:18px 20px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:9px 16px;border-radius:999px;background:var(--soft);
  color:var(--gray);font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.cats button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.count{padding:16px 20px 0;font-size:13px;color:var(--gray)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 20px 0}
@media (max-width:359px){.grid{grid-template-columns:1fr}}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}

.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(20,24,33,.05)}
.card-img{position:relative;aspect-ratio:1/1;background:var(--soft);
  display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:cover}
.ph{color:#A8B0BA;font-size:12px;text-align:center;padding:12px;line-height:1.45}
.out-tag{position:absolute;inset:0;background:rgba(255,255,255,.72);
  display:flex;align-items:center;justify-content:center}
.out-tag span{background:var(--red);color:#fff;font-size:13px;font-weight:600;
  padding:6px 14px;border-radius:999px}
.card.is-out .card-img img{filter:grayscale(.6);opacity:.75}
.card-bd{padding:12px 12px 13px;display:flex;flex-direction:column;flex:1;gap:3px}
.card-bd h3{font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sku{font-size:11.5px;color:var(--blue);font-weight:600}
.meta{font-size:11.5px;color:var(--gray)}
.price{font-size:19px;font-weight:700;margin-top:auto;padding-top:6px}
.ask{width:100%;padding:11px;border-radius:11px;background:var(--red);color:#fff;
  font-size:14px;font-weight:600;margin-top:9px}
.ask:disabled{background:#D7DBE0;color:#8B939C;cursor:not-allowed}

.line-card{margin:24px 20px 0;background:linear-gradient(135deg,#00B900,#00A000);
  border-radius:18px;padding:20px;color:#fff;box-shadow:0 4px 16px rgba(0,185,0,.25)}
.line-card h3{font-size:18px;font-weight:700;margin-bottom:6px}
.line-card p{font-size:14px;opacity:.95;line-height:1.55;margin-bottom:14px}
.line-card button{width:100%;background:#fff;color:#00A000;border-radius:12px;
  padding:13px;font-size:16px;font-weight:700}
.foot{padding:22px 20px 8px;color:var(--gray);font-size:12.5px;line-height:1.7;text-align:center}

.state{padding:60px 24px;text-align:center;color:var(--gray);font-size:14.5px;line-height:1.7}
.state b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.state button{margin-top:14px;background:var(--blue);color:#fff;padding:11px 24px;
  border-radius:999px;font-weight:600}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#141821;
  color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;
  pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <h1 id="shop-name">AST Chem-Tooling</h1>
    <div class="sub" id="shop-sub">ร้านเครื่องมือช่างและเคมีภัณฑ์</div>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="ค้นหาสินค้า หรือรหัส SKU...">
    </label>
  </header>

  <div id="closed" class="closed" style="display:none">
    ตอนนี้ร้านปิดรับออเดอร์ทางเว็บชั่วคราว ดูสินค้าและราคาได้ตามปกติ
    ถ้าต้องการสั่งซื้อ ทักไลน์ของร้านได้เลย
  </div>

  <div id="body">
    <div class="state"><div class="spin"></div>กำลังโหลดสินค้าจากระบบ…</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var $ = function (s) { return document.querySelector(s) };
var DATA = null, curCat = '', curQ = '';

var baht = function (n) {
  return '฿' + Number(n || 0).toLocaleString('th-TH',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
};
function toast(m) {
  var t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on') }, 2200);
}

/* ลิงก์ LINE OA แนบข้อความไปด้วยไม่ได้ทุกเครื่อง คัดลอกไว้ให้ก่อนแล้วค่อยเปิดแชท */
function copyMsg(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(text);
  } catch (e) { if (navigator.clipboard) navigator.clipboard.writeText(text); }
}
/* หน้านี้ถูกฝังอยู่ใน iframe ของ Google — window.open ถูกบล็อกบ่อย
   ถ้าเปิดแท็บใหม่ไม่ได้ ให้พาทั้งหน้าไปแทน ดีกว่ากดแล้วเงียบ */
function openUrl(u) {
  if (!u) return;
  var w = null;
  try { w = window.open(u, '_blank') } catch (e) {}
  if (!w) { try { top.location.href = u } catch (e) { location.href = u } }
}
function askOnLine(p) {
  copyMsg('สนใจสินค้า: ' + p.name + (p.sku ? ' (' + p.sku + ')' : '') + '\nราคา ' + baht(p.price));
  if (DATA && DATA.shop.line) {
    toast('คัดลอกชื่อสินค้าให้แล้ว วางในแชทได้เลย');
    setTimeout(function () { openUrl(DATA.shop.line) }, 500);
  } else {
    toast('คัดลอกชื่อสินค้าแล้ว — ร้านยังไม่ได้ใส่ลิงก์ไลน์');
  }
}

function shown() {
  var q = curQ.trim().toLowerCase();
  return DATA.items.filter(function (p) {
    if (curCat && p.group !== curCat) return false;
    if (!q) return true;
    return (p.name + ' ' + p.sku + ' ' + p.group).toLowerCase().indexOf(q) > -1;
  });
}

function card(p) {
  var out = !!p.out;
  return '<article class="card' + (out ? ' is-out' : '') + '">'
    + '<div class="card-img">'
      + (p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">'
               : '<div class="ph">' + esc(p.name) + '</div>')
      + (out ? '<div class="out-tag"><span>สินค้าหมด</span></div>' : '')
    + '</div>'
    + '<div class="card-bd">'
      + '<h3>' + esc(p.name) + '</h3>'
      + (p.sku ? '<div class="sku">' + esc(p.sku) + '</div>' : '')
      + '<div class="meta">' + esc(p.unit || 'ชิ้น')
        + (Number(p.perPack) > 1 ? ' · แพ็ก ' + p.perPack : '')
        + ' · ' + (out ? 'สินค้าหมด' : 'พร้อมส่ง') + '</div>'
      + '<div class="price">' + baht(p.price) + '</div>'
      + '<button class="ask" data-ask="' + esc(p.sku) + '"' + (out ? ' disabled' : '') + '>'
        + (out ? 'สินค้าหมด' : 'สอบถาม / สั่งซื้อทางไลน์') + '</button>'
    + '</div></article>';
}

function draw() {
  var list = shown();
  var cats = '<button data-cat=""' + (curCat ? '' : ' class="on"') + '>ทั้งหมด</button>'
    + DATA.cats.map(function (g) {
        return '<button data-cat="' + esc(g) + '"' + (curCat === g ? ' class="on"' : '') + '>'
          + esc(g) + '</button>';
      }).join('');

  var body = '<div class="cats">' + cats + '</div>'
    + '<div class="count">' + list.length + ' รายการ</div>'
    + (list.length
        ? '<div class="grid">' + list.map(card).join('') + '</div>'
        : '<div class="state"><b>ไม่พบสินค้า</b>ลองเปลี่ยนคำค้น หรือเลือกหมวดอื่น</div>');

  if (DATA.shop.line) {
    body += '<div class="line-card"><h3>สั่งซื้อและสอบถามทางไลน์</h3>'
      + '<p>แอดเป็นเพื่อนเพื่อสั่งซื้อ ขอใบเสนอราคา และติดตามพัสดุได้ในแชทเดียว</p>'
      + '<button id="btn-line">แอดไลน์ร้าน</button></div>';
  }
  body += '<div class="foot">' + esc(DATA.shop.full || DATA.shop.name)
    + (DATA.shop.tel ? '<br>โทร ' + esc(DATA.shop.tel) : '')
    + (DATA.shop.addr ? '<br>' + esc(DATA.shop.addr) : '') + '</div>';

  $('#body').innerHTML = body;
}

function failed(msg) {
  $('#body').innerHTML = '<div class="state"><b>โหลดสินค้าไม่สำเร็จ</b>'
    + esc(msg || 'ลองใหม่อีกครั้ง ถ้ายังไม่ได้ให้ทักไลน์ของร้าน')
    + '<br><button id="retry">ลองใหม่</button></div>';
}

function load() {
  google.script.run
    .withSuccessHandler(function (d) {
      DATA = d;
      $('#shop-name').textContent = d.shop.name || 'ร้านของเรา';
      $('#shop-sub').textContent = d.shop.full || 'สินค้าและราคาล่าสุดจากระบบของร้าน';
      document.title = d.shop.name || 'ร้านของเรา';
      $('#closed').style.display = d.open ? 'none' : '';
      draw();
    })
    .withFailureHandler(function (e) { failed(e && e.message ? e.message : String(e)) })
    .shopData();
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-cat],[data-ask],#btn-line,#retry');
  if (!t) return;
  if (t.id === 'retry') {
    $('#body').innerHTML = '<div class="state"><div class="spin"></div>กำลังโหลดสินค้า…</div>';
    load(); return;
  }
  if (t.id === 'btn-line') { openUrl(DATA && DATA.shop.line); return; }
  if (t.dataset.cat !== undefined) { curCat = t.dataset.cat; draw(); return; }
  if (t.dataset.ask) {
    var p = DATA.items.find(function (x) { return x.sku === t.dataset.ask });
    if (p) askOnLine(p);
  }
});
$('#q').addEventListener('input', function (e) { curQ = e.target.value; if (DATA) draw(); });

load();
</script>
</body></html>
