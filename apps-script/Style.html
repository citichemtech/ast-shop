<!--
  หน้าตาของทั้งระบบ — ใช้ร่วมกันทั้งแอปคีย์ออเดอร์และแอปสต๊อก

  แยกออกมาเพราะสองแอปนี้เสิร์ฟคนละลิงก์แต่ต้องหน้าตาเหมือนกัน
  ถ้าปล่อยให้ต่างคนต่างมี CSS ของตัวเอง วันที่แก้สีปุ่มที่เดียว
  อีกแอปจะเพี้ยนไปเงียบ ๆ แล้วไม่มีใครสังเกตจนกว่าจะมีคนทัก
-->
<style>
/* ชุดสีดูดมาจากภาพตัวอย่างที่เจ้าของร้านส่งมา (10 ก.ย.) — ของเดิมเป็นโทนเทากลาง
   ซึ่งบนจอมือถือกลางแดดอ่านแล้ว "จืด" ชุดนี้เปลี่ยนสองเรื่องพร้อมกัน
     พื้นหลังกับเส้นขอบ เปลี่ยนจากเทาเป็นฟ้าจาง ทั้งหน้าจึงมีโทนเดียวกับหัวจอ
     ตัวหนังสือเข้มขึ้นทั้งชุด ตัวหลักเกือบดำ ตัวรองเข้มกว่าเดิมสองระดับ
   ค่าที่วัดได้จากภาพ: ปุ่ม #014dd6 · ตัวหนังสือ #000 · ตัวรอง #525d78 ·
   พื้น #f1f7fe · เส้น #dfeaf9 */
:root{
  --ink:#0b0f18; --gray:#525d78; --line:#d7e5f8; --bg:#eef5fe; --card:#fff;
  --blue:#0b4bd2; --green:#08814a; --red:#c40215; --amber:#a35c00;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ขนาดตัวอักษรทั้งแอปคิดจากขนาดรากตัวเดียว (rem) ปุ่ม ก- / ก+ บนหัวจอ
   จึงย่อขยายได้ทั้งหน้าพร้อมกัน โดยสัดส่วนทุกอย่างยังเท่าเดิม
   ค่าเริ่มต้น 20px ขึ้นจากเดิม 17px เพราะเจ้าของร้านอ่านของเดิมไม่ถนัด */
html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Prompt",sans-serif;
  padding-bottom:76px}

/* ปุ่มมุมขวาบน — มีคำกำกับใต้ปุ่ม เพราะ "?" กับ "ก−" ลำพังเดาหน้าที่ไม่ออก
   คำกำกับวาดด้วย ::after จาก data-cap จึงไม่ต้องเพิ่ม element ให้ HTML รก */
.fsz{margin-left:auto;display:flex;gap:7px;flex:none;align-items:flex-start}
.fsz button{position:relative;width:40px;height:40px;border:1px solid rgba(255,255,255,.5);
  border-radius:11px;background:rgba(255,255,255,.16);color:#fff;font-weight:800;
  font-size:0.9rem;padding:0;line-height:1;display:block}
.fsz button::after{content:attr(data-cap);position:absolute;left:50%;top:calc(100% + 3px);
  transform:translateX(-50%);font-size:0.6rem;font-weight:400;opacity:.85;white-space:nowrap}
.fsz button:active{background:rgba(255,255,255,.32)}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
textarea{resize:vertical}

/* หัวจอ — ไล่สีน้ำเงินกับแถบแสงเฉียง ให้ดูเป็นแอปของร้าน ไม่ใช่หน้าเว็บเปล่า ๆ
   แถบแสงวาดด้วย gradient ไม่ใช่ไฟล์รูป จึงคมทุกความละเอียดจอและไม่กินที่เพิ่มเลย */
.top{position:relative;overflow:hidden;color:#fff;padding:15px 16px 18px;
  border-radius:0 0 26px 26px;display:flex;align-items:flex-start;gap:12px;
  background:linear-gradient(115deg,#013690 0%,#032c7d 32%,#014eb2 62%,#0350bb 100%)}
.top::after{content:"";position:absolute;top:-40%;right:-6%;width:56%;height:190%;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.15) 50%,
    rgba(255,255,255,0) 57%,rgba(255,255,255,.09) 68%,rgba(255,255,255,0) 75%);
  transform:rotate(9deg);pointer-events:none}
.top>*{position:relative;z-index:1}
.top .logo{width:62px;height:62px;border-radius:50%;background:#fff;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--blue);font-size:0.82rem;
  box-shadow:0 0 0 3px rgba(255,255,255,.32),0 2px 10px rgba(0,0,0,.22)}
.top .logo img{width:100%;height:100%;object-fit:cover}
.top .ttl{min-width:0;flex:1}
/* ชื่อร้านมาจากชีท ยาวสั้นไม่แน่นอน — ปล่อยให้ตกบรรทัดได้ ห้ามตัดท้ายด้วยจุดสามจุด
   ชื่อร้านที่อ่านไม่ครบแย่กว่าหัวจอสูงขึ้นหนึ่งบรรทัด */
.top b{display:block;font-size:1.12rem;font-weight:800;line-height:1.2;letter-spacing:-.012em;
  text-transform:uppercase}
/* คำโปรยใต้ชื่อร้าน — เขียนไว้ในหน้าเว็บ ไม่ได้ดึงจากชีท เพราะเป็นคำของแบรนด์
   ไม่ใช่ข้อมูลที่เปลี่ยนตามการใช้งาน */
.top .tag-en{display:block;font-size:0.76rem;font-style:italic;opacity:.85;margin-top:1px}
.top .who{display:block;margin-top:5px;font-size:0.8rem;opacity:.92;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .who::before{content:"✉ ";opacity:.85}

.wrap{padding:14px;max-width:720px;margin:0 auto}
/* จอกว้าง (จอพับ แท็บเล็ต คอมออฟฟิศ) ใช้พื้นที่เต็ม ไม่เหลือขอบว่างสองข้าง */
@media (min-width:900px){ .wrap{max-width:1100px;padding:18px 24px} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:0.82rem;color:var(--gray);margin-bottom:5px;font-weight:600}
/* สองช่องเรียงข้างกัน — พอป้ายเป็นสองภาษาพร้อมไอคอน ช่องละครึ่งจอแคบเกินไป
   ชื่อป้ายจะตกบรรทัดจนสองช่องสูงไม่เท่ากันและอ่านยาก บนมือถือจึงเรียงลงมาแทน */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:430px){ .two{grid-template-columns:1fr;gap:0} }
.hint{font-size:0.8rem;color:var(--gray);margin-top:5px;line-height:1.5}
.subhd{font-size:0.85rem;font-weight:700;color:var(--gray);margin:16px 0 8px;letter-spacing:.02em}
/* หัวข้อย่อยในกล่อง — ใช้ในหน้ารับของ นำเข้า Shopee และช่องลายเซ็น */
.sec-hd{margin-bottom:10px}
.sec-hd h2{font-size:1.02rem;font-weight:800;letter-spacing:-.01em}

.btn{width:100%;padding:14px;border:0;border-radius:11px;background:var(--blue);color:#fff;
  font-weight:700;font-size:1.03rem}
.btn[disabled]{opacity:.55}
/* ลิงก์ที่หน้าตาเป็นปุ่ม — <a> เป็น inline โดยธรรมชาติ ถ้าไม่บอกให้เป็นบล็อก
   จะได้ปุ่มแคบ ๆ ที่มีขีดใต้ ดูไม่เข้าพวกกับปุ่มอื่นในหน้าเดียวกัน */
a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none;
      margin-bottom:10px}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:#00B900}
/* แถวปุ่มขอเอกสารบนหัวฟอร์ม — เรียงสามปุ่มเท่ากัน กดง่ายด้วยนิ้วหัวแม่มือ */

/* ติ๊กชื่อเอกสารที่จะให้ขึ้นเข้มบนหัวใบ — สองคอลัมน์ กดด้วยนิ้วหัวแม่มือได้ */
.fchk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.fchk label{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;background:#fff;cursor:pointer;line-height:1.3}
.fchk label:has(input:checked){border-color:var(--blue);background:#eef3fc;font-weight:700}
.fchk input{width:auto;flex:none;padding:0;transform:scale(1.3)}
@media (max-width:400px){ .fchk{grid-template-columns:1fr} }

.mini{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:0.85rem}
.mini.red{color:var(--red);border-color:#f0c9c9}

/* ปุ่มวางที่อยู่จากแชท — ปุ่มเดียวที่เหลือบนหัวฟอร์ม จึงให้เต็มความกว้างและกดง่าย
   ลูกค้าวางที่อยู่มาเป็นก้อนแทบทุกใบ ปุ่มนี้คือทางลัดที่ใช้บ่อยที่สุดของหน้านี้ */
.pastebtn{display:block;width:100%;padding:15px 14px;border:1.5px solid #2f4858;
  border-radius:999px;background:linear-gradient(180deg,#f2fbfd,#e8f4f8);
  color:var(--gray);font-size:1rem;font-weight:600;letter-spacing:.01em}
.pastebtn:active{background:#dceaf0}

/* แบนเนอร์หัวงาน — ไอคอนกลม · ชื่องานภาษาไทย · คำอธิบายบรรทัดเล็ก · ปุ่มลงมือทางขวา
   ใช้ซ้ำได้ทั้งช่องวางที่อยู่จากแชทและหน้านำเข้า Shopee จะได้เป็นภาษาเดียวกันทั้งแอป */
.banner{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:12px;
  border:1.5px solid #bcd6f5;border-radius:999px;
  background:linear-gradient(100deg,#eaf3ff 0%,#dceaff 55%,#e9f1ff 100%);
  box-shadow:0 2px 10px rgba(21,73,180,.10)}
.banner .bn-ic{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.35rem;
  box-shadow:0 1px 5px rgba(21,73,180,.18)}
.banner .bn-ic img{width:26px;height:26px;object-fit:contain}
.banner .bn-tx{flex:1;min-width:0}
.banner .bn-tx b{display:block;font-size:0.98rem;font-weight:800;color:#123a7a;line-height:1.25}
.banner .bn-tx em{display:block;font-style:normal;font-size:0.74rem;color:#5a7196;
  margin-top:2px;line-height:1.35}
.banner .bn-go{flex:none;border:0;border-radius:999px;padding:11px 16px;color:#fff;
  font-weight:800;font-size:0.86rem;background:linear-gradient(180deg,#2f7bf0,#1550c8);
  box-shadow:0 2px 8px rgba(21,73,180,.35)}
.banner .bn-go:active{background:#1246ad}
@media (max-width:400px){
  .banner{border-radius:20px;flex-wrap:wrap}
  .banner .bn-go{width:100%;order:3}
}

/* ป้ายช่องกรอกสองภาษาพร้อมไอคอนกลม — ไทยตัวหนา อังกฤษบรรทัดเล็กใต้ลงมา
   ป้ายไหนไม่ได้ใส่ data-en ก็ยังขึ้นไทยอย่างเดียวเหมือนเดิม ไม่ต้องแก้ทุกช่องพร้อมกัน */
.fld label[data-en]{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.fld label[data-en] .li{flex:none;width:34px;height:34px;border-radius:50%;background:#eaf1fd;
  display:flex;align-items:center;justify-content:center;font-size:0.95rem}
.fld label[data-en] .lt{min-width:0}
.fld label[data-en] .lt b{display:block;font-size:0.9rem;color:var(--ink);font-weight:800}
.fld label[data-en]::after{content:none}
.fld label[data-en] .lt em{display:block;font-style:normal;font-size:0.72rem;color:var(--gray);
  font-weight:500;margin-top:1px}

.it{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px;background:#fbfcfd}
.it .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.it .hd b{font-size:0.82rem;color:var(--gray)}
.it .hd .rm{margin-left:auto}
.it .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lotline{font-size:0.8rem;margin-top:6px;line-height:1.5}
/* แถวเติมน้ำยา — ชื่อยาวอ่านได้ ช่องจำนวนอยู่ขวาสุดนิ้วโป้งถึง กดรัวได้ทั้งคอลัมน์ */
.rf-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.rf-row:last-child{border-bottom:0}
.rf-nm{flex:1;min-width:0;line-height:1.35}
.rf-nm b{display:block;font-weight:600;font-size:0.92rem}
.rf-nm em{display:block;font-style:normal;font-size:0.76rem;color:var(--gray)}
.rf-q{width:88px;flex:none;text-align:right}
.lotline.warn{color:var(--amber)}
.lotline.bad{color:var(--red);font-weight:600}
.lotline.ok{color:var(--green)}

.sum{display:flex;justify-content:space-between;padding:7px 0;font-size:0.91rem}
.sum.big{font-size:1.18rem;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

.row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .i{flex:1;min-width:0}
.row .i b{display:block}
.row .i span{font-size:0.82rem;color:var(--gray)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* จอแคบ: ปุ่มห้าอันเบียดจนชื่อลูกค้ากับเลขออเดอร์ตกบรรทัดทีละคำ อ่านยาก
   ให้ปุ่มลงไปอยู่แถวของตัวเองเต็มความกว้างแทน ข้อความจะได้เต็มบรรทัด */
@media (max-width:430px){
  .row .i{flex:0 0 100%}
  .row .acts{flex:0 0 100%;justify-content:flex-start;margin-top:8px}
}
/* กล่องถามเหตุผลตอนยกเลิกเอกสาร กินเต็มความกว้างของแถว ไม่เบียดปุ่ม */
.row{flex-wrap:wrap}
.vdbox{flex:0 0 100%;margin-top:10px;padding:11px;border:1px solid #f0c9c9;
  border-radius:10px;background:#fff7f7}
.vdbox input{margin:0}
.row .i span+span{display:block;margin-top:2px}
/* ป้ายสถานะเป็นชิปกลม ๆ ต้องอยู่ต่อท้ายยอดเงินในบรรทัดเดียวกัน
   กฎ span+span ด้านบนมีไว้ให้ที่อยู่ขึ้นบรรทัดใหม่ ไม่ได้ตั้งใจให้ชิปยืดเต็มแถว */
.row .i span+span.tag{display:inline-block;margin-top:0}
.sq{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:0.94rem;padding:0}
.sq.red{color:var(--red);border-color:#f0c9c9}
/* ปุ่มบนแถวออเดอร์ใช้รูปจริง ขนาดผูกกับตัวอักษร ปุ่ม ก+ ก− จึงขยายไอคอนตามไปด้วย */
.sq .sqic{width:1.5em;height:1.5em;object-fit:contain;display:block;margin:0 auto}
.sq{display:flex;align-items:center;justify-content:center}
/* แปดปุ่มต้องอยู่แถวเดียวกันเสมอ ถ้าตกบรรทัดหนึ่งปุ่มจะดูเหมือนปุ่มแปลกที่ไม่เข้าพวก
   บนจอแคบจึงให้ปุ่มยืดหดเท่า ๆ กันเต็มความกว้างแถวแทนการขึ้นบรรทัดใหม่
   เจาะจงเฉพาะแถวออเดอร์ ไม่ใช่ทุกแถวที่มีปุ่ม — แถวรายการเอกสารใช้ปุ่มตัวหนังสือ
   ถ้าโดนบีบไม่ให้ตกบรรทัด คำว่า "ทำเป็นออเดอร์" จะถูกหั่นเป็นตัวละบรรทัด */
@media (max-width:520px){
  #list .row .acts{flex-wrap:nowrap;gap:5px}
  #list .row .acts .sq{flex:1 1 0;width:auto;min-width:0}
}
/* ปุ่มตัวหนังสือบนแถวเอกสาร กว้างเท่าที่ข้อความต้องการ ล้นก็ตกบรรทัดทั้งปุ่ม */
.row .acts .mini{flex:0 0 auto;white-space:nowrap}

/* สามเหลี่ยมสีหน้าชื่อลูกค้า บอกว่าใบนี้ต้องทำอะไรต่อ — วาดด้วย border ไม่ใช้ไฟล์รูป
   จึงคมทุกความละเอียดจอ และเปลี่ยนสีได้ทันทีโดยไม่ต้องโหลดอะไรเพิ่ม */
.flag{display:inline-block;width:0;height:0;vertical-align:1px;margin-right:7px;
  border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #ccc}
.flag.pay{border-bottom-color:#0047c2}
.flag.noac{border-bottom-color:#c40215}
.flag.rdy{border-bottom-color:#86d76d}
.flag.sent{border-bottom-color:#fedb04}
/* คำอธิบายสี วางไว้เหนือลิสต์ครั้งเดียว ไม่ใช่ซ้ำทุกแถว */
.flagkey{display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 2px 10px;
  font-size:0.74rem;color:var(--gray)}
.flagkey span{display:flex;align-items:center;gap:5px}
.flagkey i{margin:0}
.tag{display:inline-block;font-size:0.8rem;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--gray)}
.tag.ok{background:#e6f5ec;color:var(--green)}
.tag.wait{background:#fdf1e0;color:var(--amber)}
.tag.bad{background:#fbe9e9;color:var(--red)}
/* ช่องทางขายที่มีตราของตัวเอง — โลโก้เล็ก ๆ กับสีประจำแบรนด์
   ให้กวาดตาหาเจอในลิสต์ยาว ๆ ว่าใบไหนมาจากไหน โดยไม่ต้องอ่านทีละบรรทัด
   ไอคอนใช้ vertical-align กับ margin ให้นั่งพอดีกับบรรทัด ไม่ดันบรรทัดให้สูงขึ้น
   ต้องเจาะจงกว่า ".row .i span" ที่ทาสีเทาไว้ทั้งบรรทัด ไม่งั้นสีแบรนด์แพ้ */
.chan-shopee, .chan-fb,
.row .i span.chan-shopee,
.row .i span.chan-fb{font-weight:700;white-space:nowrap}
.chan-shopee, .row .i span.chan-shopee{color:#ee4d2d}
.chan-fb,     .row .i span.chan-fb    {color:#1877f2}
.chan-ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px;display:inline-block}

.pv{border:1px solid var(--blue);border-radius:11px;padding:12px;margin:10px 0;background:#f7f9ff}
.pv .r{display:flex;gap:8px;padding:5px 0;font-size:0.8rem;border-bottom:1px dashed #dfe4ee}
.pv .r:last-of-type{border-bottom:0}
.pv .r i{width:104px;flex:none;color:var(--gray);font-style:normal;font-size:0.8rem}
.pv .r b{flex:1;font-weight:600;word-break:break-word}
.pv .r.miss b{color:var(--red);font-weight:500}
.pv .r.opt i{opacity:.65}

.msg{padding:11px 12px;border-radius:10px;font-size:0.8rem;line-height:1.6;margin-bottom:11px;display:none}
.msg.on{display:block}
.msg.err{background:#fbe9e9;color:#8f1d1d;border:1px solid #f0c9c9}
.msg.ok{background:#e6f5ec;color:#0a6b3c;border:1px solid #bfe4cf}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
/* ปุ่มมีเส้นคั่นระหว่างกัน กวาดตาแล้วเห็นว่าเป็นหกช่องแยกกัน ไม่ใช่ข้อความยาวพืด
   ปุ่มที่ยืนอยู่มีขีดสั้น ๆ ใต้ปุ่ม บอกตำแหน่งได้แม้มองแวบเดียว */
.tabs button{position:relative;flex:1;min-width:0;border:0;background:none;padding:8px 2px 9px;
  font-size:0.76rem;color:var(--gray);display:flex;flex-direction:column;align-items:center;
  gap:2px;line-height:1.2;text-align:center}
.tabs button+button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;
  width:1px;background:var(--line)}
.tabs button b{font-weight:700;display:block}
.tabs button em{font-style:normal;font-size:0.62rem;opacity:.75;display:block}
.tabs button.on{color:var(--blue)}
.tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:2px;width:26px;height:3px;border-radius:99px;background:var(--blue)}
/* ไอคอนเป็นรูปจริง ความสูงผูกกับขนาดตัวอักษร ปุ่ม ก+ ก− จึงขยายไอคอนตามไปด้วย
   ปุ่มที่เลือกอยู่ให้ไอคอนเข้มเต็มที่ ปุ่มอื่นหรี่ลงหน่อยเพื่อให้รู้ว่ายืนอยู่หน้าไหน */
/* กำหนดความสูง ปล่อยความกว้างให้เต็มช่อง — ไอคอนแต่ละอันสัดส่วนไม่เท่ากัน
   ป้าย ORDER เป็นแนวนอนยาว ถ้าบังคับให้เป็นสี่เหลี่ยมจัตุรัสมันจะลีบจนเล็กกว่าเพื่อน
   แบบนี้ทุกอันสูงเท่ากันและกว้างตามธรรมชาติของรูป */
.tabs button img{height:1.6em;width:100%;object-fit:contain;display:block;
  opacity:.55;transition:opacity .15s}
.tabs button.on img{opacity:1}
/* ชื่อปุ่มยาวขึ้นตามที่เจ้าของร้านตั้ง (ออเดอร์ทั้งหมด · รับเข้าสินค้า · ใบเสนอราคา)
   หกปุ่มบนจอมือถือจึงตกสองบรรทัดแน่นอน ย่อตัวอักษรกับระยะบรรทัดลงให้แถบไม่สูงจน
   กินที่อ่านข้อมูล แต่พื้นที่ที่นิ้วกดยังเต็มความกว้างของปุ่มเหมือนเดิม */
@media (max-width:460px){
  .tabs button{font-size:0.66rem;padding:6px 1px 9px;letter-spacing:-.02em}
  .tabs button em{font-size:0.56rem}
  .tabs button img{height:1.5em}
}
/* ชื่อร้านกับคำโปรยบนจอแคบ ย่อลงหน่อยจะได้ไม่ตกสามบรรทัด */
@media (max-width:430px){
  .top{padding:13px 13px 16px;gap:10px}
  .top .logo{width:54px;height:54px}
  .top b{font-size:0.98rem}
  /* คำโปรยเป็นคำของแบรนด์ ไม่ใช่ข้อมูล ตกบรรทัดแล้วดันหัวจอสูงโดยไม่ได้อะไรเพิ่ม */
  .top .tag-en{font-size:0.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .who{font-size:0.74rem}
  .fsz button{width:36px;height:36px;font-size:0.82rem}
}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);display:none;align-items:flex-end}
.modal.on{display:flex}
.modal .sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:640px){.modal{align-items:center;justify-content:center}
  .modal .sheet{max-width:600px;border-radius:16px}}
/* ปุ่มปิดต้องมีจริง ๆ — บนมือถือพื้นที่นอกกล่องแทบไม่เหลือให้กด */
.m-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.m-hd h3{flex:1;font-size:1rem;min-width:0}
.m-x{width:36px;height:36px;flex:none;border:1px solid var(--line);background:#fff;
  border-radius:9px;font-size:0.88rem;color:var(--gray);padding:0}

#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:90;
  background:#15181d;color:#fff;padding:11px 18px;border-radius:99px;font-size:0.8rem;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--gray);padding:34px 12px;font-size:0.82rem}
.empty b{display:block;color:var(--ink);margin-bottom:5px}
.load{text-align:center;color:var(--gray);padding:40px 12px}
/* ---------------- หน้าสรุปยอด ----------------
   ตัวเลขหลักเป็น "ป้ายตัวเลข" ไม่ใช่กราฟ เพราะมันคือค่าเดียว ไม่ได้เปรียบเทียบอะไร
   ส่วนที่เทียบกันจริง (ค่ายขนส่ง ช่องทาง สินค้า) เป็นแท่งนอน เพราะชื่อไทยยาว
   แท่งใช้สีเดียวทั้งหมด — แต่ละกล่องมีชุดข้อมูลชุดเดียว ไม่ต้องใช้สีแยกตัวตน
   ชื่อกับตัวเลขเป็นตัวหนังสือสีปกติ ไม่เอาสีของแท่งมาใส่ตัวหนังสือ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:0.8rem;color:var(--gray)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi span{display:block;font-size:0.8rem;color:var(--gray)}
.kpi b{display:block;font-size:1.24rem;line-height:1.25;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1 / -1}
.kpi.good b{color:var(--green)}

/* ---------------- หน้าค้างชำระ ----------------
   แถบกรองสี่กลุ่มด้านบน กดแล้วดูเฉพาะกลุ่มนั้น ตัวเลขมุมขวาบอกว่ามีกี่ใบ
   ไอคอนเป็นรูปจริง เหมือนแถบล่าง เพราะกวาดตาหาเจอเร็วกว่าอ่านตัวหนังสือ */
.paytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.paytabs button{position:relative;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:9px 3px 8px;display:flex;flex-direction:column;align-items:center;
  gap:5px;font-size:0.7rem;line-height:1.15;color:var(--gray);text-align:center}
.paytabs button img{height:26px;width:100%;object-fit:contain;display:block;opacity:.5}
.paytabs button.on{border-color:var(--blue);background:#f4f8ff;color:var(--ink);font-weight:700}
.paytabs button.on img{opacity:1}
.paytabs button i{position:absolute;top:-6px;right:-4px;min-width:19px;height:19px;
  border-radius:99px;background:var(--gray);color:#fff;font-style:normal;font-size:0.68rem;
  font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.paytabs button.on i{background:var(--blue)}

/* สถานะเงินของแถว — เส้นบาง ๆ กับตัวหนังสือสี ไม่ใช่แถบสีเต็มแท่ง
   แถบสีทึบเต็มความกว้างทุกแถวทำให้ทั้งหน้าแดงไปหมด แล้วสีแดงก็หมดความหมาย
   เส้นบางพอให้กวาดตาเห็นว่าแถวไหนเป็นสีอะไร โดยไม่กลบข้อมูลที่ต้องอ่านจริง ๆ */
/* แฟ้มเอกสาร — ใบคนละชนิดอยู่คนละแฟ้ม ไม่กองรวมกันเป็นรายการเดียว
   ใบเสนอราคาคือใบที่ยัง "อาจจะขาย" · ใบกำกับภาษีคือใบที่ขายไปแล้วและแจ้งสรรพากรแล้ว
   สองอย่างนี้ความสำคัญคนละชั้น เอามาเรียงปนกันคือหาใบที่ต้องใช้จริงไม่เจอ */
.fold{display:flex;align-items:center;gap:11px;border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;margin-bottom:8px;background:var(--card);
  cursor:pointer}
.fold:active{background:var(--bg)}
/* รูปหน้าแฟ้มเป็นภาพถ่ายพื้นขาว จึงต้องมีกรอบขาวของตัวเองให้ดูตั้งใจ
   ไม่ใช่รูปสี่เหลี่ยมขาวลอยอยู่บนพื้นการ์ดที่เปลี่ยนสีตอนกด */
.fold-ic{flex:0 0 auto;width:50px;height:64px;border-radius:10px;
  background:#fff;border:1px solid var(--line);object-fit:cover;display:block}
.fold-em{font-size:1.7rem;line-height:64px;text-align:center;border:0;background:none}
.fold-tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.fold-tx b{font-size:0.97rem}
.fold-tx em{font-style:normal;font-size:0.76rem;color:var(--gray)}
.fold-n{flex:0 0 auto;font-size:0.82rem;font-weight:700;color:var(--blue);
  white-space:nowrap}
/* แฟ้มเปล่าต้องดูออกว่าเปล่า ไม่ใช่กดแล้วเจอหน้าว่างเปล่าแล้วสงสัยว่าแอปพัง */
.fold.none{cursor:default;opacity:0.55}
.fold.none .fold-n{color:var(--gray);font-weight:400}
/* หัวข้อสามกองในแฟ้ม — สีต้องต่างกันพอให้กวาดตาเจอตั้งแต่ยังไม่อ่าน
   กองยกเลิกคือกองที่หยิบผิดแล้วเดือดร้อนที่สุด จึงเป็นกองเดียวที่ได้สีแดง */
/* ---------------- หน้ารับเงิน ----------------
   QR ต้องใหญ่พอให้กล้องมือถืออีกเครื่องจับได้จากบนจอ ไม่ใช่แค่ตอนพิมพ์ออกมา
   และพื้นขาวรอบ QR (quiet zone) ห้ามหาย ไม่งั้นบางแอปสแกนไม่ติด */
.qr{width:min(320px,72vw);height:auto;
    border:1px solid var(--line);border-radius:12px;background:#fff}
/* ข้อความเรียกเก็บเงิน โชว์ตลอด ไม่ใช่ .msg ที่ซ่อนไว้จนกว่าจะมีเรื่องแจ้ง */
/* แถวบัญชี — ไอคอนธนาคารซ้าย รายละเอียดขวา ไอคอนไม่ยืดไม่หดตามข้อความ */
.bankrow{display:flex;gap:12px;align-items:center}
.bankic{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:block}
.paymsg{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:0.86rem;
        line-height:1.65;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:12px 13px;margin:0 0 11px}
.ok-note{padding:9px 11px;border-radius:0 8px 8px 0;margin-top:9px;
         border-left:3px solid var(--green);background:#f2fbf6}
.subhd.grp-revised{color:var(--blue)}
.subhd.grp-dead{color:var(--red)}

/* ตารางสรุปรายเดือน — บนมือถืออ่านเป็นการ์ดต่อเดือน ไม่ใช่ตารางที่ต้องเลื่อนข้าง */
.mrow{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;
  background:var(--card)}
.mrow .mhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .mhd b{font-size:1.02rem}
.mrow .mhd span{font-size:0.78rem;color:var(--gray)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;margin-top:9px}
.mgrid div{font-size:0.86rem;color:var(--gray)}
.mgrid div b{display:block;font-size:1rem;color:var(--ink)}
.mgrid div.net b{color:var(--green)}
.mgrid div.neg b{color:var(--red)}
/* ตัวเลขที่คนกรอกเองต้องแยกออกจากตัวเลขที่ระบบคิด ไม่งั้นจะเถียงกันเองว่าเลขไหนจริง */
.mtyped{display:block;font-size:0.68rem;color:var(--blue);font-weight:700;
  white-space:nowrap;margin-top:1px}
.mrow .medit{margin-top:10px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.mrow .medit input{width:auto;flex:1 1 100%;padding:9px 11px}
.mrow .medit button{flex:0 0 auto}
/* ยอดของเดือนแยกตามช่องทางขาย — ไฟล์รายเดือนที่ร้านมีเป็นยอดของ Shopee ล้วน
   ถ้าวางรวมกันในการ์ดเดียวจะอ่านเป็นยอดทั้งร้านทันที การ์ดซ้อนจึงต้องเห็นชัดว่าซ้อน */
.mchans{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.mchan{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;
  padding:10px 11px;background:var(--bg)}
.mchan .mchd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mchan .mchd b{font-size:0.95rem}
.mchan .mchd span{font-size:0.76rem;color:var(--gray)}
.mchan .medit{margin-top:9px}
.mchan .medit input{background:var(--card)}
/* ป้ายบนช่องกรอก — สามช่องเรียงกันโดยไม่มีป้าย เดาไม่ออกว่าช่องไหนคืออะไร */
.mfld{flex:1 1 120px;display:flex;flex-direction:column;gap:3px}
.mfld>span{font-size:0.74rem;color:var(--gray)}
.mrow .medit .mfld input{flex:0 0 auto;width:100%}
.madd{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.madd select{width:auto;flex:1 1 160px;padding:8px 10px;font-size:0.85rem}
.madd button{flex:0 0 auto}

/* แถบเรียงลำดับหน้าลูกค้า — ตัวหนังสือล้วน ไม่มีไอคอน เพราะสามปุ่มนี้
   เป็นการ "เรียง" ไม่ใช่ "ไปที่ไหน" รูปจะทำให้ดูเหมือนเมนูอีกชั้น */
.sorts{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sorts button{border:1px solid var(--line);background:var(--card);border-radius:99px;
  padding:6px 14px;font-size:0.83rem;color:var(--gray)}
.sorts button.on{border-color:var(--blue);background:#f4f8ff;color:var(--ink);font-weight:700}
/* ทั้งแถวกดได้ ไม่ใช่แค่ชื่อ — นิ้วบนมือถือเล็งตัวหนังสือบรรทัดเดียวยาก */
.cu-row{cursor:pointer}
.cu-row:active{background:#f4f8ff}
.mini-w{width:auto;padding:7px 14px;font-size:0.83rem}
.paybar{display:block;margin-top:7px;font-size:0.8rem;font-weight:700;line-height:1.3}
.paybar::after{content:"";display:block;height:3px;border-radius:99px;margin-top:4px;
  background:currentColor;opacity:.85}
/* ต้องเจาะจงกว่า ".row .i span" ที่ทาสีเทาไว้ทั้งบรรทัด (เรื่องเดียวกับ .chan-shopee)
   ไม่งั้นแถบบอกสถานะเงินจะเป็นสีเทาหมดทุกอัน — ซึ่งเป็นอย่างนั้นมาตลอด
   ทั้งที่ทั้งแถบมีไว้เพื่อให้ใบที่เกินกำหนดชำระสะดุดตาโดยเฉพาะ */
.paybar.paid, .row .i span.paybar.paid{color:#0b9a5b}
.paybar.due,  .row .i span.paybar.due {color:#c40215}
.paybar.cr30, .row .i span.paybar.cr30{color:#a35c00}
.paybar.cod,  .row .i span.paybar.cod {color:#0a63b8}
.paybar.over, .row .i span.paybar.over{color:#8f0110}
.paybar.dead, .row .i span.paybar.dead{color:#8a93a6}
.sq.ok{color:var(--green);border-color:#bfe6cd;font-size:1.05rem}

.brow{margin:12px 0 0}
.brow:first-of-type{margin-top:4px}
.btop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:0.82rem}
.bname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bval{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.btrack{height:8px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0;min-width:3px}

/* ---------------- หน้าปิดยอดวัน ----------------
   หน้าสรุปยอดตอบคำถาม "ช่วงนี้เป็นยังไง" ส่วนหน้านี้ตอบ "วันนั้นขายไปเท่าไร"
   ซึ่งเป็นคนละงานกัน — ปิดยอดคือดูวันเดียวให้ครบทุกใบแล้วจบวัน
   ปุ่ม ◀ ▶ จึงอยู่ติดกับวันที่ เพราะการใช้งานจริงคือเดินทีละวัน ไม่ใช่กระโดดหาช่วง */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.daynav button{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--card);
  border-radius:11px;font-size:0.95rem;color:var(--ink);padding:0}
.daynav button:disabled{color:#c9ced6}
.dymid{flex:1;min-width:0;text-align:center}
.dymid input{margin:0;text-align:center;font-weight:700}
.dywhen{font-size:0.8rem;color:var(--gray);margin-top:4px}
/* แท่งที่กดได้ — ใช้กับ 7 วันย้อนหลัง กดแล้วเด้งไปปิดยอดวันนั้นเลย */
.tapbar{display:block;width:100%;text-align:left;border:0;background:none;padding:0}
.tapbar.on .btrack i{background:var(--green)}
.tapbar.on .bname{color:var(--ink);font-weight:700}
/* รายการตำบล/อำเภอที่ค้นเจอ กดได้ทั้งแถว นิ้วโป้งกดง่ายบนมือถือ */
.thhit{margin-top:6px}
.thhit button{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:6px;
  border:1px solid var(--line);background:#fff;border-radius:9px;font-size:0.9rem;line-height:1.45}
.thhit button b{color:var(--ink)}
.thhit .none{font-size:0.82rem;color:var(--gray);padding:6px 2px}
/* กระดานเซ็นลายเซ็น — ซ้อนเหนือ modal ได้ เพราะบางจอเรียกจากในหน้าต่างที่เป็น modal อยู่แล้ว */
.signwrap{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.55);
  display:flex;align-items:center;justify-content:center;padding:14px}
.signbox{background:#fff;border-radius:16px;padding:15px;width:100%;max-width:520px;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
.signhd{font-weight:700;font-size:1rem;margin-bottom:3px}
.signhint{font-size:0.8rem;color:var(--gray);margin-bottom:9px;line-height:1.5}
/* touch-action:none ไม่งั้นลากนิ้วบนกระดานแล้วหน้าจอเลื่อนตามแทนที่จะเขียนเส้น */
.signcv{width:100%;display:block;border:1.5px dashed var(--line);border-radius:11px;
  background:#fcfcfd;touch-action:none;cursor:crosshair}
.signrow{display:flex;gap:8px;margin-top:11px}
.signrow .btn{margin:0;flex:1}
/* ลายเซ็นที่เก็บไว้แล้ว โชว์ตัวอย่างในหน้าตั้งค่า */
.signprev{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;margin-top:8px}
.signprev canvas{width:100%;display:block}
.giftck{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:0.85rem;color:var(--gray)}
.giftck input{width:auto;transform:scale(1.3)}
/* ปุ่มทำงานต่อหลังบันทึก — พิมพ์ใบปะหน้า / ส่งข้อความ อยู่ในกล่องเขียวเลย
   ไม่ต้องไปตามหาใบที่เพิ่งคีย์ในแท็บออเดอร์อีกที */
.okact{display:flex;gap:8px;margin-top:11px}
.okact button{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--green);
  background:#fff;color:var(--green);font-weight:700;font-size:0.85rem}

/* คู่มือ — พับเก็บทีละหัวข้อ เปิดมาเห็นสารบัญก่อน ไม่ใช่กำแพงตัวหนังสือ */
.hp details{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:9px}
.hp summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;line-height:1.4}
.hp summary::-webkit-details-marker{display:none}
.hp summary::after{content:"＋";float:right;color:var(--gray);font-weight:400}
.hp details[open] summary::after{content:"−"}
.hp details[open] summary{border-bottom:1px solid var(--line)}
.hp .bd{padding:12px 14px 15px;font-size:0.86rem;line-height:1.65}
.hp .bd b{color:var(--ink)}
.hp .bd ol,.hp .bd ul{margin:6px 0;padding-left:20px}
.hp .bd li{margin-bottom:5px}
/* กล่องเตือนสองแบบ เริ่มจากคู่มืออย่างเดียว แต่ที่อื่นก็ต้องเตือนคนเหมือนกัน
   จึงถอดออกมาเป็นของกลาง ขนาดตัวหนังสือติดมาด้วย ไม่งั้นนอกคู่มือจะโตกว่าที่อื่นทั้งหน้า */
.warn,.stop{padding:9px 11px;border-radius:0 8px 8px 0;margin-top:9px;
  font-size:0.86rem;line-height:1.6}
.warn{border-left:3px solid var(--amber);background:#fffaf1}
.stop{border-left:3px solid var(--red);background:#fff6f6}
.hp .bd .warn,.hp .bd .stop{font-size:inherit;line-height:inherit}
